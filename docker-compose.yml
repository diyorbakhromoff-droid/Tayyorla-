services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tayyorla:tayyorla@db/tayyorla
    volumes:
      - ./media:/app/media
    depends_on: [db]
    restart: unless-stopped

  # Video taklifnomalarni chizadigan alohida xizmat (Chromium + ffmpeg). Navbat ma'lumotlar bazasida.
  renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tayyorla:tayyorla@db/tayyorla
    volumes:
      - ./media:/app/media
    depends_on: [db]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tayyorla
      POSTGRES_PASSWORD: tayyorla
      POSTGRES_DB: tayyorla
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  caddy:
