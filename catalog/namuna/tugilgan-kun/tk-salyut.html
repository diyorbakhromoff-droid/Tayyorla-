<!doctype html>
<html lang="uz" data-rang="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salyut</title>
<meta name="description" content="Tungi osmonda salyut otiladi, uchqunlar yig&#x27;ilib ismni yozadi. Har bosishda yangi salyut.">
<meta property="og:type" content="website">
<meta property="og:title" content="Salyut">
<meta property="og:description" content="Tungi osmonda salyut otiladi, uchqunlar yig&#x27;ilib ismni yozadi. Har bosishda yangi salyut.">
<meta name="theme-color" content="#0E1033">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Manrope:wght@400;600;700;800&amp;display=swap">
<style>
/* ================= Tabrik dvijogi: umumiy uslublar ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden;height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body,17px);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[role=button]:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
.page{position:relative;z-index:1}
.blk{position:relative;padding-block:var(--blk-pad,60px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.blk-hero{padding:0}
.wrap{max-width:var(--maxw,600px);margin:0 auto;position:relative}
.blk-title{font-family:var(--f-display);font-weight:var(--w-display,400);font-size:var(--fs-title,clamp(28px,7.6vw,42px));line-height:1.12;letter-spacing:var(--ls-title,0);text-align:center;text-wrap:balance;margin:0 0 28px;color:var(--title,var(--ink))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius,18px);box-shadow:var(--shadow,none)}

/* --- tabrik matni --- */
.msg{padding:clamp(24px,6.5vw,44px)}
.msg-title{margin-bottom:20px}
.msg-body p{margin:0 0 1em;font-size:var(--fs-msg,1.05em)}
.msg-body p:last-child{margin-bottom:0}
.msg-sign{margin:1.6em 0 0;text-align:right;font-family:var(--f-script,var(--f-display));font-size:var(--fs-sign,1.7em);line-height:1.15;color:var(--accent)}
.msg-sign span{display:block;margin-bottom:4px;font-family:var(--f-body);font-size:15px;color:var(--muted)}

/* --- rasm --- */
.photo-frame{margin:0 auto;max-width:440px;border-radius:var(--radius,18px);overflow:hidden;aspect-ratio:4/5;background:var(--bg2);box-shadow:var(--shadow-photo,0 26px 50px -26px rgba(0,0,0,.5))}
.photo-frame img{width:100%;height:100%;object-fit:cover}

/* --- taymer --- */
.ctr{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ctr-u{flex:1 1 76px;max-width:104px;padding:14px 4px 12px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius,18px) * .7)}
.ctr-u b{display:block;font-family:var(--f-num,var(--f-display));font-size:clamp(26px,7.4vw,36px);line-height:1;font-weight:var(--w-num,600);font-variant-numeric:tabular-nums;color:var(--accent)}
.ctr-u span{display:block;margin-top:7px;font-size:13px;color:var(--muted)}
.ctr-note{text-align:center;margin:18px 0 0;color:var(--muted);font-size:15px;text-wrap:balance}

/* --- galereya --- */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal button{padding:0;border:0;background:var(--bg2);border-radius:calc(var(--radius,18px) * .65);overflow:hidden;cursor:zoom-in;aspect-ratio:3/4}
.gal button.w{grid-column:span 2;aspect-ratio:16/10}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.gal button:hover img{transform:scale(1.04)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,10,12,.94);display:flex;align-items:center;justify-content:center;padding:max(56px,env(safe-area-inset-top,0px)) 12px 40px}
.lb img{max-height:100%;max-width:100%;border-radius:10px;object-fit:contain}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:46px;height:46px;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}
.lb-x{top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.lb-p{left:max(10px,env(safe-area-inset-left,0px));top:calc(50% - 23px)}
.lb-n{right:max(10px,env(safe-area-inset-right,0px));top:calc(50% - 23px)}

/* --- ro'yxat (tilaklar, sabablar, va'dalar) --- */
.lst{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.lst li{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius,18px) * .7)}
.lst li::before{content:var(--lst-mark,'\2726');flex:none;color:var(--accent);font-size:17px;line-height:1.6}

/* --- hikoya (vaqt chizig'i) --- */
.story{list-style:none;margin:0 auto;padding:0 0 0 30px;position:relative;max-width:520px}
.story::before{content:'';position:absolute;left:9px;top:8px;bottom:22px;width:2px;background:linear-gradient(var(--accent),var(--accent2));border-radius:2px}
.story li{position:relative;padding:0 0 30px}
.story li:last-child{padding-bottom:0}
.story li::before{content:'';position:absolute;left:-27px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.story-date{display:block;font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--accent)}
.story h3{margin:3px 0 4px;font-family:var(--f-display);font-weight:var(--w-display,400);font-size:1.4em;line-height:1.2}
.story p{margin:0;color:var(--muted)}

/* --- to'y dasturi --- */
.prog{list-style:none;margin:0 auto;padding:0;max-width:480px}
.prog li{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line)}
.prog li:last-child{border-bottom:0}
.prog time{font-family:var(--f-num,var(--f-display));font-size:1.35em;color:var(--accent);font-variant-numeric:tabular-nums}

/* --- joy va vaqt (to'y) --- */
.place{padding:clamp(26px,7vw,40px) 22px;text-align:center}
.place-date{margin:0;font-family:var(--f-display);font-size:clamp(34px,10vw,52px);line-height:1.05;color:var(--accent)}
.place-sub{margin:6px 0 0;color:var(--muted)}
.place-time{margin:22px 0 0;padding-top:22px;border-top:1px solid var(--line);font-family:var(--f-num,var(--f-display));font-size:1.6em;line-height:1.2}
.place-time span{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.place-loc{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.place-name{margin:0;font-family:var(--f-display);font-size:1.35em;line-height:1.25}
.place-addr{margin:6px 0 0;color:var(--muted);font-size:15px}
.place-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}

/* --- chaqaloq raqamlari --- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats.n3{grid-template-columns:repeat(3,1fr)}
.stat{padding:18px 8px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius,18px) * .7)}
.stat b{display:block;font-family:var(--f-display);font-weight:var(--w-display,400);font-size:1.5em;line-height:1.15;color:var(--accent)}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}

/* --- tugmalar --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:var(--btn-radius,999px);border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;cursor:pointer;transition:transform .2s,filter .2s,background .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn-ghost{background:transparent;color:var(--accent)}

/* --- RSVP --- */
.rsvp{padding:clamp(24px,6vw,36px);text-align:center}
.rsvp>p:first-child{margin:0;font-size:1.1em}
.rsvp-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.rsvp-done p{margin:0;font-family:var(--f-display);font-size:1.35em;line-height:1.3}
.rsvp-done .btn{margin-top:16px}
.rsvp-tel{margin:20px 0 0!important;font-size:14px!important;color:var(--muted)}
.rsvp-tel a{font-weight:600;white-space:nowrap}

/* --- sirli xabar --- */
.scr{position:relative;min-height:190px;display:flex;align-items:center;justify-content:center;padding:30px 26px;text-align:center;overflow:hidden}
.scr p{margin:0;font-family:var(--f-display);font-size:1.35em;line-height:1.4;text-wrap:balance}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;transition:opacity .9s}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0}

/* --- test --- */
.quiz{padding:clamp(22px,6vw,34px)}
.quiz-step{margin:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.quiz-q{margin:6px 0 18px;font-family:var(--f-display);font-size:1.4em;line-height:1.3}
.quiz-opts{display:grid;gap:10px}
.quiz-opts button{text-align:left;padding:14px 16px;border-radius:calc(var(--radius,18px) * .55);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:16px;transition:border-color .2s,background .2s}
.quiz-opts button:hover:not(:disabled){border-color:var(--accent)}
.quiz-opts button.ok{border-color:#2f9e6b;background:rgba(47,158,107,.14)}
.quiz-opts button.no{border-color:#d64545;background:rgba(214,69,69,.12)}
.quiz-res{text-align:center}
.quiz-score{margin:0;font-family:var(--f-num,var(--f-display));font-size:3em;line-height:1;color:var(--accent)}
.quiz-res p{margin:12px 0 18px}

/* --- video --- */
.vid{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--radius,18px);overflow:hidden;background:var(--bg2)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.vid-demo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);border:1.5px dashed var(--line);text-align:center;padding:16px}
.vid-demo p{margin:0;font-size:14px}
.vid-play{width:58px;height:58px;border-radius:50%;background:var(--accent);position:relative}
.vid-play::after{content:'';position:absolute;left:23px;top:18px;border-left:18px solid var(--on-accent);border-top:11px solid transparent;border-bottom:11px solid transparent}

/* --- yakun --- */
.foot{text-align:center;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.foot-sign{margin:0;font-family:var(--f-script,var(--f-display));font-size:1.6em;line-height:1.2;color:var(--ink)}
.foot-sign span{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);margin-bottom:4px}
.foot-for{margin:0;font-size:14px;color:var(--muted)}
.brand{display:inline-flex;align-items:center;gap:6px;margin-top:22px;padding:9px 16px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--line);text-decoration:none;background:var(--surface)}

/* --- musiqa tugmasi --- */
.mus{position:fixed;z-index:50;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 12px 28px -10px var(--accent);cursor:pointer;display:grid;place-items:center;overflow:hidden}
.mus svg{grid-area:1/1;transition:opacity .2s}
.mus i{grid-area:1/1;display:none;width:3px;height:14px;border-radius:2px;background:currentColor;align-self:center;animation:eq .9s ease-in-out infinite}
.mus.on svg{opacity:0}
.mus.on i{display:block}
.mus.on i:nth-of-type(1){transform:translateX(-7px);animation-delay:-.3s}
.mus.on i:nth-of-type(3){transform:translateX(7px);animation-delay:-.6s}
.mus:not(.on)::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 var(--accent);animation:ping 2.2s infinite}
@keyframes eq{0%,100%{height:6px}50%{height:20px}}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--accent);opacity:.6}100%{box-shadow:0 0 0 16px var(--accent);opacity:0}}

/* --- effekt qatlamlari --- */
#fx-back{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;opacity:.8}
#fx-front{position:fixed;inset:0;width:100%;height:100%;z-index:75;pointer-events:none}

/* ================= VIP kirish animatsiyalari ================= */
.intro{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;background:var(--intro-bg,var(--bg2));cursor:pointer;transition:opacity .9s ease,visibility .9s;-webkit-user-select:none;user-select:none;overflow:hidden}
.intro.gone{opacity:0;visibility:hidden}
.intro-cap{position:relative;z-index:6;margin:0;text-align:center;transition:opacity .5s}
.intro-cap b{display:block;font-family:var(--f-script,var(--f-display));font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.15;color:var(--intro-ink,var(--ink))}
.intro-cap span{display:block;margin-top:6px;font-size:15px;color:var(--intro-muted,var(--muted))}
.intro-cap em{display:inline-block;margin-top:18px;font-style:normal;font-size:13px;padding:8px 16px;border-radius:999px;border:1px solid currentColor;color:var(--intro-muted,var(--muted));animation:pulse 2s ease-in-out infinite}
.opening .intro-cap{opacity:0}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* konvert */
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;perspective:900px;animation:float 3.6s ease-in-out infinite}
.env>div{position:absolute;border-radius:8px}
.env-back{inset:0;background:var(--env,var(--accent));filter:brightness(.82)}
.env-letter{left:6%;right:6%;top:6%;bottom:6%;z-index:1;background:var(--paper,#fffaf2);display:flex;justify-content:center;padding-top:9%;font-family:var(--f-script,var(--f-display));font-size:26px;color:#4b3a33;transition:transform 1s .55s cubic-bezier(.3,.7,.2,1)}
.env-front{inset:0;z-index:2;background:var(--env,var(--accent));clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{left:0;right:0;top:0;height:60%;z-index:3;background:var(--env,var(--accent));filter:brightness(1.08);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .7s cubic-bezier(.4,.2,.2,1),z-index 0s .35s}
.env-seal{left:50%;top:60%;z-index:4;width:58px;height:58px;margin:-29px;border-radius:50%!important;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 45%),var(--seal,var(--accent2));display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 0 0 4px rgba(0,0,0,.1);transition:opacity .3s,transform .4s}
.opening .env{animation:none}
.opening .env-seal{opacity:0;transform:scale(1.5)}
.opening .env-flap{transform:rotateX(180deg);z-index:0}
.opening .env-letter{transform:translateY(-58%)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* sovg'a qutisi */
.gift{position:relative;width:min(210px,56vw);aspect-ratio:1/1.06;animation:wiggle 2.6s ease-in-out infinite}
.gift>div{position:absolute}
.gift-box{left:7%;right:7%;bottom:0;height:64%;border-radius:6px;background:var(--gift,var(--accent));box-shadow:inset 0 -18px 30px rgba(0,0,0,.12)}
.gift-box::before,.gift-lid::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:17%;transform:translateX(-50%);background:var(--ribbon,var(--accent2))}
.gift-lid{left:0;right:0;top:22%;height:17%;border-radius:6px;background:var(--gift,var(--accent));filter:brightness(1.1);z-index:2;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.gift-bow{left:50%;top:7%;width:46%;height:20%;margin-left:-23%;z-index:3;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.gift-bow::before,.gift-bow::after{content:'';position:absolute;top:0;width:50%;height:100%;border:9px solid var(--ribbon,var(--accent2));border-radius:50% 50% 10% 50%}
.gift-bow::before{left:0;transform:rotate(-14deg)}
.gift-bow::after{right:0;transform:rotate(14deg) scaleX(-1)}
.gift-glow{left:50%;top:40%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--ribbon,var(--accent2));opacity:0;z-index:1}
.opening .gift{animation:none}
.opening .gift-lid,.opening .gift-bow{transform:translate(38%,-190%) rotate(32deg)}
.opening .gift-glow{animation:glow 1.3s ease-out forwards}
@keyframes wiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}94%{transform:rotate(-3deg)}}
@keyframes glow{0%{opacity:0;box-shadow:0 0 0 0 var(--ribbon,var(--accent2))}30%{opacity:1}100%{opacity:0;box-shadow:0 0 120px 90px var(--ribbon,var(--accent2))}}

/* muhr */
.seal-card{position:relative;width:min(290px,76vw);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:var(--paper,var(--surface));border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.55);transition:transform 1s .35s cubic-bezier(.3,.7,.2,1),opacity .8s .5s}
.seal-card::before{content:'';position:absolute;inset:14px;border:1px solid var(--accent);opacity:.45;border-radius:6px}
.seal{position:relative;width:96px;height:96px;display:grid;place-items:center;font-family:var(--f-display);font-size:40px;color:rgba(255,255,255,.88);text-shadow:0 -1px 0 rgba(0,0,0,.25)}
.seal::before{content:'';position:absolute;inset:-9px;border-radius:46% 54% 50% 50%/52% 46% 54% 48%;background:var(--seal,var(--accent2));filter:brightness(.92)}
.seal::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.35),transparent 40%),var(--seal,var(--accent2));box-shadow:inset 0 0 0 5px rgba(0,0,0,.12),inset 0 0 0 7px rgba(255,255,255,.12)}
.seal b{position:relative;z-index:1;font-weight:400}
.opening .seal{animation:crack .7s ease-in forwards}
.opening .seal-card{transform:translateY(-30px) scale(1.06);opacity:0}
@keyframes crack{30%{transform:scale(1.15)}100%{transform:scale(.2) rotate(40deg);opacity:0}}

/* darvoza */
.intro-doors{background:transparent}
.doors{position:absolute;inset:0;display:flex;perspective:1400px}
.door{flex:1;position:relative;background:var(--door-pattern,none),var(--door,#6b3f22);background-size:var(--door-size,72px 72px),auto;box-shadow:inset 0 0 0 10px rgba(0,0,0,.18),inset 0 0 60px rgba(0,0,0,.45);transition:transform 1.6s cubic-bezier(.6,.05,.25,1)}
.door-l{transform-origin:left center}
.door-r{transform-origin:right center}
.door::after{content:'';position:absolute;top:50%;width:14px;height:64px;margin-top:-32px;border-radius:7px;background:var(--door-knob,#d9b66a);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.door-l::after{right:18px}
.door-r::after{left:18px}
.intro-doors .intro-cap{padding:22px 26px;border-radius:16px;background:var(--door-cap,rgba(0,0,0,.45));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.intro-doors .intro-cap b{color:#fff}
.intro-doors .intro-cap span,.intro-doors .intro-cap em{color:rgba(255,255,255,.85)}
.opening .door-l{transform:rotateY(-108deg)}
.opening .door-r{transform:rotateY(108deg)}

/* ochilish animatsiyasi (hamma tarifda) */
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 130ms + 150ms)}
.popin{animation:pop .8s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 130ms + 150ms)}
html.locked .rise,html.locked .popin{animation-play-state:paused}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
