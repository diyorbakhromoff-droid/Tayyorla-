<style>
:root { --f-display: 'Philosopher', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: var(--card); }
.gz-light { position: absolute; inset: 0; background: radial-gradient(70% 50% at 50% 46%, var(--light) 0%, var(--card) 100%); }
.gz-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--wall) 22%, transparent)); }
.gz-l { position: absolute; left: -360px; top: -640px; width: 1080px; height: 1920px; transform-origin: 540px 960px; will-change: transform; }
.gz-l svg { display: block; width: 1080px; height: 1920px; }
.gz-l.l1 { animation: gz-c1 3.2s cubic-bezier(.5, 0, .3, 1) .5s both; }
.gz-l.l2 { animation: gz-c2 3.2s cubic-bezier(.5, 0, .3, 1) .5s both; }
.gz-l.l3 { animation: gz-c3 3.2s cubic-bezier(.5, 0, .3, 1) .5s both, gz-drift 12s linear 3.7s forwards; }
@keyframes gz-c1 { 0% { transform: scale(1); opacity: 1; } 62% { opacity: 1; } 85% { opacity: 0; } 100% { transform: scale(2.78); opacity: 0; } }
@keyframes gz-c2 { 0% { transform: scale(.6); opacity: 1; } 72% { opacity: 1; } 100% { transform: scale(1.67); opacity: 0; } }
@keyframes gz-c3 { from { transform: scale(.36); } to { transform: scale(1); } }
@keyframes gz-drift { from { transform: scale(1); } to { transform: scale(1.05); } }
.gz-wall { fill: var(--wall); }
.gz-brick { fill: url(#gz-b); }
.gz-panel { fill: var(--ganch); }
.gz-pat { fill: url(#gz-p); }
.gz-edge { fill: none; stroke: var(--line); stroke-width: 3; }
.gz-band { fill: var(--band); }
.gz-dots { fill: none; stroke: var(--ganch); stroke-width: 5; stroke-dasharray: 0 14; stroke-linecap: round; }
.gz-out { fill: none; stroke: var(--line); stroke-width: 4; }
.gz-depth { fill: none; stroke: var(--shade); stroke-width: 14; }
.gz-dim { fill: #000000; }
.gz-pl { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.gz-pd { fill: var(--line); }
.gz-bl { fill: none; stroke: var(--wall2); stroke-width: 1.5; }
.gz-dust { position: absolute; left: 40px; right: 40px; top: 120px; bottom: 0; }

/* 1 */
.gz-in { position: absolute; left: 50px; right: 50px; top: 196px; bottom: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.gz-inv { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.gz-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.2; color: var(--ink); }
.gz-star { width: 34px; height: 34px; margin: 6px 0; }
.gz-star path { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round; } .gz-star circle { fill: var(--accent); }
.gz-from { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-size: 24px; line-height: 1.3; color: var(--accent); }

/* 2 */
.gz-card { position: absolute; left: 48px; right: 48px; top: 190px; bottom: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; text-align: center; }
.gz-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 46px; line-height: 1.12; color: var(--accent); }
.gz-reason { width: 100%; max-height: 84px; overflow: hidden; font-family: var(--f-display); font-style: italic; font-size: 19px; line-height: 1.3; color: var(--ink); }
.gz-rule { width: 140px; height: 10px; margin: 4px 0; background: radial-gradient(circle, var(--accent) 2px, transparent 2.5px) 0 50% / 14px 10px repeat-x; opacity: .7; }
.gz-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 27px; line-height: 1.2; color: var(--ink); }
.gz-wt { font-size: 14px; color: var(--muted); }
.gz-host { width: 100%; overflow: hidden; white-space: nowrap; margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--accent2); }

/* 3-4 */
.gz-room { background: radial-gradient(80% 50% at 50% 40%, var(--light) 0%, var(--card) 100%); }
.gz-frame { position: absolute; left: 0; top: 0; width: 360px; height: 640px; overflow: visible; }
.gz-fl { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: 1; animation: gz-draw 2s cubic-bezier(.5, 0, .3, 1) calc(var(--s) + var(--d, 0s)) both; }
.gz-fl.t { stroke-width: 1; opacity: .6; }
@keyframes gz-draw { to { stroke-dashoffset: 0; } }
.gz-key { position: absolute; left: 164px; top: 40px; width: 32px; height: 32px; }
.s3 .tv-details { padding: 96px 40px 44px; gap: 14px; }
.d-day, .f-names { color: var(--accent); }
.d-day, .d-month, .d-venue, .f-names, .f-date { font-weight: 700; }
.s4 .tv-final { padding: 96px 40px 100px; }
</style>
