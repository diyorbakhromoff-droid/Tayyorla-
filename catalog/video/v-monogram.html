<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(120% 80% at 50% 40%, var(--card) 0%, var(--bg) 85%); }

/* qog'oz karta */
.mn-paper { position: absolute; left: 22px; right: 22px; top: 36px; bottom: 36px; border-radius: 4px; background: var(--paper);
  background-image: repeating-linear-gradient(115deg, rgba(255, 255, 255, .05) 0 2px, rgba(0, 0, 0, .018) 2px 4px);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 24px 50px -24px rgba(0, 0, 0, .45), 0 4px 12px -6px rgba(0, 0, 0, .25);
  animation: mn-place 1.3s cubic-bezier(.2, .8, .2, 1) 0s both; }
@keyframes mn-place { from { opacity: 0; transform: translateY(30px) rotate(-2.5deg) scale(.96); } to { opacity: 1; transform: none; } }
.mn-paper::before { content: ""; position: absolute; inset: 12px; border: 1px solid var(--gold); opacity: .75; }
.mn-paper::after { content: ""; position: absolute; inset: 17px; border: .5px solid var(--gold); opacity: .45; }

.mn-foil { background: linear-gradient(115deg, var(--foil1) 0%, var(--foil3) 22%, var(--foil2) 40%, #FFFFFF 48%, var(--foil2) 56%, var(--foil3) 76%, var(--foil1) 100%);
  background-size: 320% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .45)) drop-shadow(0 -1px 0 var(--deboss)); }
.mn-shine { animation: mn-shine 5s ease-in-out calc(var(--s) + var(--d, 0s)) infinite both; }
@keyframes mn-shine { 0% { background-position: 100% 0; } 38%, 100% { background-position: 0% 0; } }
.mn-f1 { stop-color: var(--foil1); } .mn-f2 { stop-color: var(--foil2); } .mn-f3 { stop-color: var(--foil3); }

/* 1. Monogramma */
.mn-head { position: absolute; left: 44px; right: 44px; top: 104px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.mn-inv { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.mn-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 27px; line-height: 1.3; }
.mn-crest { position: absolute; left: 70px; top: 196px; width: 220px; height: 220px; }
.mn-crest svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mn-ring { fill: none; stroke: url(#mn-g); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: mn-draw 1.6s cubic-bezier(.5, 0, .3, 1) var(--d) both; }
.mn-ring.t { stroke-width: .7; }
.mn-laurel { fill: none; stroke: url(#mn-g); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: mn-draw 1.4s ease var(--d) both; }
.mn-lv { fill: url(#mn-g); opacity: 0; animation: tv-fade .6s ease var(--d) both; }
@keyframes mn-draw { to { stroke-dashoffset: 0; } }
.mn-press { position: absolute; left: 34px; right: 34px; top: 62px; height: 96px; display: flex; align-items: center; justify-content: center;
  animation: mn-press 1.1s cubic-bezier(.3, 0, .2, 1) 1.2s both; }
@keyframes mn-press { 0% { opacity: 0; transform: scale(1.7); filter: blur(6px); } 55% { opacity: 1; transform: scale(.94); filter: blur(0); } 75% { transform: scale(1.02); } 100% { opacity: 1; transform: none; } }
.mn-ini { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 74px; line-height: 1.12; padding: 0 4px; }
.mn-dent { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
  box-shadow: inset 0 2px 6px var(--deboss), 0 1px 0 rgba(255, 255, 255, .4); opacity: 0; animation: mn-dent 1s ease 1.75s both; }
@keyframes mn-dent { 0% { opacity: 0; transform: scale(.9); } 40% { opacity: 1; } 100% { opacity: .9; transform: none; } }
.mn-names { position: absolute; left: 44px; right: 44px; top: 444px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-weight: 600;
  font-size: 38px; line-height: 1.2; color: var(--ink); }
.mn-rule { position: absolute; left: 150px; top: 516px; width: 60px; height: 1px; background: var(--gold); }
.mn-from { position: absolute; left: 44px; right: 44px; top: 532px; text-align: center; font-size: 13px; font-weight: 500; letter-spacing: .06em; color: var(--muted); }

/* 2. Ismlar */
.mn-card { position: absolute; left: 44px; right: 44px; top: 66px; bottom: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.mn-mini { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.15; margin-bottom: 14px; }
.mn-event { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.mn-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 54px; line-height: 1.1; }
.mn-amp { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 32px; line-height: 1; }
.mn-div { display: flex; align-items: center; gap: 8px; width: 120px; margin: 18px 0 10px; }
.mn-div span { flex: 1; height: 1px; background: var(--gold); }
.mn-div i { width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--gold); }
.mn-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 26px; color: var(--accent); }
.mn-wt { font-size: 13px; letter-spacing: .03em; color: var(--muted); }

/* 3-4 */
.mn-top { position: absolute; left: 60px; right: 60px; top: 62px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 32px; line-height: 1.2; }
.s3 .tv-details { padding: 110px 46px 60px; gap: 13px; }
.s4 .tv-final { padding: 56px 40px 100px; }
.d-day { font-weight: 500; font-variant-numeric: lining-nums; }
.d-msg { font-weight: 500; }
.f-event { letter-spacing: .22em; text-transform: uppercase; font-size: 12px; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mn-g" x1="0" y1="0" x2="1" y2="1"><stop class="mn-f1" offset="0"/><stop class="mn-f2" offset=".45"/><stop class="mn-f3" offset=".7"/><stop class="mn-f1" offset="1"/></linearGradient>
</defs></svg>
<div class="bgk">
  <div class="mn-paper"></div>
</div>

<section class="sc s1">
  <div class="mn-head">
    <p class="mn-inv a-fade" style="--d:.5s" data-t="invite"></p>
    <p class="mn-dear a-blur" style="--d:.7s" data-t="dear" data-if="guest" data-fit="27,14"></p>
  </div>
  <div class="mn-crest">
    <span class="mn-dent"></span>
    <svg viewBox="0 0 220 220" aria-hidden="true">
      <circle class="mn-ring" pathLength="1" style="--d:.6s" cx="110" cy="110" r="92" transform="rotate(-90 110 110)"/>
      <circle class="mn-ring t" pathLength="1" style="--d:.8s" cx="110" cy="110" r="86" transform="rotate(90 110 110)"/>
      <path class="mn-laurel" pathLength="1" style="--d:2.1s" d="M104 206C64 202 30 172 22 128"/>
      <path class="mn-laurel" pathLength="1" style="--d:2.1s" d="M116 206C156 202 190 172 198 128"/>
      <g class="mn-lv" style="--d:2.6s">
        <path d="M30 156c-8-4-12-10-12-18 8 3 12 9 12 18z"/><path d="M44 176c-9-2-15-7-16-15 8 2 14 7 16 15z"/><path d="M62 192c-9 0-16-4-19-11 8 0 15 4 19 11z"/>
        <path d="M84 202c-8 2-16 0-20-6 8-2 15 1 20 6z"/><path d="M26 136c-7-5-9-12-7-19 7 4 9 11 7 19z"/>
        <path d="M190 156c8-4 12-10 12-18-8 3-12 9-12 18z"/><path d="M176 176c9-2 15-7 16-15-8 2-14 7-16 15z"/><path d="M158 192c9 0 16-4 19-11-8 0-15 4-19 11z"/>
        <path d="M136 202c8 2 16 0 20-6-8-2-15 1-20 6z"/><path d="M194 136c7-5 9-12 7-19-7 4-9 11-7 19z"/>
        <path d="M110 200l4 6-4 6-4-6z"/>
      </g>
    </svg>
    <div class="mn-press"><p class="mn-ini mn-foil mn-shine" style="--d:2.2s" data-t="initials" data-fit="74,28"></p></div>
  </div>
  <p class="mn-names a-rise" style="--d:2.7s" data-t="names_line" data-fit="38,18,14"></p>
  <i class="mn-rule a-fade" style="--d:3s"></i>
  <p class="mn-from a-rise" style="--d:3.2s" data-t="from"></p>
</section>

<section class="sc s2">
  <div class="mn-card">
    <p class="mn-mini mn-foil mn-shine a-pop" style="--d:.1s" data-t="initials" data-fit="40,20"></p>
    <p class="mn-event a-fade" style="--d:.3s" data-t="event"></p>
    <p class="mn-name a-blur" style="--d:.5s" data-t="name1" data-fit="54,15"></p>
    <p class="mn-amp mn-foil a-fade" style="--d:.9s">&amp;</p>
    <p class="mn-name a-blur" style="--d:1.1s" data-t="name2" data-fit="54,15"></p>
    <div class="mn-div a-fade" style="--d:1.5s"><span></span><i></i><span></span></div>
    <p class="mn-date a-rise" style="--d:1.6s" data-t="date" data-fit="26,15"></p>
    <p class="mn-wt a-rise" style="--d:1.8s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3">
  <p class="mn-top mn-foil mn-shine a-fade" style="--d:.1s" data-t="initials" data-fit="32,18"></p>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
