<style>
:root { --f-display: 'Lora', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 58%, var(--bg) 82%); }
.km-moon { position: absolute; left: 300px; top: 22px; width: 28px; height: 28px; border-radius: 50%; box-shadow: -9px 5px 0 0 var(--moon); opacity: .9; transform: rotate(-20deg); }
.km-hill { position: absolute; left: 0; top: 430px; width: 360px; height: 210px; }
.km-hill .a { fill: var(--hill2); } .km-hill .b { fill: var(--hill); }
.km-ember { position: absolute; left: -40px; right: -40px; bottom: -120px; height: 380px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--fl2) 34%, transparent), transparent);
  animation: km-breath 2.6s ease-in-out infinite alternate both; }
@keyframes km-breath { from { opacity: .55; } to { opacity: .9; } }
.km-sparks { position: absolute; left: 90px; top: 250px; width: 180px; height: 360px; }
.km-sparks .p-dust { width: 3px; height: 3px; box-shadow: 0 0 6px 1px var(--fl2); }

/* 1. Gulxan */
.km-head { position: absolute; left: 20px; right: 20px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.km-inv { font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
.km-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 30px; line-height: 1.2; }
.km-gap { height: 22px; }
.km-title { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1.15;
  color: var(--accent2); }
.km-glow { position: absolute; left: 50px; top: 270px; width: 260px; height: 300px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--fl3) 55%, transparent), color-mix(in srgb, var(--fl2) 22%, transparent) 55%, transparent);
  animation: km-glow 1.6s ease-out .4s both, km-flick 1.1s ease-in-out 2s infinite alternate; }
@keyframes km-glow { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes km-flick { from { opacity: 1; } to { opacity: .72; } }
.km-fire { position: absolute; left: 100px; top: 300px; width: 160px; height: 220px; overflow: visible; }
.km-log { fill: var(--log); stroke: color-mix(in srgb, var(--log) 60%, #000); stroke-width: 1.5; }
.km-log-end { fill: color-mix(in srgb, var(--fl2) 55%, var(--log)); }
.km-stone { fill: var(--stone); }
.km-fl { transform-box: fill-box; transform-origin: 50% 100%; }
.km-flw { transform-box: view-box; transform-origin: 80px 190px; animation: km-ignite 1.3s cubic-bezier(.2, .9, .3, 1.2) .5s both; }
@keyframes km-ignite { from { transform: scale(.05, 0); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
.km-fl.o { fill: url(#km-g1); animation: km-f1 .9s ease-in-out infinite alternate both; }
.km-fl.m { fill: url(#km-g2); animation: km-f2 .7s ease-in-out infinite alternate both; }
.km-fl.i { fill: var(--fl3); animation: km-f3 .55s ease-in-out infinite alternate both; }
.km-fl.s1 { fill: url(#km-g2); animation: km-f2 .8s ease-in-out -.3s infinite alternate both; }
.km-fl.s2 { fill: url(#km-g2); animation: km-f1 .75s ease-in-out -.5s infinite alternate both; }
@keyframes km-f1 { from { transform: scale(1, 1) skewX(-3deg); } to { transform: scale(.94, 1.08) skewX(4deg); } }
@keyframes km-f2 { from { transform: scale(1.04, .94) skewX(5deg); } to { transform: scale(.96, 1.1) skewX(-4deg); } }
@keyframes km-f3 { from { transform: scale(1, .9); } to { transform: scale(.9, 1.12) skewX(3deg); } }
.km-g1a { stop-color: var(--fl1); } .km-g1b { stop-color: var(--fl2); } .km-g2a { stop-color: var(--fl2); } .km-g2b { stop-color: var(--fl3); }
.km-men { position: absolute; left: 0; top: 452px; width: 360px; height: 188px; overflow: visible; animation: tv-rise 1.2s cubic-bezier(.2, .8, .2, 1) .2s both; }
.km-man { fill: var(--sil); stroke: color-mix(in srgb, var(--fl2) 70%, transparent); stroke-width: 1.4; stroke-opacity: .55; }
.km-from { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-size: 14px; font-weight: 500; letter-spacing: .08em; color: var(--muted); }

/* 2. Yulduzlar ostida */
.km-card { position: absolute; left: 30px; right: 30px; top: 66px; bottom: 130px; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.km-ev { width: 100%; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
.km-day { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 120px; line-height: 1;
  color: var(--accent2); }
.km-halo { position: absolute; left: 50%; top: 50%; width: 260px; height: 200px; margin: -100px 0 0 -130px; border-radius: 50%; z-index: -1;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--fl2) 30%, transparent), transparent); animation: km-breath 2.4s ease-in-out infinite alternate both; }
.km-dw { position: relative; max-width: 100%; display: flex; justify-content: center; }
.km-month { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 32px; line-height: 1.1; }
.km-wt { font-size: 15px; color: var(--muted); }
.km-line { width: 120px; height: 1px; margin: 12px 0 6px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.km-turn { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 23px; line-height: 1.2; }
.km-kassa { font-size: 14px; font-weight: 600; letter-spacing: .05em; color: var(--accent); }

/* 3-4 */
.s3 .tv-details { padding-bottom: 110px; }
.s3 .d-msg { font-size: 23px; font-weight: 500; }
.s3 .d-day { font-weight: 700; color: var(--accent2); }
.s3 .d-month, .s3 .d-venue, .s4 .f-names, .s4 .f-date { font-weight: 700; }
.s3 .d-sign b { font-weight: 600; }
.s4 .tv-final { padding-bottom: 120px; }
.s4 .f-names { color: var(--accent2); }
/* uzun matn bir necha qatorga bo'linganda balandlik chegarasi */
.km-title { max-height: 84px !important; }
.km-dear { max-height: 76px !important; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="km-g1" x1="0" y1="1" x2="0" y2="0"><stop class="km-g1a" offset="0"/><stop class="km-g1b" offset=".6"/><stop class="km-g1a" offset="1"/></linearGradient>
  <linearGradient id="km-g2" x1="0" y1="1" x2="0" y2="0"><stop class="km-g2b" offset="0"/><stop class="km-g2a" offset="1"/></linearGradient>
</defs></svg>
<div class="bgk">
  <div class="ptc" data-particles="star" data-n="56" data-colors="var(--star)"></div>
  <span class="km-moon"></span>
  <svg class="km-hill" viewBox="0 0 360 210" preserveAspectRatio="none" aria-hidden="true">
    <path class="a" d="M0 40C40 22 70 30 110 46C150 60 180 20 230 24C280 28 310 50 360 36V210H0Z"/>
    <path class="b" d="M0 78C60 64 120 92 180 84C240 76 300 60 360 74V210H0Z"/>
  </svg>
  <div class="km-ember"></div>
  <div class="ptc km-sparks" data-particles="dust" data-n="26" data-colors="var(--fl3),var(--fl2)"></div>
</div>

  <div class="km-head">

    <p class="km-from a-fade" style="--d:2.4s" data-t="from" data-fit="14,11"></p>
  </div>
  <div class="km-glow"></div>
  <svg class="km-fire" viewBox="0 0 160 220" aria-hidden="true">

      <path class="km-fl o" d="M80 40C96 72 124 96 124 140C124 172 104 192 80 192S36 172 36 140C36 110 56 96 62 70C68 90 74 96 78 98C76 76 74 58 80 40Z"/>
      <path class="km-fl s1" d="M44 190C30 170 34 146 46 132C48 150 56 158 60 162C60 176 54 186 44 190Z"/>
      <path class="km-fl s2" d="M118 190C132 172 128 150 116 136C116 152 108 160 102 164C102 178 108 186 118 190Z"/>
      <path class="km-fl m" d="M80 84C92 108 108 124 108 152C108 176 96 190 80 190S52 176 52 152C52 132 64 120 68 104C72 116 76 120 78 120C77 106 76 96 80 84Z"/>
      <path class="km-fl i" d="M80 128C88 142 94 152 94 166C94 182 88 190 80 190S66 182 66 166C66 152 74 142 80 128Z"/>
    </g>
    <rect class="km-log" x="22" y="180" width="116" height="16" rx="8" transform="rotate(12 80 188)"/>
    <rect class="km-log" x="22" y="180" width="116" height="16" rx="8" transform="rotate(-14 80 188)"/>
    <circle class="km-log-end" cx="140" cy="200" r="6"/><circle class="km-log-end" cx="22" cy="204" r="6"/>
    <ellipse class="km-stone" cx="18" cy="210" rx="14" ry="8"/><ellipse class="km-stone" cx="50" cy="214" rx="15" ry="7"/><ellipse class="km-stone" cx="82" cy="215" rx="14" ry="6"/>
    <ellipse class="km-stone" cx="113" cy="214" rx="15" ry="7"/><ellipse class="km-stone" cx="143" cy="210" rx="14" ry="8"/>
  </svg>
  <svg class="km-men" viewBox="0 0 360 188" aria-hidden="true">
    <g class="km-man"><ellipse cx="54" cy="58" rx="24" ry="28"/><path d="M-14 188C-14 128 14 96 54 96S122 128 122 188Z"/></g>
    <g class="km-man"><ellipse cx="306" cy="52" rx="25" ry="29"/><path d="M236 188C236 124 266 92 306 92S376 124 376 188Z"/></g>
    <g class="km-man" opacity=".9"><ellipse cx="180" cy="104" rx="20" ry="23"/><path d="M128 188C128 150 150 132 180 132S232 150 232 188Z"/></g>
  </svg>
</section>

<section class="sc s2">
  <div class="km-card">
    <p class="km-ev a-fade" style="--d:.2s" data-t="title" data-fit="13,11,10"></p>
    <div class="km-dw"><span class="km-halo"></span><span class="km-day a-blur" style="--d:.4s" data-t="day" data-fit="120,56"></span></div>
    <p class="km-month a-rise" style="--d:.8s" data-t="month" data-fit="32,16"></p>
    <p class="km-wt a-rise" style="--d:1s" data-t="wt"></p>
    <span class="km-line a-fade" style="--d:1.2s" data-if="extra"></span>
    <p class="km-turn a-rise" style="--d:1.35s" data-t="turn" data-if="turn" data-fit="23,13"></p>
    <p class="km-kassa a-rise" style="--d:1.5s" data-t="kassa" data-if="kassa"></p>
  </div>
</section>

<section class="sc s3"><div class="tv-details" data-std="details"></div></section>

<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
