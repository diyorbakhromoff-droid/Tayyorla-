<style>
:root { --f-display: 'Caveat', cursive; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.6px); background-size: 16px 16px; }
.pl-pol { position: absolute; padding: 12px 12px 0; background: var(--paper); border-radius: 3px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .08), 0 16px 26px -14px rgba(0, 0, 0, .45);
  animation: pl-drop 1.1s cubic-bezier(.25, 1, .35, 1) calc(var(--s) + var(--d)) both; }
@keyframes pl-drop { 0% { opacity: 0; transform: translate(var(--fx, 0), -120px) scale(1.35) rotate(var(--fr, -22deg)); box-shadow: 0 50px 60px -20px rgba(0, 0, 0, .25); }
  25% { opacity: 1; } 78% { transform: rotate(calc(var(--r) - 1deg)) scale(.985); } 100% { opacity: 1; transform: rotate(var(--r)); } }
.pl-ph { position: relative; overflow: hidden; background: linear-gradient(150deg, var(--photo1) 0%, var(--photo2) 100%); }
.pl-ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255, 255, 255, .28), transparent 45%); }
.pl-dev { position: absolute; inset: 0; z-index: 2; background: var(--dev); animation: pl-dev 2.2s ease-in calc(var(--s) + var(--d)) both; }
@keyframes pl-dev { 0% { opacity: 1; } 30% { opacity: .92; } 100% { opacity: 0; } }
.pl-cap { display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; color: var(--pen); text-align: center; }
.pl-tape { position: absolute; z-index: 3; height: 26px; background: var(--tape); opacity: .82;
  clip-path: polygon(0 8%, 6% 0, 12% 10%, 18% 0, 24% 8%, 30% 0, 36% 10%, 42% 0, 48% 8%, 54% 0, 60% 10%, 66% 0, 72% 8%, 78% 0, 84% 10%, 90% 0, 96% 8%, 100% 0,
    100% 92%, 94% 100%, 88% 90%, 82% 100%, 76% 92%, 70% 100%, 64% 90%, 58% 100%, 52% 92%, 46% 100%, 40% 90%, 34% 100%, 28% 92%, 22% 100%, 16% 90%, 10% 100%, 4% 92%, 0 100%);
  animation: tv-fade .3s ease calc(var(--s) + var(--d) + .9s) both; }
.pl-tape.b { background: var(--tape2); }
.pl-doo { fill: none; stroke: var(--mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: pl-draw .7s ease calc(var(--s) + var(--d)) both; }
.pl-doo.w { stroke: #FFFFFF; }
@keyframes pl-draw { 0% { stroke-dashoffset: 1; opacity: 0; } 5% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }

/* 1 */
.pl-head { position: absolute; left: 24px; right: 24px; top: 34px; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; }
.pl-inv { font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.pl-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1.2; color: var(--ink); }
.pl-main { left: 40px; top: 118px; width: 262px; height: 286px; --r: -4deg; --fr: -26deg; --fx: -40px; }
.pl-main .pl-ph { height: 210px; display: flex; align-items: center; justify-content: center; padding: 0 14px; }
.pl-ttl { position: relative; z-index: 1; width: 100%; max-height: 190px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1;
  color: #FFFFFF; text-shadow: 0 2px 12px rgba(0, 0, 0, .25); }
.pl-main .pl-cap { height: 64px; font-size: 27px; padding: 0 6px; }
.pl-st { position: absolute; z-index: 1; width: 40px; height: 40px; overflow: visible; }
.pl-sm { left: 28px; top: 408px; width: 138px; height: 166px; --r: -7deg; --fr: 24deg; --fx: 30px; }
.pl-sm .pl-ph { height: 112px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pl-day { position: relative; z-index: 1; max-width: 110px; overflow: hidden; white-space: nowrap; font-family: 'Unbounded', var(--f-body); font-weight: 800; font-size: 46px; line-height: 1; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0, 0, 0, .22); }
.pl-sm .pl-cap { height: 42px; font-size: 24px; }
.pl-note { position: absolute; left: 182px; right: 16px; top: 452px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.pl-arrow { width: 54px; height: 34px; overflow: visible; margin-left: -8px; }
.pl-tm { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.1; color: var(--ink); transform: rotate(-3deg); }
.pl-from { width: 100%; font-size: 14px; font-weight: 500; color: var(--muted); }

/* 2 */
.pl-p1 { left: 20px; top: 56px; width: 160px; height: 206px; --r: -6deg; --fr: -30deg; --fx: -50px; }
.pl-p2 { left: 182px; top: 86px; width: 160px; height: 206px; --r: 5deg; --fr: 28deg; --fx: 50px; }
.pl-p1 .pl-ph, .pl-p2 .pl-ph { height: 136px; display: flex; align-items: center; justify-content: center; }
.pl-p2 .pl-ph { background: linear-gradient(150deg, var(--photo2) 0%, var(--photo1) 100%); }
.pl-ico { position: relative; z-index: 1; width: 76px; height: 64px; overflow: visible; }
.pl-p1 .pl-cap, .pl-p2 .pl-cap { height: 58px; font-size: 25px; line-height: 1; padding: 0 4px; }
.pl-paper { position: absolute; left: 30px; right: 30px; top: 326px; height: 248px; padding: 30px 22px 20px; background: var(--paper); border-radius: 2px;
  background-image: repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); background-position: 0 14px;
  box-shadow: 0 16px 26px -14px rgba(0, 0, 0, .45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
  --r: 1.5deg; --fr: -10deg; animation: pl-drop 1.1s cubic-bezier(.25, 1, .35, 1) calc(var(--s) + var(--d)) both; }
.pl-pt { width: 100%; max-height: 90px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1; color: var(--mark); }
.pl-pd { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.1; color: var(--pen); }
.pl-pw { font-size: 15px; font-weight: 500; color: var(--pmuted); }
.pl-pv { width: 100%; overflow: hidden; white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--pen); }

/* 3-4 */
.pl-sheet { position: absolute; left: 18px; right: 18px; top: 36px; bottom: 36px; background: var(--paper); border-radius: 2px; box-shadow: 0 18px 30px -16px rgba(0, 0, 0, .45);
  --r: -1deg; --fr: 8deg; animation: pl-drop 1s cubic-bezier(.25, 1, .35, 1) calc(var(--s) + var(--d)) both; }
.s3 .tv-details { inset: 36px 18px; padding: 30px 22px; --ink: var(--pen); --muted: var(--pmuted); --accent: var(--mark); color: var(--pen); }
.s3 .d-msg { font-weight: 700; font-size: 29px; line-height: 1.1; }
.s3 .d-day, .s3 .d-month, .s3 .d-venue, .s4 .f-names, .s4 .f-date, .s3 .d-sign { font-weight: 700; }
.s3 .d-sign { font-size: 25px; }
.s3 .d-venue { font-size: 30px; }
.s3 .d-month { font-size: 30px; }
.s4 .f-names { font-size: 52px; }
.s4 .f-date { font-size: 28px; }
.s4 .f-event { font-family: var(--f-body); }
.s4 .pl-st { opacity: .9; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="pl-heart" viewBox="0 0 40 40"><path pathLength="1" d="M20 34C8 25 3 18 5 11c2-6 10-8 15 0 5-8 13-6 15 0 2 7-3 14-15 23z"/></symbol>
  <symbol id="pl-star" viewBox="0 0 40 40"><path pathLength="1" d="M20 4l4 11 12 1-9 8 3 12-10-7-10 7 3-12-9-8 12-1z"/></symbol>
</defs></svg>
<div class="bgk"></div>

<section class="sc s1">
  <div class="pl-head">
    <p class="pl-inv a-fade" style="--d:.2s" data-t="invite"></p>
    <p class="pl-dear a-rise" style="--d:.4s" data-t="dear" data-if="guest" data-fit="38,20"></p>
  </div>
  <div class="pl-pol pl-main" style="--d:.5s">
    <span class="pl-tape" style="left:86px;top:-12px;width:92px;transform:rotate(-4deg)"></span>
    <div class="pl-ph">
      <p class="pl-ttl" data-t="title" data-fit="56,26,24"></p>
      <svg class="pl-st" style="left:14px;top:12px" viewBox="0 0 40 40" aria-hidden="true"><use class="pl-doo w" href="#pl-star" style="--d:3.2s"/></svg>
      <svg class="pl-st" style="right:14px;bottom:12px" viewBox="0 0 40 40" aria-hidden="true"><use class="pl-doo w" href="#pl-heart" style="--d:3.5s"/></svg>
      <span class="pl-dev" style="--d:1.3s"></span>
    </div>
    <p class="pl-cap" data-t="date" data-fit="27,16"></p>
  </div>
  <div class="pl-pol pl-sm" style="--d:1.5s">
    <span class="pl-tape b" style="left:-14px;top:6px;width:62px;transform:rotate(-38deg)"></span>
    <div class="pl-ph"><p class="pl-day" data-t="day" data-fit="46,20"></p><span class="pl-dev" style="--d:2.2s"></span></div>
    <p class="pl-cap" data-t="month" data-fit="24,14"></p>
  </div>
  <div class="pl-note">
    <svg class="pl-arrow" viewBox="0 0 54 34" aria-hidden="true"><path class="pl-doo" pathLength="1" style="--d:3s" d="M50 6C36 2 18 8 8 26M8 26l1-11M8 26l11-3"/></svg>
    <p class="pl-tm a-fade" style="--d:3.3s" data-t="time_line" data-fit="32,18"></p>
    <p class="pl-from a-rise" style="--d:3.7s" data-t="from"></p>
  </div>
  <svg class="pl-st" style="left:300px;top:96px;width:34px;height:34px" viewBox="0 0 40 40" aria-hidden="true"><use class="pl-doo" href="#pl-heart" style="--d:3.8s"/></svg>
</section>

<section class="sc s2">
  <div class="pl-pol pl-p1" style="--d:.1s" data-if="turn">
    <span class="pl-tape" style="left:44px;top:-12px;width:72px;transform:rotate(5deg)"></span>
    <div class="pl-ph">
      <svg class="pl-ico" viewBox="0 0 76 64" aria-hidden="true"><path class="pl-doo w" pathLength="1" style="--d:1.2s" d="M10 50 6 16l18 16L38 6l14 26 18-16-4 34zM12 58h52"/></svg>
      <span class="pl-dev" style="--d:.2s"></span>
    </div>
    <p class="pl-cap" data-t="turn" data-fit="25,17,13"></p>
  </div>
  <div class="pl-pol pl-p2" style="--d:.5s" data-if="kassa">
    <span class="pl-tape b" style="left:46px;top:-12px;width:72px;transform:rotate(-6deg)"></span>
    <div class="pl-ph">
      <svg class="pl-ico" viewBox="0 0 76 64" aria-hidden="true"><path class="pl-doo w" pathLength="1" style="--d:1.6s" d="M8 18h60v40H8zM8 18l30 22 30-22M24 8h28"/></svg>
      <span class="pl-dev" style="--d:.5s"></span>
    </div>
    <p class="pl-cap" data-t="kassa" data-fit="25,17,13"></p>
  </div>
  <div class="pl-paper" style="--d:.9s">
    <span class="pl-tape" style="left:110px;top:-12px;width:80px;transform:rotate(-3deg)"></span>
    <p class="pl-pt" data-t="title" data-fit="44,22,20"></p>
    <p class="pl-pd" data-t="date" data-fit="32,18"></p>
    <p class="pl-pw" data-t="wt"></p>
    <p class="pl-pv" data-t="venue" data-if="venue" data-fit="15,11"></p>
  </div>
</section>

<section class="sc s3">
  <div class="pl-sheet" style="--d:.05s">
    <span class="pl-tape" style="left:-18px;top:14px;width:76px;transform:rotate(-40deg)"></span>
    <span class="pl-tape b" style="right:-18px;top:14px;width:76px;transform:rotate(40deg)"></span>
  </div>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <svg class="pl-st" style="left:40px;top:70px;width:44px;height:44px" viewBox="0 0 40 40" aria-hidden="true"><use class="pl-doo" href="#pl-heart" style="--d:.4s"/></svg>
  <svg class="pl-st" style="left:282px;top:96px;width:36px;height:36px" viewBox="0 0 40 40" aria-hidden="true"><use class="pl-doo" href="#pl-star" style="--d:.7s"/></svg>
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="22" data-at="15.3" data-colors="var(--tape),var(--tape2),var(--mark),var(--photo2)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
