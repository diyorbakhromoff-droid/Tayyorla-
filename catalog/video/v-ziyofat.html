<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: var(--bg); }
.zy-cloth { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--line) 7%, transparent) 0 1px, transparent 1px 6px), var(--bg); }
.zy-edge { position: absolute; inset: 12px; border-radius: 20px; border: 1.5px solid color-mix(in srgb, var(--line) 45%, transparent); }
.zy-ringw { position: absolute; left: 30px; top: 180px; width: 300px; height: 300px; overflow: visible; }
.zy-ring { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 1; stroke-dashoffset: 1; animation: zy-draw 2.2s cubic-bezier(.5, 0, .3, 1) 1.2s both; }
.zy-ring.t { stroke-dasharray: .004 .012; stroke-dashoffset: 0; stroke-width: 2.4; stroke-linecap: round; opacity: .55; animation: tv-fade 1.2s ease 2.6s both; }
@keyframes zy-draw { to { stroke-dashoffset: 0; } }
.zy-it { position: absolute; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .16)); animation: zy-in 1.3s cubic-bezier(.2, .9, .25, 1) var(--d) both; }
.zy-c { animation-delay: calc(var(--s) + var(--d)); }
.zy-it svg { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes zy-in { from { opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)); } 30% { opacity: 1; } to { opacity: 1; transform: none; } }
.zy-b1 { fill: var(--bread); } .zy-b2 { fill: var(--bread2); } .zy-b3 { fill: none; stroke: var(--bread); stroke-width: 3; stroke-dasharray: 2 5; opacity: .6; }
.zy-b4 { fill: var(--bread); }
.zy-seed { fill: var(--seed); } .zy-stamp { stroke: var(--bread); stroke-width: 2.4; stroke-linecap: round; opacity: .7; }
.zy-cup { fill: var(--cup); } .zy-cup2 { fill: var(--cup2); } .zy-tea { fill: var(--tea); } .zy-tea2 { fill: #FFFFFF; opacity: .35; }
.zy-cd { fill: var(--dot); }
.zy-pot { fill: var(--cup); } .zy-lid { fill: none; stroke: var(--cup2); stroke-width: 2; stroke-dasharray: 3 4; } .zy-pot2 { fill: var(--cup2); } .zy-pot3 { fill: var(--cup2); }
.zy-handle { fill: none; stroke: var(--cup2); stroke-width: 9; stroke-linecap: round; }
.zy-plate { fill: var(--cup); } .zy-plate2 { fill: var(--cup2); } .zy-rice { fill: var(--rice); }
.zy-car { fill: var(--carrot); } .zy-meat { fill: var(--meat); } .zy-egg { fill: #FFFFFF; } .zy-egg2 { fill: #F5B92E; }
.zy-steam { position: absolute; left: 140px; top: 470px; width: 130px; height: 80px; }
.zy-steam .p-steam { background: var(--steam) !important; }

/* 1 */
.zy-mid { position: absolute; left: 58px; right: 58px; top: 196px; height: 268px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.zy-inv { font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.zy-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 500; font-size: 24px; line-height: 1.3; color: var(--ink); }
.zy-bar { width: 26px; height: 3px; border-radius: 2px; background: var(--accent); }
.zy-from { width: 100%; overflow: hidden; white-space: nowrap; font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--accent); }

/* 2 */
.zy-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.2; letter-spacing: -.01em; color: var(--accent); }
.zy-reason { width: 100%; max-height: 62px; overflow: hidden; font-size: 15px; line-height: 1.35; color: var(--ink); }
.zy-date { width: 100%; overflow: hidden; white-space: nowrap; margin-top: 4px; font-family: var(--f-display); font-weight: 500; font-size: 19px; line-height: 1.3; color: var(--ink); }
.zy-wt { font-size: 13px; color: var(--muted); }
.zy-host { width: 100%; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--accent2); }
.s2 .zy-mid { gap: 8px; left: 70px; right: 70px; }

/* 3-4 */
.zy-flat { background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--line) 7%, transparent) 0 1px, transparent 1px 6px), var(--bg); }
.s3 .tv-details { padding: 92px 34px 80px; gap: 14px; }
.d-day, .f-names { color: var(--accent); font-weight: 700; }
.d-month, .d-venue, .f-date { font-weight: 500; }
.d-venue { font-size: 20px; }
.s4 .tv-final { padding: 100px 18px 100px; }
.tv-final .f-names { white-space: nowrap; letter-spacing: -.02em; }
</style>
