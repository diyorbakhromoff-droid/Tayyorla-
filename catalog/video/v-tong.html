<style>
:root { --f-display: 'Comfortaa', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: var(--sky1); }
.tg-sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1) 0%, color-mix(in srgb, var(--sky1) 55%, var(--dawn)) 52%, var(--dawn) 68%); }
.tg-sky.b { background: linear-gradient(180deg, var(--sky2) 0%, color-mix(in srgb, var(--sky2) 50%, var(--dawn2)) 50%, var(--dawn2) 68%);
  animation: tv-fade 6.5s ease-in-out .4s both; }
.tg-stars { position: absolute; left: 0; right: 0; top: 0; height: 360px; animation: tg-out 4s ease-in .6s both; }
@keyframes tg-out { from { opacity: 1; } to { opacity: 0; } }
.tg-glow { position: absolute; left: -120px; right: -120px; top: 250px; height: 360px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--sun2) 75%, transparent) 0%, color-mix(in srgb, var(--sun) 35%, transparent) 50%, transparent 100%);
  animation: tg-glow 6s ease-out .2s both; }
@keyframes tg-glow { from { opacity: 0; transform: scale(.55, .4); } to { opacity: 1; transform: none; } }
.tg-up { position: absolute; left: 0; top: 0; width: 360px; height: 431px; overflow: hidden; }
.tg-sun { position: absolute; left: 100px; top: 236px; width: 160px; height: 160px; border-radius: 50%;
  background: linear-gradient(180deg, var(--sun2) 0%, var(--sun) 100%);
  -webkit-mask: linear-gradient(180deg, #000 0 58%, transparent 58% 61%, #000 61% 69%, transparent 69% 73.5%, #000 73.5% 80%, transparent 80% 86%, #000 86% 91%, transparent 91% 98%, #000 98%);
  mask: linear-gradient(180deg, #000 0 58%, transparent 58% 61%, #000 61% 69%, transparent 69% 73.5%, #000 73.5% 80%, transparent 80% 86%, #000 86% 91%, transparent 91% 98%, #000 98%);
  animation: tg-rise 7s cubic-bezier(.3, .55, .25, 1) .2s both; }
.tg-halo { position: absolute; left: 100px; top: 236px; width: 160px; height: 160px; border-radius: 50%;
  box-shadow: 0 0 60px 26px color-mix(in srgb, var(--sun) 45%, transparent); animation: tg-rise 7s cubic-bezier(.3, .55, .25, 1) .2s both; }
@keyframes tg-rise { from { transform: translateY(200px); } to { transform: none; } }
.tg-ring { position: absolute; left: 100px; top: 236px; width: 160px; height: 160px; border-radius: 50%; border: 1.5px solid var(--sun2); opacity: 0;
  animation: tg-ring 4.2s ease-out infinite both; }
.tg-ring.r1 { animation-delay: 4.2s; } .tg-ring.r2 { animation-delay: 5.6s; } .tg-ring.r3 { animation-delay: 7s; }
@keyframes tg-ring { 0% { opacity: 0; transform: scale(1); } 4% { opacity: .7; } 100% { opacity: 0; transform: scale(2.6); } }
.tg-city { position: absolute; left: 0; top: 311px; width: 360px; height: 120px; overflow: visible; }
.tg-ln { fill: var(--ground); fill-opacity: 0; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: tg-draw 2.6s cubic-bezier(.45, 0, .3, 1) var(--d, .4s) both, tg-fill 1.6s ease 3.4s both; }
.tg-ln.th { fill: none; animation: tg-draw 2.6s cubic-bezier(.45, 0, .3, 1) var(--d, .4s) both; }
@keyframes tg-draw { to { stroke-dashoffset: 0; } }
@keyframes tg-fill { to { fill-opacity: .92; } }
.tg-land { position: absolute; left: 0; top: 430px; width: 360px; height: 210px; background: linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--sun)) 0%, var(--ground) 40%); }
.tg-hz { position: absolute; left: 0; right: 0; top: 430px; height: 1.5px; background: var(--line); transform-origin: 50% 50%; animation: tg-hz 1.4s cubic-bezier(.6, 0, .2, 1) .1s both; }
@keyframes tg-hz { from { transform: scaleX(0); } to { transform: none; } }
.tg-lines { position: absolute; left: 0; right: 0; top: 430px; height: 210px; overflow: hidden; }
.tg-lines i { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); opacity: .22; }
.tg-refl { position: absolute; left: 0; right: 0; top: 438px; display: flex; flex-direction: column; align-items: center; gap: 7px; animation: tv-fade 3s ease 2.6s both; }
.tg-refl i { display: block; height: 3px; border-radius: 3px; background: var(--sun2); opacity: .75; animation: tg-shim 1.8s ease-in-out infinite alternate both; }
.tg-refl i:nth-child(2n) { animation-delay: -.9s; } .tg-refl i:nth-child(3n) { animation-delay: -.5s; }
@keyframes tg-shim { from { transform: scaleX(.7); } to { transform: scaleX(1.12); } }

/* 1 */
.tg-head { position: absolute; left: 24px; right: 24px; top: 66px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.tg-inv { font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.tg-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.3; color: var(--ink); }
.tg-dot { display: flex; gap: 6px; margin: 4px 0 2px; }
.tg-dot i { width: 5px; height: 5px; border-radius: 50%; background: var(--sun2); }
.tg-dot i:nth-child(2) { background: var(--sun); width: 22px; border-radius: 3px; }
.tg-from { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.3; color: var(--accent); }
.tg-time { position: absolute; left: 24px; right: 24px; top: 530px; text-align: center; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .04em; color: var(--accent); }

/* 2: shisha karta */
.tg-glass { position: absolute; left: 26px; right: 26px; top: 64px; height: 312px; padding: 26px 20px; border-radius: 28px;
  background: color-mix(in srgb, var(--card) 62%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, #FFFFFF 30%, transparent), 0 20px 40px -24px rgba(0, 0, 0, .45);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.tg-mini { width: 54px; height: 28px; margin-bottom: 2px; overflow: visible; }
.tg-mini circle { fill: var(--sun); } .tg-mini path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
.tg-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1.2; color: var(--accent); }
.tg-reason { width: 100%; max-height: 64px; overflow: hidden; font-size: 16px; line-height: 1.35; color: var(--ink); }
.tg-date { width: 100%; margin-top: 6px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 24px; color: var(--ink); }
.tg-wt { font-size: 14px; color: var(--muted); }
.tg-host { width: 100%; overflow: hidden; white-space: nowrap; margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--accent2); }

/* 3-4 */
.tg-day { background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 50%, color-mix(in srgb, var(--dawn2) 40%, var(--bg)) 100%); }
.tg-half { position: absolute; left: 130px; bottom: 40px; width: 100px; height: 50px; border-radius: 100px 100px 0 0; background: linear-gradient(180deg, var(--sun2), var(--sun));
  -webkit-mask: linear-gradient(180deg, #000 0 52%, transparent 52% 60%, #000 60% 74%, transparent 74% 84%, #000 84%); mask: linear-gradient(180deg, #000 0 52%, transparent 52% 60%, #000 60% 74%, transparent 74% 84%, #000 84%); }
.tg-strip { position: absolute; left: 0; bottom: 0; width: 360px; height: 72px; overflow: visible; }
.tg-strip .tg-ln { animation: tg-draw 2.2s cubic-bezier(.45, 0, .3, 1) calc(var(--s) + .1s) both; fill: none; stroke-width: 1.3; }
.tg-base { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: color-mix(in srgb, var(--ground) 60%, var(--bg)); border-top: 1.3px solid var(--line); }
.s3 .tv-details { padding: 40px 30px 110px; gap: 14px; }
.s3 .d-day { font-weight: 700; }
.s3 .d-month, .s3 .d-venue, .tv-final .f-names, .tv-final .f-date { font-weight: 700; }
.s4 .tv-final { padding-bottom: 110px; }
</style>
<div class="bgk">
  <div class="tg-sky"></div>
  <div class="tg-sky b"></div>
  <div class="ptc tg-stars" data-particles="star" data-n="38" data-colors="var(--ink),var(--sun2)"></div>

<section class="sc s1">
  <div class="tg-head">
    <p class="tg-inv a-fade" style="--d:.6s" data-t="invite"></p>
    <p class="tg-dear a-blur" style="--d:1s" data-t="dear" data-if="guest" data-fit="30,13,12"></p>
    <div class="tg-dot a-fade" style="--d:1.5s"><i></i><i></i><i></i></div>
    <p class="tg-from a-rise" style="--d:1.8s" data-t="from" data-fit="20,12"></p>

    <path class="tg-ln" pathLength="1" d="M30 120V38L33 30H41L44 38V120ZM60 120V84Q60 58 86 52Q112 58 112 84V120Z"/>

  </svg>

</section>
