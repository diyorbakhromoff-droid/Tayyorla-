<style>
:root { --f-display: 'Rubik', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: radial-gradient(85% 55% at 50% 52%, var(--card) 0%, var(--bg) 78%); }
.sx-lamp { position: absolute; left: 50%; top: -120px; width: 520px; height: 760px; margin-left: -260px;
  background: conic-gradient(from 180deg at 50% 0%, transparent 160deg, color-mix(in srgb, var(--gold) 12%, transparent) 172deg, color-mix(in srgb, var(--gold) 16%, transparent) 180deg, color-mix(in srgb, var(--gold) 12%, transparent) 188deg, transparent 200deg);
  filter: blur(8px); animation: tv-fade 1.6s ease .1s both; }
.sx-edge { position: absolute; left: 22px; right: 22px; top: 22px; bottom: 22px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }

/* 1. Taxta */
.sx-head { position: absolute; left: 24px; right: 24px; top: 58px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.sx-inv { font-size: 12px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.sx-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.15; }
.sx-wrap { position: absolute; left: 30px; top: 156px; width: 300px; height: 300px; perspective: 900px; perspective-origin: 50% 30%; }
.sx-plane { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(54deg) scale(.94); transform-origin: 50% 55%;
  animation: sx-tilt 1.4s cubic-bezier(.2, .8, .2, 1) .1s both; }
@keyframes sx-tilt { from { opacity: 0; transform: rotateX(80deg) scale(.94) translateZ(-60px); } to { opacity: 1; transform: rotateX(54deg) scale(.94); } }
.sx-sq { position: absolute; inset: 0; background: repeating-conic-gradient(var(--sqd) 0 25%, var(--sql) 0 50%) 0 0 / 75px 75px;
  box-shadow: 0 0 0 9px var(--frame), 0 0 0 10px color-mix(in srgb, var(--gold) 60%, transparent), 0 40px 60px rgba(0, 0, 0, .55); }
.sx-hit { position: absolute; left: 187.5px; top: 75px; width: 37.5px; height: 37.5px; background: var(--gold); opacity: 0;
  animation: sx-hit 1.2s ease 2.2s both; }
@keyframes sx-hit { 0% { opacity: 0; } 30% { opacity: .95; } 100% { opacity: .75; } }
.sx-from { position: absolute; left: 150px; top: 150px; width: 37.5px; height: 37.5px; border: 2px solid var(--gold); opacity: 0; animation: tv-fade .5s ease 1s both; }
.sx-path { position: absolute; left: 0; top: 0; width: 300px; height: 300px; overflow: visible; }
.sx-path path { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sx-draw .8s ease 1.05s both; }
@keyframes sx-draw { to { stroke-dashoffset: 0; } }
.sx-mv { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.sx-mv.k { animation: sx-jump 1.1s cubic-bezier(.45, 0, .35, 1) 1.6s both; }
@keyframes sx-jump { 0% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(19px, -38px, 58px); } 100% { transform: translate3d(37.5px, -75px, 0); } }
.sx-pc { position: absolute; transform-origin: 50% 100%; transform: rotateX(-54deg); overflow: visible; }
.sx-kn { left: 138.75px; top: 88px; width: 60px; height: 86px; }
.sx-pc { --pf: var(--pc1); --ps: var(--pc2); }
.sx-pc.dk { --pf: var(--pd1); --ps: var(--pd2); }
.sxb { fill: var(--pf); stroke: var(--ps); stroke-width: 2.2; stroke-linejoin: round; }
.sxe { fill: var(--ps); } .sxm { fill: none; stroke: var(--ps); stroke-width: 2; stroke-linecap: round; }
.sx-pw1 { left: 73.75px; top: 0; width: 40px; height: 60px; } .sx-pw2 { left: 223.75px; top: 150px; width: 40px; height: 60px; }
.sx-kg { left: 33.25px; top: 156px; width: 46px; height: 92px; }
.sx-shadow { position: absolute; left: 150.75px; top: 160px; width: 36px; height: 18px; border-radius: 50%; background: rgba(0, 0, 0, .45); filter: blur(2px); }
.sx-foot { position: absolute; left: 24px; right: 24px; top: 488px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.sx-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.15; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.sx-by { width: 100%; overflow: hidden; white-space: nowrap; font-size: 14px; font-weight: 500; letter-spacing: .08em; color: var(--muted); }

/* 2. Shaxmat soati — navbat */
.sx-card { position: absolute; left: 34px; right: 34px; top: 60px; bottom: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.sx-ev { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.15; letter-spacing: .04em; text-transform: uppercase; }
.sx-clock { width: 236px; height: 140px; overflow: visible; margin: 6px 0 4px; }
.sx-cb { fill: var(--clock); stroke: color-mix(in srgb, var(--gold) 55%, transparent); stroke-width: 1.5; }
.sx-face { fill: var(--face); } .sx-tick { stroke: var(--clock); stroke-width: 2; stroke-linecap: round; }
.sx-hand { stroke: var(--clock); stroke-width: 3; stroke-linecap: round; transform-box: view-box; }
.sx-hand.a { transform-origin: 62px 82px; animation: sx-spin 6s linear calc(var(--s)) infinite both; }
.sx-hand.b { transform-origin: 174px 82px; transform: rotate(130deg); }
.sx-hand.s { stroke: var(--gold); stroke-width: 1.6; }
.sx-hand.b.s { transform-origin: 174px 82px; animation: sx-spin 6s linear calc(var(--s) + 1.6s) infinite both; }
@keyframes sx-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.sx-btn { fill: var(--gold); transform-box: fill-box; transform-origin: 50% 100%; }
.sx-btn.l { animation: sx-down .25s ease calc(var(--s) + 1.5s) both; }
.sx-btn.r { animation: sx-up .25s ease calc(var(--s) + 1.5s) both; }
@keyframes sx-down { from { transform: none; } to { transform: scaleY(.35); } }
@keyframes sx-up { from { transform: scaleY(.35); } to { transform: none; } }
.sx-turn { width: 100%; overflow: hidden; white-space: nowrap; padding: 10px 14px; border: 1.5px solid var(--gold); font-family: var(--f-display); font-weight: 500; font-size: 20px; line-height: 1.2; color: var(--ink); }
.sx-date { width: 100%; overflow: hidden; white-space: nowrap; margin-top: 8px; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.1; color: var(--accent); }
.sx-wt { font-size: 15px; color: var(--muted); }
.sx-kassa { font-size: 14px; font-weight: 600; letter-spacing: .06em; color: var(--gold); }

/* 3-4 */
.sx-strip { position: absolute; left: 132px; top: 52px; width: 96px; height: 12px; background: repeating-conic-gradient(var(--gold) 0 25%, transparent 0 50%) 0 0 / 24px 24px; opacity: .85; }
.s3 .tv-details { padding-top: 84px; }
.s3 .d-msg { font-family: var(--f-body); font-weight: 500; font-size: 19px; }
.s3 .d-day { font-weight: 700; color: var(--accent); }
.s3 .d-month, .s3 .d-venue { font-weight: 700; }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; font-size: 16px; }
.s4 .f-names { font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--accent); }
.s4 .f-date { font-weight: 500; font-size: 20px; }
/* uzun matn bir necha qatorga bo'linganda balandlik chegarasi */
.sx-dear { max-height: 72px !important; }
.sx-title { max-height: 76px !important; }
.sx-ev { max-height: 70px !important; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="sx-knight" viewBox="0 0 60 90"><path class="sxb" d="M8 88h44v-6c0-4-4-6-8-6H16c-4 0-8 2-8 6z"/><path class="sxb" d="M14 76h32l-2-8H16z"/>
    <path class="sxb" d="M18 68C18 54 26 46 30 40C24 42 18 46 12 50C6 48 4 42 8 36C16 24 24 14 30 10L31 2L37 9C50 14 56 30 52 50C50 58 46 64 44 68Z"/>
    <circle class="sxe" cx="27" cy="21" r="2.4"/><path class="sxm" d="M39 14C47 24 49 40 45 60"/></symbol>
  <symbol id="sx-pawn" viewBox="0 0 40 60"><path class="sxb" d="M5 58h30v-4c0-3-3-5-6-5H11c-3 0-6 2-6 5z"/><path class="sxb" d="M12 49C12 40 16 34 17 28h6c1 6 5 12 5 21z"/><path class="sxb" d="M11 28h18v-4H11z"/><circle class="sxb" cx="20" cy="14" r="9"/></symbol>
  <symbol id="sx-king" viewBox="0 0 40 80"><path class="sxb" d="M4 78h32v-5c0-3-3-5-6-5H10c-3 0-6 2-6 5z"/><path class="sxb" d="M10 68C10 52 14 40 16 30h8c2 10 6 22 6 38z"/><path class="sxb" d="M8 30h24l-3-6H11z"/><path class="sxb" d="M12 24C9 18 12 12 20 12S31 18 28 24z"/><path class="sxb" d="M18 2h4v4h4v4h-4v4h-4v-4h-4V6h4z"/></symbol>
</defs></svg>
<div class="bgk"><div class="sx-lamp"></div><div class="sx-edge"></div></div>

<section class="sc s1">
  <div class="sx-head">
    <p class="sx-inv a-fade" style="--d:.3s" data-t="invite"></p>
    <p class="sx-dear a-rise" style="--d:.5s" data-t="dear" data-if="guest" data-fit="30,18,14"></p>
  </div>
  <div class="sx-wrap">
    <div class="sx-plane">
      <div class="sx-sq"></div>
      <span class="sx-from"></span><span class="sx-hit"></span>
      <svg class="sx-path" viewBox="0 0 300 300" aria-hidden="true"><path pathLength="1" d="M168.75 168.75V93.75H206.25"/></svg>
      <svg class="sx-pc dk sx-pw1" aria-hidden="true"><use href="#sx-pawn"/></svg>
      <svg class="sx-pc dk sx-kg" aria-hidden="true"><use href="#sx-king"/></svg>
      <svg class="sx-pc sx-pw2" aria-hidden="true"><use href="#sx-pawn"/></svg>
      <div class="sx-mv k"><span class="sx-shadow"></span><svg class="sx-pc sx-kn" aria-hidden="true"><use href="#sx-knight"/></svg></div>
    </div>
  </div>
  <div class="sx-foot">
    <p class="sx-title a-blur" style="--d:2.4s" data-t="title" data-fit="32,22,14"></p>
    <p class="sx-by a-rise" style="--d:2.8s" data-t="from" data-fit="14,11"></p>
  </div>
</section>

<section class="sc s2">
  <div class="sx-card">
    <p class="sx-ev a-rise" style="--d:.15s" data-t="title" data-fit="28,18,14"></p>
    <svg class="sx-clock a-pop" style="--d:.35s" viewBox="0 0 236 140" aria-hidden="true">
      <rect class="sx-btn l" x="40" y="4" width="44" height="14" rx="3"/><rect class="sx-btn r" x="152" y="4" width="44" height="14" rx="3"/>
      <rect class="sx-cb" x="2" y="18" width="232" height="120" rx="14"/>
      <circle class="sx-face" cx="62" cy="82" r="40"/><circle class="sx-face" cx="174" cy="82" r="40"/>
      <path class="sx-tick" d="M62 46v6M62 112v6M26 82h6M92 82h6M174 46v6M174 112v6M138 82h6M204 82h6"/>
      <path class="sx-hand" d="M62 82l-14-16"/><path class="sx-hand a s" d="M62 82V50"/>
      <path class="sx-hand" d="M174 82l18-10"/><path class="sx-hand b s" d="M174 82V50"/>
      <circle cx="62" cy="82" r="3.5" fill="var(--gold)"/><circle cx="174" cy="82" r="3.5" fill="var(--gold)"/>
    </svg>
    <p class="sx-turn a-pop" style="--d:1.6s" data-t="turn" data-if="turn" data-fit="20,12"></p>
    <p class="sx-date a-rise" style="--d:1.9s" data-t="date" data-fit="30,16"></p>
    <p class="sx-wt a-rise" style="--d:2.05s" data-t="wt"></p>
    <p class="sx-kassa a-rise" style="--d:2.2s" data-t="kassa" data-if="kassa"></p>
  </div>
</section>

<section class="sc s3">
  <span class="sx-strip a-wipe" style="--d:.1s"></span>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="spark" data-n="18" data-colors="var(--gold)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
