<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: var(--bg); }
.xa-1 { fill: var(--a1); } .xa-2 { fill: var(--a2); } .xa-3 { fill: var(--a3); } .xa-4 { fill: var(--a4); } .xa-5 { fill: var(--accent); }
.xa-w { fill: rgba(255, 255, 255, .55); }
.xa-fab { position: absolute; left: 0; top: -40px; width: 720px; height: 720px; filter: blur(.7px) saturate(1.1); animation: xa-flow 9s linear infinite both; }
@keyframes xa-flow { from { transform: translateX(0); } to { transform: translateX(-360px); } }
.xa-dim { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 50%, color-mix(in srgb, var(--bg) 92%, transparent) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 70%, transparent 100%); }
.xa-sweep { position: absolute; inset: 0; overflow: hidden; animation: tv-wipe 1.2s cubic-bezier(.6, 0, .2, 1) .1s both; }
.xa-center { position: absolute; left: 30px; right: 30px; top: 180px; height: 280px; border-radius: 28px; background: color-mix(in srgb, var(--bg) 92%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; box-shadow: 0 0 0 2px var(--a2); }
.xa-inv { font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--a2); }
.xa-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.25; color: var(--ink); }
.xa-big { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.15; color: var(--a1); }
.xa-from { font-size: 15px; color: var(--muted); }
.xa-strip { position: absolute; left: 0; right: 0; height: 120px; overflow: hidden; }
.xa-strip.t { top: 0; } .xa-strip.b { bottom: 0; }
.xa-strip .xa-fab { top: -200px; }
.xa-panel { position: absolute; left: 0; right: 0; top: 120px; bottom: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 26px; text-align: center; }
.xa-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1.15; color: var(--a2); }
.xa-reason { max-height: 50px; overflow: hidden; font-size: 17px; line-height: 1.4; color: var(--ink); }
.xa-date { margin-top: 10px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.xa-wt { font-size: 15px; color: var(--muted); }
.xa-host { margin-top: 6px; padding: 6px 14px; border-radius: 999px; background: var(--a1); color: #FFFFFF; font-size: 14px; font-weight: 600; }
.s3 .tv-details, .s4 .tv-final { --f-display: 'Unbounded', system-ui, sans-serif; }
.s3 .d-msg { font-style: normal; font-size: 18px; font-family: var(--f-body); }
.s3 .d-day { font-weight: 800; }
.s3 .tv-details { padding-top: 70px; padding-bottom: 60px; }
.s4 .f-names { font-weight: 800; }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; font-size: 17px; }
</style>
