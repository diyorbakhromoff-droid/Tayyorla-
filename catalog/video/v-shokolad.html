<style>
:root { --f-display: 'Alegreya', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(100% 60% at 50% 45%, var(--card) 0%, var(--bg) 72%); }

/* 1. Quti */
.sk-head { position: absolute; left: 24px; right: 24px; top: 50px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.sk-inv { font-size: 12px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.sk-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 32px; line-height: 1.2; color: var(--ink); }
.sk-box { position: absolute; left: 41px; top: 146px; width: 278px; height: 278px; animation: tv-drop 1s cubic-bezier(.2, 1.1, .4, 1) .1s both; }
.sk-tray { position: absolute; inset: 0; border-radius: 14px; padding: 14px; background: var(--box); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px;
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--gold) 55%, transparent), 0 28px 40px -22px rgba(30, 10, 0, .6); }
.sk-cell { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 50%;
  background: repeating-conic-gradient(var(--cell) 0deg 9deg, color-mix(in srgb, var(--cell) 80%, #000) 9deg 18deg); box-shadow: inset 0 4px 8px rgba(0, 0, 0, .35); }
.sk-mac, .sk-tru, .sk-bon { display: block; animation: sk-pop .6s cubic-bezier(.2, 1.6, .4, 1) calc(var(--s) + var(--d)) both; }
@keyframes sk-pop { from { opacity: 0; transform: scale(.4) translateY(-14px); } to { opacity: 1; transform: none; } }
.sk-mac { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, color-mix(in srgb, var(--c) 40%, #FFFFFF) 0%, var(--c) 46%, color-mix(in srgb, var(--c) 80%, #000) 100%);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 70%, #FFFFFF), 0 0 0 5px color-mix(in srgb, var(--c) 70%, #000), 0 6px 8px rgba(0, 0, 0, .35); }
.sk-tru { width: 54px; height: 54px; border-radius: 50%; background: repeating-linear-gradient(-35deg, transparent 0 6px, var(--c) 6px 8px), radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--choc) 60%, #FFFFFF) 0%, var(--choc) 55%);
  box-shadow: 0 6px 8px rgba(0, 0, 0, .4); }
.sk-bon { position: relative; width: 50px; height: 50px; border-radius: 10px; background: linear-gradient(145deg, color-mix(in srgb, var(--choc) 70%, #FFFFFF) 0%, var(--choc) 60%);
  box-shadow: 0 6px 8px rgba(0, 0, 0, .4); }
.sk-bon::after { content: ""; position: absolute; left: 17px; top: 15px; width: 16px; height: 16px; background: var(--gold); clip-path: polygon(50% 0, 64% 34%, 100% 40%, 70% 62%, 80% 100%, 50% 78%, 20% 100%, 30% 62%, 0 40%, 36% 34%); }
.sk-lid { position: absolute; inset: -4px; border-radius: 16px; background: var(--lid); overflow: hidden; z-index: 2;
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 70%, transparent), 0 20px 30px -18px rgba(30, 10, 0, .6);
  animation: sk-lift 1.5s cubic-bezier(.55, 0, .35, 1) 1.5s both; }
@keyframes sk-lift { 0% { transform: none; opacity: 1; } 30% { transform: translateY(-14px) scale(1.04) rotate(-1deg); opacity: 1; }
  100% { transform: translate(40px, -460px) scale(1.18) rotate(-12deg); opacity: 0; } }
.sk-lid::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .25), transparent 40%, rgba(0, 0, 0, .1)); }
.sk-rb { position: absolute; background: linear-gradient(90deg, color-mix(in srgb, var(--ribbon) 80%, #000), var(--ribbon) 30%, color-mix(in srgb, var(--ribbon) 50%, #FFFFFF) 50%, var(--ribbon) 70%, color-mix(in srgb, var(--ribbon) 80%, #000)); }
.sk-rb.v { left: 50%; top: 0; bottom: 0; width: 28px; margin-left: -14px; }
.sk-rb.h { top: 50%; left: 0; right: 0; height: 28px; margin-top: -14px; background: linear-gradient(180deg, color-mix(in srgb, var(--ribbon) 80%, #000), var(--ribbon) 30%, color-mix(in srgb, var(--ribbon) 50%, #FFFFFF) 50%, var(--ribbon) 70%, color-mix(in srgb, var(--ribbon) 80%, #000)); }
.sk-bow { position: absolute; left: 89px; top: 99px; width: 108px; height: 80px; z-index: 3; overflow: visible; }
.sk-bow path, .sk-bow ellipse { fill: var(--ribbon); stroke: color-mix(in srgb, var(--ribbon) 70%, #000); stroke-width: 1.2; }
.sk-sheen { position: absolute; inset: 0; z-index: 4; background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .45) 50%, transparent 65%); background-size: 300% 100%;
  animation: sk-sheen 1.2s ease .3s both; }
@keyframes sk-sheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
.sk-foot { position: absolute; left: 22px; right: 22px; top: 444px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sk-title { width: 100%; max-height: 106px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-weight: 800;
  font-size: 44px; line-height: 1.1; color: var(--accent); }
.sk-foil { flex: none; width: 100px; height: 12px; overflow: visible; }
.sk-foil path { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1; animation: sk-draw 1s ease calc(var(--s) + var(--d)) both; }
.sk-foil circle { fill: var(--gold); }
@keyframes sk-draw { to { stroke-dashoffset: 0; } }
.sk-from { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

/* 2. Ta'mlar kartasi */
.sk-card { position: absolute; left: 30px; right: 30px; top: 70px; bottom: 70px; border-radius: 8px; background: var(--box); color: #FFFFFF;
  box-shadow: 0 30px 50px -28px rgba(30, 10, 0, .7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px 24px; text-align: center; }
.sk-card::before { content: ""; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--gold) 70%, transparent); border-radius: 4px; pointer-events: none; }
.sk-card::after { content: ""; position: absolute; inset: 15px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: 2px; pointer-events: none; }
.sk-stack { width: 92px; height: 86px; overflow: visible; }
.sk-sm { animation: sk-pop .6s cubic-bezier(.2, 1.6, .4, 1) calc(var(--s) + var(--d)) both; transform-box: fill-box; transform-origin: center; }
.sk-ct { width: 100%; max-height: 92px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 38px; line-height: 1.1; color: var(--gold); }
.sk-dv { display: flex; align-items: center; gap: 8px; width: 140px; }
.sk-dv span { flex: 1; height: 1px; background: var(--gold); opacity: .7; }
.sk-dv i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); }
.sk-row { width: 100%; overflow: hidden; white-space: nowrap; font-size: 16px; font-weight: 600; color: #FFFFFF; }
.sk-row.k { color: color-mix(in srgb, var(--m1) 70%, #FFFFFF); }
.sk-dt { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 28px; color: #FFFFFF; }
.sk-wt { font-size: 14px; font-weight: 500; letter-spacing: .06em; color: color-mix(in srgb, #FFFFFF 70%, var(--box)); }

/* 3-4 */
.sk-top { position: absolute; left: 150px; top: 34px; width: 60px; height: 44px; overflow: visible; }
.sk-sc { position: absolute; width: 64px; height: 50px; overflow: visible; }
.s3 .tv-details { padding-top: 90px; }
.s3 .d-day, .s3 .d-month, .s3 .d-venue, .s4 .f-names, .s4 .f-date { font-weight: 800; }
.s3 .d-sign b { font-weight: 700; }
.s4 .f-names { color: var(--accent); }
.s4 .tv-final { padding-top: 70px; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="sk-m" viewBox="0 0 64 50" overflow="visible">
    <path d="M6 20C6 6 58 6 58 20Z" style="fill:var(--mc)"/><path d="M6 20C6 8 30 6 40 9" style="fill:none;stroke:#FFFFFF;stroke-opacity:.45;stroke-width:2;stroke-linecap:round"/>
    <path d="M7 20h50v3H7z" style="fill:color-mix(in srgb, var(--mc) 75%, #000)"/>
    <rect x="9" y="22" width="46" height="8" rx="4" style="fill:var(--fill)"/>
    <path d="M7 29h50v3H7z" style="fill:color-mix(in srgb, var(--mc) 75%, #000)"/>
    <path d="M6 31h52C58 44 6 44 6 31Z" style="fill:var(--mc)"/>
  </symbol>
</defs></svg>
<div class="bgk"><div class="ptc" data-particles="dust" data-n="22" data-colors="var(--gold)"></div></div>

<section class="sc s1">
  <div class="sk-head">
    <p class="sk-inv a-fade" style="--d:.2s" data-t="invite"></p>
    <p class="sk-dear a-blur" style="--d:.5s" data-t="dear" data-if="guest" data-fit="32,16"></p>
  </div>
  <div class="sk-box">
    <div class="sk-tray">
      <div class="sk-cell"><i class="sk-mac" style="--c:var(--m1);--d:2.1s"></i></div>
      <div class="sk-cell"><i class="sk-tru" style="--c:var(--gold);--d:2.25s"></i></div>
      <div class="sk-cell"><i class="sk-mac" style="--c:var(--m2);--d:2.4s"></i></div>
      <div class="sk-cell"><i class="sk-bon" style="--d:2.55s"></i></div>
      <div class="sk-cell"><i class="sk-mac" style="--c:var(--m3);--d:2.2s"></i></div>
      <div class="sk-cell"><i class="sk-bon" style="--d:2.35s"></i></div>
      <div class="sk-cell"><i class="sk-mac" style="--c:var(--m2);--d:2.5s"></i></div>
      <div class="sk-cell"><i class="sk-tru" style="--c:var(--m1);--d:2.65s"></i></div>
      <div class="sk-cell"><i class="sk-mac" style="--c:var(--m1);--d:2.3s"></i></div>
    </div>
    <div class="sk-lid">
      <span class="sk-rb v"></span><span class="sk-rb h"></span>
      <svg class="sk-bow" viewBox="0 0 108 80" aria-hidden="true">
        <path d="M54 40C38 14 8 10 10 30C12 50 40 46 54 40Z"/><path d="M54 40C70 14 100 10 98 30C96 50 68 46 54 40Z"/>
        <path d="M50 44 34 76 44 74 50 80 54 46Z"/><path d="M58 44 74 76 64 74 58 80 54 46Z"/>
        <ellipse cx="54" cy="41" rx="9" ry="8"/>
      </svg>
      <span class="sk-sheen"></span>
    </div>
  </div>
  <div class="sk-foot">
  <p class="sk-title a-blur" style="--d:2.9s" data-t="title" data-fit="44,24,20"></p>
  <svg class="sk-foil" viewBox="0 0 100 12" aria-hidden="true"><path pathLength="1" style="--d:3.3s" d="M0 6H40M60 6H100"/><circle class="a-pop" style="--d:3.5s" cx="50" cy="6" r="3"/></svg>
  <p class="sk-from a-rise" style="--d:3.6s" data-t="from" data-fit="13,10"></p>
  </div>
</section>

<section class="sc s2">
  <div class="sk-card a-rise" style="--d:.05s">
    <svg class="sk-stack" viewBox="0 0 92 86" aria-hidden="true">
      <use class="sk-sm" href="#sk-m" x="14" y="50" width="64" height="50" style="--mc:var(--m2);--fill:var(--m3);--d:.4s"/>
      <use class="sk-sm" href="#sk-m" x="16" y="25" width="60" height="47" style="--mc:var(--m1);--fill:#FFFFFF;--d:.6s"/>
      <use class="sk-sm" href="#sk-m" x="19" y="1" width="54" height="42" style="--mc:var(--m3);--fill:var(--choc);--d:.8s"/>
    </svg>
    <p class="sk-ct a-blur" style="--d:.9s" data-t="title" data-fit="38,18,16"></p>
    <div class="sk-dv a-fade" style="--d:1.1s"><span></span><i></i><span></span></div>
    <p class="sk-row a-rise" style="--d:1.3s" data-t="turn" data-if="turn" data-fit="16,11"></p>
    <p class="sk-row k a-rise" style="--d:1.5s" data-t="kassa" data-if="kassa" data-fit="16,11"></p>
    <p class="sk-dt a-rise" style="--d:1.8s" data-t="date" data-fit="28,15"></p>
    <p class="sk-wt a-rise" style="--d:2s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3">
  <svg class="sk-top a-pop" style="--d:.1s" viewBox="0 0 64 50" aria-hidden="true"><use href="#sk-m" width="64" height="50" style="--mc:var(--m1);--fill:var(--m3)"/></svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <svg class="sk-sc a-pop" style="left:22px;top:40px;--d:.3s" viewBox="0 0 64 50" aria-hidden="true"><use transform="rotate(-18 32 25)" href="#sk-m" width="64" height="50" style="--mc:var(--m1);--fill:var(--m3)"/></svg>
  <svg class="sk-sc a-pop" style="left:276px;top:70px;--d:.5s" viewBox="0 0 64 50" aria-hidden="true"><use transform="rotate(16 32 25)" href="#sk-m" width="64" height="50" style="--mc:var(--m2);--fill:#FFFFFF"/></svg>
  <svg class="sk-sc a-pop" style="left:150px;top:22px;--d:.7s;width:50px;height:40px" viewBox="0 0 64 50" aria-hidden="true"><use href="#sk-m" width="64" height="50" style="--mc:var(--m3);--fill:var(--choc)"/></svg>
  <div class="tv-final" data-std="final"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
