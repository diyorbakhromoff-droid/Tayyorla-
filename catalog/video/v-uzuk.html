<style>
:root { --f-display: 'Yeseva One', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: radial-gradient(110% 62% at 50% 38%, var(--card) 0%, var(--bg) 74%); }
.uz-halo { position: absolute; left: 20px; top: 116px; width: 320px; height: 320px; border-radius: 50%; border: 1px dashed var(--gold); opacity: .22;
  animation: uz-spin 60s linear infinite both; }
.uz-halo.b { left: -10px; top: 86px; width: 380px; height: 380px; border-style: solid; opacity: .1; animation-direction: reverse; }
@keyframes uz-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.uz-stop1 { stop-color: var(--ring1); } .uz-stop2 { stop-color: var(--ring2); }
.uz-ring { fill: none; stroke: url(#uz-g); stroke-width: 7; }
.uz-shine { fill: none; stroke: #FFFFFF; stroke-opacity: .38; stroke-width: 1; }
.uz-gem { fill: #FFFFFF; stroke: var(--ring2); stroke-width: 1; }
.uz-inf { fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: uz-draw 1.8s cubic-bezier(.5, 0, .3, 1) calc(var(--s) + var(--d, 0s)) both; }
.uz-inf.w { stroke-width: 9; stroke-opacity: .16; }
@keyframes uz-draw { to { stroke-dashoffset: 0; } }

/* 1. Uzuklar */
.uz-head { position: absolute; left: 24px; right: 24px; top: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.uz-inv { font-size: 15px; font-weight: 500; letter-spacing: .04em; color: var(--muted); }
.uz-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 30px; line-height: 1.25; }
.uz-stage { position: absolute; left: 20px; top: 196px; width: 320px; height: 170px; }
.uz-stage svg { position: absolute; left: 0; top: 0; width: 320px; height: 170px; overflow: visible; }
.uz-a { animation: uz-in-a 1.4s cubic-bezier(.25, .9, .3, 1) .3s both; }
.uz-b { animation: uz-in-b 1.4s cubic-bezier(.25, .9, .3, 1) .3s both; }
@keyframes uz-in-a { from { transform: translateX(-190px) rotate(-200deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes uz-in-b { from { transform: translateX(190px) rotate(200deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
.uz-a, .uz-b { transform-box: view-box; transform-origin: 160px 85px; }
.uz-flash { position: absolute; left: 130px; top: 55px; width: 60px; height: 60px; border-radius: 50%;
  background: radial-gradient(circle, #FFFFFF 0%, color-mix(in srgb, var(--gold) 60%, transparent) 30%, transparent 70%); opacity: 0;
  animation: uz-flash 1.2s ease-out 1.6s both; }
@keyframes uz-flash { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(3.2); } }
.uz-glintw { position: absolute; inset: 0; animation: tv-fade .6s ease 3.6s both; }
.uz-glint { position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF;
  box-shadow: 0 0 6px 2px var(--gold), 0 0 18px 6px color-mix(in srgb, var(--gold) 45%, transparent);
  offset-path: path('M160 85C195 30 300 28 300 85C300 142 195 140 160 85C125 30 20 28 20 85C20 142 125 140 160 85Z'); offset-rotate: 0deg;
  animation: uz-run 3.4s linear 3.6s infinite both; }
@keyframes uz-run { from { offset-distance: 0%; } to { offset-distance: 100%; } }
.uz-names { position: absolute; left: 24px; right: 24px; top: 392px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display);
  font-size: 40px; line-height: 1.2; color: var(--accent); }
.uz-from { position: absolute; left: 24px; right: 24px; top: 452px; text-align: center; font-size: 16px; font-weight: 500; letter-spacing: .03em; color: var(--muted); }
.uz-tie { position: absolute; left: 140px; top: 492px; width: 80px; display: flex; align-items: center; gap: 8px; }
.uz-tie span { flex: 1; height: 1px; background: var(--gold); opacity: .7; }
.uz-tie i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); }

/* 2. Ismlar */
.uz-card { position: absolute; left: 30px; right: 30px; top: 84px; bottom: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.uz-mini { width: 92px; height: 52px; margin-bottom: 8px; overflow: visible; }
.uz-mini .uz-ring { stroke-width: 5; }
.uz-event { font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.uz-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 56px; line-height: 1.12; }
.uz-sep { width: 74px; height: 34px; overflow: visible; }
.uz-sep .uz-inf { stroke-width: 2.4; }
.uz-date { margin-top: 18px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 25px; color: var(--accent); }
.uz-wt { font-size: 15px; color: var(--muted); }

/* 3-4 */
.uz-top { position: absolute; left: 130px; top: 44px; width: 100px; height: 50px; overflow: visible; }
.s3 .tv-details { padding-top: 100px; }
.d-day, .d-month, .d-venue, .f-names, .f-date, .d-sign b { font-weight: 400; }
.d-sign { font-style: normal; }
.d-msg { font-size: 20px; }
.s4 .tv-final { padding-top: 60px; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="uz-g" x1="0" y1="0" x2="1" y2="1"><stop class="uz-stop1" offset="0"/><stop class="uz-stop2" offset=".55"/><stop class="uz-stop1" offset="1"/></linearGradient>
</defs></svg>
<div class="bgk">
  <div class="uz-halo b"></div><div class="uz-halo"></div>
  <div class="ptc" data-particles="star" data-n="40" data-colors="var(--gold),#FFFFFF"></div>
</div>

<section class="sc s1">
  <div class="uz-head">
    <p class="uz-inv a-fade" style="--d:.2s" data-t="invite"></p>
    <p class="uz-dear a-blur" style="--d:.5s" data-t="dear" data-if="guest" data-fit="30,16"></p>
  </div>
  <div class="uz-stage">
    <svg viewBox="0 0 320 170" aria-hidden="true">
      <path class="uz-inf w" pathLength="1" style="--d:2s" d="M160 85C195 30 300 28 300 85C300 142 195 140 160 85C125 30 20 28 20 85C20 142 125 140 160 85Z"/>
      <path class="uz-inf" pathLength="1" style="--d:2s" d="M160 85C195 30 300 28 300 85C300 142 195 140 160 85C125 30 20 28 20 85C20 142 125 140 160 85Z"/>
      <g class="uz-a"><circle class="uz-ring" cx="136" cy="85" r="34"/><circle class="uz-shine" cx="136" cy="85" r="36.5"/></g>
      <g class="uz-b"><circle class="uz-ring" cx="184" cy="85" r="34"/><circle class="uz-shine" cx="184" cy="85" r="36.5"/>
        <path class="uz-gem" d="M184 38l7 7-7 9-7-9z"/></g>
      <g class="uz-a"><path class="uz-ring" d="M150.4 54.2A34 34 0 0 1 165.4 68"/></g>
    </svg>
    <span class="uz-flash"></span>
    <div class="uz-glintw"><span class="uz-glint"></span></div>
  </div>
  <p class="uz-names a-blur" style="--d:2.5s" data-t="names_line" data-fit="40,18"></p>
  <p class="uz-from a-rise" style="--d:3s" data-t="from"></p>
  <div class="uz-tie a-fade" style="--d:3.3s"><span></span><i></i><span></span></div>
</section>

<section class="sc s2">
  <div class="uz-card">
    <svg class="uz-mini a-pop" style="--d:.1s" viewBox="0 0 92 52" aria-hidden="true">
      <circle class="uz-ring" cx="34" cy="28" r="20"/><circle class="uz-ring" cx="58" cy="28" r="20"/><path class="uz-ring" d="M42.9 10.1A20 20 0 0 1 51.4 18.6"/>
    </svg>
    <p class="uz-event a-fade" style="--d:.3s" data-t="event"></p>
    <p class="uz-name a-blur" style="--d:.5s" data-t="name1" data-fit="56,15"></p>
    <svg class="uz-sep" viewBox="0 0 74 34" aria-hidden="true"><path class="uz-inf" pathLength="1" style="--d:.9s" d="M37 17C45 5 70 4 70 17C70 30 45 29 37 17C29 5 4 4 4 17C4 30 29 29 37 17Z"/></svg>
    <p class="uz-name a-blur" style="--d:1.1s" data-t="name2" data-fit="56,15"></p>
    <p class="uz-date a-rise" style="--d:1.6s" data-t="date" data-fit="25,15"></p>
    <p class="uz-wt a-rise" style="--d:1.8s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3">
  <svg class="uz-top" viewBox="0 0 100 50" aria-hidden="true"><path class="uz-inf" pathLength="1" style="--d:.1s" d="M50 25C61 8 96 7 96 25C96 43 61 42 50 25C39 8 4 7 4 25C4 43 39 42 50 25Z"/></svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="spark" data-n="26" data-colors="var(--gold),#FFFFFF,var(--ring1)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
