<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(90% 50% at 50% 40%, var(--card) 0%, var(--bg) 78%); }
.pn-a1 { stop-color: var(--p2); } .pn-a2 { stop-color: var(--p1); } .pn-b1 { stop-color: var(--p3); } .pn-b2 { stop-color: var(--p2); }
.pn-pt { stroke: color-mix(in srgb, var(--p3) 55%, transparent); stroke-width: .8; transform-box: view-box; transform-origin: 0 0;
  animation: pn-open 1.9s cubic-bezier(.2, .8, .25, 1) calc(var(--s) + var(--d)) both; }
@keyframes pn-open { from { transform: scale(.12, .3); opacity: 0; } 25% { opacity: 1; } to { transform: none; opacity: 1; } }
.pn-leaf { fill: var(--leaf); transform-box: view-box; transform-origin: 0 0; animation: pn-leaf 1.4s cubic-bezier(.2, .8, .3, 1) calc(var(--s) + var(--d)) both; }
@keyframes pn-leaf { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.pn-vein { fill: none; stroke: var(--bg); stroke-opacity: .35; stroke-width: 1.4; }
.pn-ctr { fill: var(--stamen); animation: tv-pop .8s cubic-bezier(.2, 1.5, .4, 1) calc(var(--s) + var(--d)) both; transform-box: fill-box; transform-origin: center; }
.pn-fl { animation: pn-turn 6s cubic-bezier(.2, .6, .3, 1) var(--s) both; }
@keyframes pn-turn { from { transform: rotate(-24deg) scale(.86); } to { transform: none; } }

/* 1 */
.pn-head { position: absolute; left: 24px; right: 24px; top: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; z-index: 2; }
.pn-inv { font-size: 12px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.pn-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 34px; line-height: 1.2; color: var(--ink); }
.pn-big { position: absolute; left: 0; top: 130px; width: 360px; height: 320px; overflow: visible; }
.pn-c1 { position: absolute; left: -90px; top: 470px; width: 220px; height: 220px; overflow: visible; opacity: .9; }
.pn-c2 { position: absolute; right: -80px; top: -70px; width: 200px; height: 200px; overflow: visible; opacity: .85; }
.pn-foot { position: absolute; left: 22px; right: 22px; top: 446px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2; }
.pn-title { width: 100%; max-height: 120px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display);
  font-weight: 600; font-size: 46px; line-height: 1.08; letter-spacing: .02em; color: var(--accent); z-index: 2; }
.pn-from { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 21px; color: var(--muted); z-index: 2; }

/* 2 */
.pn-c3 { position: absolute; right: -96px; top: -84px; width: 270px; height: 270px; overflow: visible; }
.pn-c4 { position: absolute; left: -100px; bottom: -90px; width: 250px; height: 250px; overflow: visible; }
.pn-card { position: absolute; left: 34px; right: 34px; top: 120px; bottom: 120px; border-radius: 4px; background: color-mix(in srgb, var(--card) 84%, transparent);
  backdrop-filter: blur(6px); box-shadow: 0 24px 50px -30px color-mix(in srgb, var(--p3) 70%, transparent); outline: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); outline-offset: -10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px 26px; text-align: center; }
.pn-ev { width: 100%; max-height: 100px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 42px; line-height: 1.08; color: var(--accent); }
.pn-line { width: 60px; height: 1px; background: var(--accent2); }
.pn-tag { max-width: 100%; overflow: hidden; white-space: nowrap; padding: 6px 16px; border-radius: 18px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); font-size: 15px; font-weight: 600; color: var(--ink); }
.pn-dt { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.1; color: var(--ink); }
.pn-wt { font-size: 15px; color: var(--muted); }

/* 3-4 */
.pn-c5 { position: absolute; left: 130px; top: 22px; width: 100px; height: 100px; overflow: visible; }
.s3 .tv-details { padding-top: 110px; }
.s3 .d-day, .s3 .d-month, .s3 .d-venue, .s4 .f-names, .s4 .f-date { font-weight: 600; }
.s3 .d-msg { font-size: 23px; }
.s3 .d-sign b { font-style: italic; }
</style>
