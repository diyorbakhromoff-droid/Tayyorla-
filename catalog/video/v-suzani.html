<style>
:root { --f-display: 'Lora', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: var(--bg); }
.sz-c { fill: var(--card); }
.sz-a { fill: var(--accent); }
.sz-lf { fill: var(--leaf); }
.sz-b { fill: var(--accent2); }
.sz-g { fill: var(--gold); }
.sz-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.sz-svg > circle:first-of-type { stroke: var(--accent); stroke-width: 2; }
.sz-border { position: absolute; inset: 10px; border: 1.5px solid var(--accent); border-radius: 6px; opacity: .55; }
.sz-border::before { content: ""; position: absolute; inset: 5px; border: 1px dashed var(--accent2); border-radius: 4px; opacity: .6; }

/* 1. Medalyon ochiladi */
.sz-head { position: absolute; left: 24px; right: 24px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.sz-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.sz-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 34px; line-height: 1.2; }
.sz-bloom { position: absolute; left: 60px; top: 200px; width: 240px; height: 240px; animation: sz-bloom 1.6s cubic-bezier(.2, 1, .3, 1) .35s both; }
.sz-spin { width: 100%; height: 100%; animation: sz-turn 24s linear .35s infinite both; }
@keyframes sz-bloom { 0% { transform: scale(0) rotate(-120deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes sz-turn { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.sz-names { position: absolute; left: 24px; right: 24px; top: 470px; text-align: center; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 30px; color: var(--accent); }
.sz-from { position: absolute; left: 24px; right: 24px; top: 516px; text-align: center; font-size: 15px; font-weight: 500; color: var(--muted); }

/* 2. Kartochka: burchaklarda medalyonlar */
.sz-card { position: absolute; left: 22px; right: 22px; top: 46px; bottom: 46px; border-radius: 10px; background: var(--card); overflow: hidden;
  box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .45); }
.sz-corner { position: absolute; width: 132px; height: 132px; opacity: .95; }
.sz-corner.tl { left: -66px; top: -66px; } .sz-corner.tr { right: -66px; top: -66px; }
.sz-corner.bl { left: -66px; bottom: -66px; } .sz-corner.br { right: -66px; bottom: -66px; }
.sz-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 70px 26px; text-align: center; }
.sz-event { margin-bottom: 8px; font-size: 13px; font-weight: 600; letter-spacing: .16em; color: var(--accent); }
.sz-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 56px; line-height: 1.08; }
.sz-amp { font-family: var(--f-display); font-style: italic; font-size: 30px; color: var(--accent); line-height: 1; }
.sz-date { margin-top: 18px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 26px; }
.sz-wt { font-size: 15px; color: var(--muted); }

.sz-rosette { position: absolute; left: 150px; top: 26px; width: 60px; height: 60px; }
.s3 .tv-details { padding-top: 92px; }
.s4 .tv-final { padding-top: 60px; }
</style>
