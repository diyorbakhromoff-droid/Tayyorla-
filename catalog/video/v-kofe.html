<style>
:root { --f-display: 'Lora', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(120% 70% at 50% 42%, color-mix(in srgb, var(--card) 70%, var(--bg)) 0%, var(--bg) 70%); }
.kf-bean { fill: var(--coffee); opacity: .5; }
.kf-bean path { fill: none; stroke: var(--bg); stroke-width: 1.6; stroke-linecap: round; opacity: .7; }
.kf-beans { position: absolute; inset: 0; width: 360px; height: 640px; }

/* 1. Latte */
.kf-head { position: absolute; left: 24px; right: 24px; top: 58px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.kf-inv { font-size: 12px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
.kf-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 30px; line-height: 1.25; color: var(--ink); }
.kf-cup { position: absolute; left: 20px; top: 150px; width: 320px; height: 290px; overflow: visible; animation: kf-in 1.2s cubic-bezier(.2, .9, .3, 1) .1s both; }
@keyframes kf-in { from { opacity: 0; transform: translateY(40px) scale(.9) rotate(-14deg); } to { opacity: 1; transform: none; } }
.kf-cup svg { position: absolute; inset: 0; width: 320px; height: 290px; overflow: visible; }
.kf-saucer { fill: var(--saucer); }
.kf-saucer2 { fill: none; stroke: var(--coffee); stroke-opacity: .08; stroke-width: 1.5; }
.kf-shadow { fill: var(--coffee); opacity: .16; filter: blur(9px); }
.kf-china { fill: var(--cup); }
.kf-handle { fill: none; stroke: var(--cup); stroke-width: 13; stroke-linecap: round; }
.kf-rim { fill: none; stroke: var(--coffee); stroke-opacity: .12; stroke-width: 1.2; }
.kf-c1 { stop-color: var(--crema); } .kf-c2 { stop-color: var(--coffee); }
.kf-surf { fill: url(#kf-g); }
.kf-ring { fill: none; stroke: var(--foam); stroke-opacity: .18; stroke-width: 2; }
.kf-swirl { transform-box: view-box; transform-origin: 160px 140px; animation: kf-rot 14s linear both; }
@keyframes kf-rot { from { transform: rotate(0); } to { transform: rotate(150deg); } }
.kf-foam { fill: var(--foam); transform-box: view-box; transform-origin: 160px 140px;
  d: path('M160 92C187.6 92 210 114.4 210 142C210 169.6 187.6 192 160 192C132.4 192 110 169.6 110 142C110 114.4 132.4 92 160 92Z');
  animation: kf-pour 1.3s cubic-bezier(.3, .7, .3, 1) .7s both, kf-heart .9s cubic-bezier(.6, 0, .25, 1) 2.15s both; }
@keyframes kf-pour { from { transform: scale(.06); opacity: 0; } 15% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes kf-heart { to { d: path('M160 116C176 84 222 90 218 128C215 158 180 176 160 200C140 176 105 158 102 128C98 90 144 84 160 116Z'); } }
.kf-pull { fill: none; stroke: var(--foam); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: kf-draw .6s cubic-bezier(.5, 0, .3, 1) 2.1s both; }
@keyframes kf-draw { to { stroke-dashoffset: 0; } }
.kf-in { fill: none; stroke: var(--crema); stroke-width: 2.4; stroke-linecap: round; opacity: 0; animation: tv-fade .8s ease 3s both; }
.kf-steam { position: absolute; left: 90px; top: 70px; width: 140px; height: 120px; z-index: 2; }
.kf-steam .p-steam { width: 30px; height: 70px; }
.kf-foot { position: absolute; left: 24px; right: 24px; top: 446px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.kf-title { width: 100%; max-height: 110px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display);
  font-style: italic; font-weight: 600; font-size: 44px; line-height: 1.12; color: var(--accent); }
.kf-from { max-width: 100%; overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); }
.kf-from span { min-width: 0; overflow: hidden; white-space: nowrap; }
.kf-from::before, .kf-from::after { content: ""; flex: none; width: 26px; height: 1px; background: var(--gold); }

/* 2. Menyu */
.kf-menu { position: absolute; left: 30px; right: 30px; top: 74px; bottom: 74px; border-radius: 180px 180px 22px 22px; background: var(--card);
  box-shadow: 0 30px 50px -30px rgba(40, 20, 10, .55); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 24px 30px; text-align: center; }
.kf-menu::before { content: ""; position: absolute; inset: 8px; border-radius: 172px 172px 16px 16px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); pointer-events: none; }
.kf-mug { width: 76px; height: 70px; overflow: visible; }
.kf-mug .m { fill: var(--accent); }
.kf-mug .h { fill: none; stroke: var(--accent); stroke-width: 5; }
.kf-mug .st { fill: none; stroke: var(--accent2); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: kf-sdraw 1.6s ease calc(var(--s) + var(--d)) infinite both; }
@keyframes kf-sdraw { 0% { stroke-dashoffset: 1; opacity: 0; } 20% { opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.kf-mt { width: 100%; max-height: 92px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.12; color: var(--accent); }
.kf-div { display: flex; align-items: center; gap: 10px; width: 150px; }
.kf-div span { flex: 1; height: 1px; background: var(--gold); opacity: .6; }
.kf-div svg { width: 14px; height: 18px; }
.kf-row { width: 100%; overflow: hidden; white-space: nowrap; font-size: 17px; font-weight: 600; color: var(--ink); }
.kf-row.k { color: var(--accent); }
.kf-md { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.2; }
.kf-wt { font-size: 15px; color: var(--muted); }
.kf-ven { width: 100%; overflow: hidden; white-space: nowrap; font-size: 15px; font-weight: 500; color: var(--muted); }

/* 3-4 */
.kf-top { position: absolute; left: 156px; top: 30px; width: 48px; height: 44px; overflow: visible; }
.s4 .p-bokeh { opacity: .22; }
.s3 .tv-details { padding-top: 84px; }
.s3 .d-day { font-weight: 600; }
.s3 .d-sign b, .s4 .f-names { font-style: italic; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="kf-g" cx=".5" cy=".5" r=".5"><stop class="kf-c1" offset="0"/><stop class="kf-c1" offset=".55"/><stop class="kf-c2" offset="1"/></radialGradient>
  <symbol id="kf-b" viewBox="-10 -14 20 28"><ellipse cx="0" cy="0" rx="9" ry="13"/><path d="M0-11C-4-4 4 4 0 11"/></symbol>
</defs></svg>
<div class="bgk">
  <svg class="kf-beans" viewBox="0 0 360 640" aria-hidden="true">
    <use class="kf-bean" href="#kf-b" x="18" y="40" width="20" height="28" transform="rotate(-25 28 54)"/>
    <use class="kf-bean" href="#kf-b" x="318" y="120" width="18" height="25" transform="rotate(35 327 132)"/>
    <use class="kf-bean" href="#kf-b" x="300" y="584" width="20" height="28" transform="rotate(60 310 598)"/>
    <use class="kf-bean" href="#kf-b" x="28" y="560" width="16" height="23" transform="rotate(-50 36 571)"/>
    <use class="kf-bean" href="#kf-b" x="40" y="590" width="18" height="25" transform="rotate(15 49 602)"/>
  </svg>
</div>

<section class="sc s1">
  <div class="kf-head">
    <p class="kf-inv a-fade" style="--d:.2s" data-t="invite"></p>
    <p class="kf-dear a-blur" style="--d:.4s" data-t="dear" data-if="guest" data-fit="30,14"></p>
  </div>
  <div class="kf-cup">
    <svg viewBox="0 0 320 290" aria-hidden="true">
      <ellipse class="kf-shadow" cx="166" cy="152" rx="130" ry="126"/>
      <circle class="kf-saucer" cx="160" cy="140" r="132"/>
      <circle class="kf-saucer2" cx="160" cy="140" r="112"/>
      <path class="kf-handle" d="M252 120h22a20 20 0 0 1 0 40h-22"/>
      <circle class="kf-china" cx="160" cy="140" r="98"/>
      <circle class="kf-rim" cx="160" cy="140" r="98"/>
      <circle class="kf-surf" cx="160" cy="140" r="86"/>
      <g class="kf-swirl"><circle class="kf-ring" cx="160" cy="140" r="74" stroke-dasharray="40 26"/><circle class="kf-ring" cx="160" cy="140" r="64" stroke-dasharray="22 30"/></g>
      <path class="kf-foam"/>
      <path class="kf-in" d="M160 124C168 108 196 110 194 130C192 146 172 156 160 170C148 156 128 146 126 130C124 110 152 108 160 124Z"/>
      <path class="kf-pull" pathLength="1" d="M160 84V206"/>
    </svg>
    <div class="kf-steam ptc" data-particles="steam" data-n="7" data-at="1" data-colors="var(--foam)"></div>
  </div>
  <div class="kf-foot">
    <p class="kf-title a-blur" style="--d:3s" data-t="title" data-fit="44,24,20"></p>
    <p class="kf-from a-rise" style="--d:3.5s"><span data-t="from" data-fit="15,11"></span></p>
  </div>
</section>

<section class="sc s2">
  <div class="kf-menu a-rise" style="--d:.05s">
    <svg class="kf-mug a-pop" style="--d:.3s" viewBox="0 0 76 70" aria-hidden="true">
      <path class="st" pathLength="1" style="--d:.8s" d="M26 24c-6-6 6-10 0-18"/><path class="st" pathLength="1" style="--d:1.2s" d="M40 24c-6-6 6-10 0-18"/>
      <path class="m" d="M12 32h44v14a20 20 0 0 1-20 20h-4a20 20 0 0 1-20-20z"/><path class="h" d="M55 37h4a8 8 0 0 1 0 16h-6"/>
    </svg>
    <p class="kf-mt a-blur" style="--d:.5s" data-t="title" data-fit="40,18,16"></p>
    <div class="kf-div a-fade" style="--d:.8s"><span></span><svg viewBox="-10 -14 20 28" aria-hidden="true"><use class="kf-bean" href="#kf-b" x="-10" y="-14" width="20" height="28" style="opacity:.9"/></svg><span></span></div>
    <p class="kf-row a-rise" style="--d:1s" data-t="turn" data-if="turn" data-fit="17,13,12"></p>
    <p class="kf-row k a-rise" style="--d:1.2s" data-t="kassa" data-if="kassa" data-fit="17,13,12"></p>
    <p class="kf-md a-rise" style="--d:1.5s" data-t="date" data-fit="26,15"></p>
    <p class="kf-wt a-rise" style="--d:1.7s" data-t="wt"></p>
    <p class="kf-ven a-rise" style="--d:1.9s" data-t="venue" data-if="venue" data-fit="15,11"></p>
  </div>
</section>

<section class="sc s3">
  <svg class="kf-top a-pop" style="--d:.1s" viewBox="0 0 76 70" aria-hidden="true">
    <g class="kf-mug"><path class="st" pathLength="1" style="--d:.4s" d="M26 24c-6-6 6-10 0-18"/><path class="st" pathLength="1" style="--d:.8s" d="M40 24c-6-6 6-10 0-18"/>
    <path class="m" d="M12 32h44v14a20 20 0 0 1-20 20h-4a20 20 0 0 1-20-20z"/><path class="h" d="M55 37h4a8 8 0 0 1 0 16h-6"/></g>
  </svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="bokeh" data-n="14" data-colors="var(--crema),var(--gold)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
