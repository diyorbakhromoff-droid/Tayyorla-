<style>
:root { --f-display: 'Alegreya', Georgia, serif; --f-body: 'Rubik', system-ui, sans-serif; }
#tv { background: radial-gradient(120% 70% at 50% 32%, var(--card) 0%, var(--bg) 62%); }
.ms-car { fill: var(--carrot); } .ms-car2 { fill: var(--carrot2); }
.ms-pea { fill: var(--pea); } .ms-pea2 { fill: none; stroke: var(--pea2); stroke-width: 1.6; stroke-linecap: round; }
.ms-rai { fill: var(--raisin); } .ms-rai2 { fill: none; stroke: color-mix(in srgb, var(--raisin) 55%, #FFFFFF); stroke-width: 1.2; stroke-linecap: round; }
.ms-rice { fill: var(--rice); stroke: var(--rice-edge); stroke-width: .8; }
.ms-gar { fill: var(--garlic); stroke: var(--garlic2); stroke-width: 1.4; }
.ms-gar2 { fill: none; stroke: var(--garlic2); stroke-width: 1.3; stroke-linecap: round; }
.ms-f { animation: ms-fall .9s cubic-bezier(.45, 0, .6, 1) calc(var(--s) + var(--d, 0s)) both; }
@keyframes ms-fall {
  0% { transform: translateY(-440px) rotate(-120deg); animation-timing-function: cubic-bezier(.5, 0, .9, .6); }
  68% { transform: translateY(0) rotate(0); animation-timing-function: ease-out; }
  82% { transform: translateY(-9px) rotate(0); animation-timing-function: ease-in; }
  100% { transform: none; } }
.ms-row .ms-f { animation-name: ms-fall-s; animation-duration: .7s; }
@keyframes ms-fall-s { 0% { opacity: 0; transform: translateY(-70px) rotate(-90deg); animation-timing-function: cubic-bezier(.5, 0, .9, .6); }
  30% { opacity: 1; } 70% { transform: translateY(0) rotate(0); animation-timing-function: ease-out; } 85% { transform: translateY(-6px); } 100% { opacity: 1; transform: none; } }
.ms-g { animation-name: ms-fall-g; animation-duration: 1.1s; }
@keyframes ms-fall-g {
  0% { transform: translateY(-440px) scale(.8); animation-timing-function: cubic-bezier(.5, 0, .9, .6); }
  62% { transform: translateY(0) scale(1.12, .86); animation-timing-function: ease-out; }
  80% { transform: translateY(-12px) scale(.96, 1.06); animation-timing-function: ease-in; }
  100% { transform: none; } }
.ms-ros { position: absolute; left: 40px; top: 84px; width: 280px; height: 280px; overflow: visible; }
.ms-spin { animation: ms-spin 50s linear 3.4s infinite both; }
@keyframes ms-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.ms-halo { fill: none; stroke: var(--accent2); stroke-width: 1.4; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .7;
  transform-box: fill-box; transform-origin: center; animation: tv-pop 1s cubic-bezier(.2, 1.3, .4, 1) .1s both; }
.ms-steam { position: absolute; left: 130px; top: 142px; width: 100px; height: 90px; }
.ms-steam .p-steam { background: color-mix(in srgb, var(--rice) 70%, transparent) !important; }
.ms-text { position: absolute; left: 24px; right: 24px; top: 408px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.ms-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.ms-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.2; color: var(--ink); }
.ms-from { margin-top: 10px; max-width: 100%; overflow: hidden; white-space: nowrap; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--accent);
  font-size: 15px; font-weight: 500; color: var(--accent); }
.ms-row { position: absolute; left: 30px; width: 300px; height: 40px; overflow: visible; }
.ms-row.t { top: 92px; } .ms-row.b { top: 508px; }
.ms-card { position: absolute; left: 26px; right: 26px; top: 140px; bottom: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.ms-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 54px; line-height: 1.08; color: var(--accent); }
.ms-reason { width: 100%; max-height: 54px; overflow: hidden; font-size: 17px; line-height: 1.4; color: var(--ink); }
.ms-mid { width: 76px; height: 76px; margin: 4px 0; overflow: visible; }
.ms-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; color: var(--ink); }
.ms-wt { font-size: 15px; color: var(--muted); }
.ms-host { max-width: 100%; overflow: hidden; white-space: nowrap; margin-top: 4px; font-size: 15px; font-weight: 500; color: var(--accent2); }
.ms-edge { position: absolute; left: 30px; width: 300px; height: 40px; opacity: .9; }
.ms-edge.t { top: 4px; } .ms-edge.b { bottom: 4px; }
.s3 .d-day, .s3 .d-month, .s3 .d-venue, .s4 .f-date { font-weight: 700; }
.s4 .f-names { font-weight: 800; line-height: 1.4; color: var(--accent); }
.s3 .tv-details { padding: 52px 30px 50px; }
</style>
