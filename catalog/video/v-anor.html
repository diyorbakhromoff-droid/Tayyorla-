<style>
:root { --f-display: 'Yeseva One', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(110% 60% at 50% 42%, var(--card) 0%, var(--bg) 72%); }
.an-mem { fill: var(--membrane); }
.an-seed { fill: var(--seed); } .an-seed.s { opacity: .55; }
.an-hl { fill: #FFFFFF; opacity: .55; }
.an-line { fill: none; stroke: var(--membrane); stroke-width: 3; opacity: .8; }
.an-peel { fill: var(--peel); } .an-shine { fill: #FFFFFF; opacity: .18; } .an-crown { fill: var(--peel2); } .an-leaf { fill: var(--accent2); }
.an-fruit { position: absolute; left: 70px; top: 196px; width: 220px; height: 220px; animation: an-bounce 1.5s both; }
.an-in { position: absolute; inset: 0; width: 100%; height: 100%; animation: an-in .6s ease 2.3s both; }
.an-half { position: absolute; inset: 0; }
.an-half svg { width: 100%; height: 100%; display: block; }
.an-half.l { clip-path: inset(0 50% 0 0); animation: an-left .9s cubic-bezier(.3, 1.3, .5, 1) 2.3s both; }
.an-half.r { clip-path: inset(0 0 0 50%); animation: an-right .9s cubic-bezier(.3, 1.3, .5, 1) 2.3s both; }
@keyframes an-bounce { 0% { opacity: 0; transform: translateY(-140px); } 55% { opacity: 1; transform: none; } 72% { transform: translateY(-18px); } 86% { transform: none; } 93% { transform: translateY(-5px); } 100% { transform: none; } }
@keyframes an-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes an-left { to { transform: translateX(-54px) rotate(-12deg); } }
@keyframes an-right { to { transform: translateX(54px) rotate(12deg); } }
.an-head { position: absolute; left: 24px; right: 24px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.an-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.an-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 34px; line-height: 1.2; color: var(--accent); }
.an-foot { position: absolute; left: 24px; right: 24px; top: 456px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.an-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 32px; }
.an-from { font-size: 15px; color: var(--muted); }
.an-card { position: absolute; left: 30px; right: 30px; top: 90px; bottom: 90px; border-radius: 26px; background: var(--card); border: 2px solid var(--peel);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--peel) 14%, transparent), 0 24px 40px -26px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 26px 22px; text-align: center; }
.an-ctitle { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 48px; line-height: 1.1; color: var(--accent); }
.an-turn { padding: 7px 16px; border-radius: 999px; background: var(--peel); color: #FFFFFF; font-size: 16px; font-weight: 600; }
.an-kassa { font-size: 16px; font-weight: 600; color: var(--accent2); }
.an-date { margin-top: 10px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 27px; }
.an-wt { font-size: 15px; color: var(--muted); }
.an-host { font-size: 15px; color: var(--muted); }
.s3 .tv-details { padding-top: 60px; }
</style>
