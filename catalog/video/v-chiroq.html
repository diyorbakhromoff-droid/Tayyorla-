<style>
:root { --f-display: 'Philosopher', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(100% 55% at 50% 22%, color-mix(in srgb, var(--flame) 14%, var(--bg)) 0%, var(--bg) 70%); }
.ch-m { fill: var(--metal); } .ch-ms { fill: none; stroke: var(--metal); stroke-width: 2; stroke-linejoin: round; }
.ch-lat { fill: none; stroke: var(--metal); stroke-width: 1.5; } .ch-g { fill: var(--glass); } .ch-gl { fill: url(#ch-fl); }
.ch-f0 { stop-color: #FFF8E2; } .ch-f1 { stop-color: var(--flame); } .ch-f2 { stop-color: color-mix(in srgb, var(--flame) 70%, #6A2400); }

/* chiroq */
.lt { position: absolute; top: 0; margin-left: calc(var(--w) / -2); width: var(--w); z-index: 2;
  animation: ch-drop 1.4s cubic-bezier(.3, 1.35, .5, 1) calc(var(--s) + var(--d)) both; }
@keyframes ch-drop { from { transform: translateY(-300px); } to { transform: none; } }
.lt-sw { transform-origin: 50% 0; animation: ch-sway 3.4s ease-in-out calc(var(--s) - var(--sw)) infinite alternate both; }
@keyframes ch-sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.4deg); } }
.lt-str { display: block; width: 1.5px; height: var(--len); margin: 0 auto; background: var(--metal); }
.lt-body { position: relative; width: var(--w); height: calc(var(--w) * 11 / 6); margin-top: -2px; }
.lt-body svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lt-on { opacity: 0; animation: ch-on .9s ease calc(var(--s) + var(--on)) both; }
@keyframes ch-on { 0% { opacity: 0; } 30% { opacity: .9; } 45% { opacity: .25; } 70% { opacity: 1; } 100% { opacity: 1; } }
.lt-glow { position: absolute; left: 50%; top: 53%; width: calc(var(--w) * 3.4); height: calc(var(--w) * 3.4); margin: calc(var(--w) * -1.7) 0 0 calc(var(--w) * -1.7);
  opacity: 0; animation: tv-fade 1.2s ease calc(var(--s) + var(--on) + .2s) both; }
.lt-glow i { position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--flame) 62%, transparent) 0%, color-mix(in srgb, var(--flame) 20%, transparent) 36%, transparent 68%);
  animation: ch-flick 1.7s ease-in-out infinite alternate both; }
@keyframes ch-flick { from { opacity: .78; transform: scale(.94); } to { opacity: 1; transform: scale(1.05); } }

/* 1. Yo'l */
.ch-head { position: absolute; left: 26px; right: 26px; top: 238px; height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; z-index: 3; }
.ch-inv { font-size: 15px; font-weight: 500; letter-spacing: .04em; color: var(--muted); }
.ch-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-size: 30px; line-height: 1.25; }
.ch-names { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1.2; color: var(--accent); }
.ch-from { font-family: var(--f-display); font-style: italic; font-size: 19px; color: var(--accent2); }
.ch-path { position: absolute; left: 0; right: 0; top: 492px; bottom: 0; clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
  background: linear-gradient(to top, color-mix(in srgb, var(--flame) 26%, transparent), transparent); opacity: 0; animation: tv-fade 1.6s ease 2.4s both; }
.cd { position: absolute; width: 0; height: 0; z-index: 2; }
.cd b, .cd i, .cd::before { position: absolute; display: block; transform: scale(var(--k)); transform-origin: 50% 100%; }
.cd b { left: -4px; bottom: 0; width: 8px; height: 11px; border-radius: 2px; background: var(--wax); }
.cd i { left: -3.5px; bottom: 11px; width: 7px; height: 12px; border-radius: 50% 50% 50% 50% / 64% 64% 36% 36%;
  background: radial-gradient(circle at 50% 70%, #FFFBEA 0 25%, var(--flame) 60%); opacity: 0; animation: ch-cd .5s ease calc(var(--s) + var(--on)) both; }
.cd::before { content: ""; left: -22px; bottom: -8px; width: 44px; height: 44px; border-radius: 50%; transform-origin: 50% 70%;
  background: radial-gradient(circle, color-mix(in srgb, var(--flame) 55%, transparent) 0%, transparent 66%); opacity: 0;
  animation: tv-fade .8s ease calc(var(--s) + var(--on)) both; }
@keyframes ch-cd { 0% { opacity: 0; transform: scale(calc(var(--k) * .2)); } 100% { opacity: 1; transform: scale(var(--k)); } }

/* 2. Ismlar */
.ch-card { position: absolute; left: 30px; right: 30px; top: 150px; bottom: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; z-index: 3; }
.ch-event { font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.ch-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 58px; line-height: 1.1; }
.ch-amp { font-family: var(--f-display); font-style: italic; font-size: 30px; line-height: 1; color: var(--accent); }
.ch-rule { display: flex; align-items: center; gap: 10px; width: 170px; margin: 16px 0 8px; }
.ch-rule span { flex: 1; height: 1px; background: var(--gold); opacity: .8; }
.ch-rule i { width: 8px; height: 13px; border-radius: 50% 50% 50% 50% / 64% 64% 36% 36%; background: radial-gradient(circle at 50% 70%, #FFFBEA 0 25%, var(--flame) 62%);
  box-shadow: 0 0 10px 3px color-mix(in srgb, var(--flame) 45%, transparent); }
.ch-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; }
.ch-wt { font-size: 15px; color: var(--muted); }

/* 3-4 */
.s3 .tv-details { padding-top: 112px; }
.d-sign b { font-weight: 400; }
.sky { position: absolute; bottom: -60px; width: 0; height: 0; z-index: 0; animation: ch-rise 7s linear calc(var(--s) + var(--d)) both; }
.sky i { position: absolute; left: -11px; top: -30px; width: 22px; height: 30px; transform: scale(var(--k)); border-radius: 46% 46% 22% 22% / 58% 58% 18% 18%;
  background: linear-gradient(to top, #FFF3CF, var(--flame) 55%, color-mix(in srgb, var(--flame) 70%, #8A3300));
  box-shadow: 0 0 22px 8px color-mix(in srgb, var(--flame) 35%, transparent); opacity: .8; }
@keyframes ch-rise { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 50% { transform: translate(10px, -380px); } 100% { transform: translate(-6px, -760px); opacity: .6; } }
.s4 .tv-final { z-index: 2; }
</style>
