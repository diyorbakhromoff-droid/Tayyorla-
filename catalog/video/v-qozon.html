<style>
:root { --f-display: 'Yeseva One', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(90% 50% at 50% 62%, color-mix(in srgb, var(--accent2) 26%, var(--bg)) 0%, var(--bg) 70%); }
.qz-glow { fill: var(--accent2); opacity: .35; filter: blur(14px); animation: qz-pulse 1.6s ease-in-out infinite alternate both; transform-origin: 130px 200px; }
@keyframes qz-pulse { from { opacity: .22; } to { opacity: .45; } }
.qz-log { fill: #5A3A22; }
.qz-fire path { transform-box: fill-box; transform-origin: 50% 100%; animation: qz-flick .7s ease-in-out infinite alternate both; }
.qz-f1 { fill: var(--fire2); } .qz-f2 { fill: var(--fire1); animation-duration: .55s !important; } .qz-f2.b { animation-delay: -.3s !important; }
.qz-f3 { fill: #FFE08A; animation-duration: .45s !important; }
@keyframes qz-flick { from { transform: scaleY(.86) scaleX(1.04); } to { transform: scaleY(1.08) scaleX(.95); } }
.qz-body { fill: #1B1B1D; }
.qz-shine { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 6; stroke-linecap: round; }
.qz-handle { fill: none; stroke: #2E2E31; stroke-width: 7; stroke-linecap: round; }
.qz-rim { fill: #2C2C2F; stroke: #48484C; stroke-width: 3; }
.qz-plov { fill: #E0A53A; }
.qz-rice { fill: #FFF3D6; }
.qz-carrot { stroke: #E8762B; stroke-width: 2.4; stroke-linecap: round; }
.qz-pot { position: absolute; left: 30px; top: 196px; width: 300px; height: 288px; overflow: visible; animation: tv-rise 1s cubic-bezier(.2, .8, .2, 1) .2s both; }
.qz-steam { position: absolute; left: 90px; top: 150px; width: 180px; height: 150px; }
.qz-steam .p-steam { background: rgba(255, 255, 255, .5) !important; }
.qz-head { position: absolute; left: 24px; right: 24px; top: 74px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.qz-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.qz-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 34px; line-height: 1.2; }
.qz-from { position: absolute; left: 24px; right: 24px; top: 520px; text-align: center; font-family: var(--f-display); font-size: 22px; color: var(--accent); }
.qz-board { position: absolute; left: 26px; right: 26px; top: 96px; bottom: 96px; border-radius: 22px; padding: 30px 22px;
  background: repeating-linear-gradient(176deg, rgba(0, 0, 0, .05) 0 3px, transparent 3px 18px), linear-gradient(160deg, var(--wood1), var(--wood2));
  box-shadow: 0 22px 40px -20px rgba(0, 0, 0, .6), inset 0 0 0 2px rgba(255, 255, 255, .06);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: var(--wood-ink); }
.qz-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 50px; line-height: 1.1; color: var(--accent); }
.qz-reason { max-height: 56px; overflow: hidden; font-size: 17px; line-height: 1.4; opacity: .9; }
.qz-date { margin-top: 12px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 28px; }
.qz-wt { font-size: 15px; opacity: .8; }
.qz-host { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--accent); }
.s3 .tv-details { padding-top: 64px; }
</style>
<section class="sc s1">
  <div class="qz-head">
    <p class="qz-inv a-rise" style="--d:.1s" data-t="invite"></p>
    <p class="qz-dear a-rise" style="--d:.3s" data-t="dear" data-if="guest" data-fit="34,18"></p>
  </div>
  <div class="ptc qz-steam" data-particles="steam" data-n="10"></div>

  <p class="qz-from a-rise" style="--d:1.2s" data-t="from"></p>
</section>
<section class="sc s2">
  <div class="qz-board a-pop" style="--d:.1s">
    <p class="qz-title a-blur" style="--d:.3s" data-t="title" data-fit="50,24"></p>
    <p class="qz-reason a-rise" style="--d:.7s" data-t="reason" data-if="reason" data-fit="17,13"></p>
    <p class="qz-date a-rise" style="--d:1s" data-t="date" data-fit="28,15"></p>
    <p class="qz-wt a-rise" style="--d:1.2s" data-t="wt"></p>
    <p class="qz-host a-rise" style="--d:1.4s" data-t="from"></p>
  </div>
</section>
<section class="sc s3"><div class="tv-details" data-std="details"></div></section>
<section class="sc s4">
  <div class="ptc" data-particles="dust" data-n="26" data-colors="var(--fire1),var(--gold)"></div>
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="36" data-at="15.2" data-colors="var(--fire1),var(--fire2),var(--gold)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
