<style>
:root { --f-display: 'Philosopher', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(90% 60% at 50% 40%, var(--card) 0%, var(--bg) 75%); }
.gr-grid { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .32; }
.gr-t { fill: none; stroke: var(--gold); stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1; animation: gr-draw 2.4s ease .1s both; }
@keyframes gr-draw { to { stroke-dashoffset: 0; } }
.gr-star { position: absolute; left: 60px; top: 120px; width: 240px; height: 240px; overflow: visible; }
.gr-spin { transform-origin: 120px 120px; animation: gr-turn 40s linear 1s infinite both; }
@keyframes gr-turn { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.gr-big { fill: color-mix(in srgb, var(--accent) 10%, transparent); fill-opacity: 0; stroke: var(--gold); stroke-width: 2.2; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: gr-draw 2s ease-in-out .3s both, gr-fill 1s ease 1.9s both; }
@keyframes gr-fill { to { fill-opacity: 1; } }
.gr-big.b { fill: color-mix(in srgb, var(--accent) 18%, transparent); animation-delay: .7s, 2.2s; }
.gr-big.c { fill: none; stroke-width: 1.2; opacity: .7; animation-delay: 1s, 1s; }
.gr-dot { fill: var(--gold); animation: tv-pop .6s ease 1.8s both; transform-box: fill-box; transform-origin: center; }
.gr-text { position: absolute; left: 24px; right: 24px; top: 392px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.gr-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.gr-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.2; }
.gr-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--gold); }
.gr-arch { position: absolute; left: 32px; right: 32px; top: 70px; bottom: 70px; }
.gr-arch svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gr-arch path { fill: color-mix(in srgb, var(--card) 85%, transparent); stroke: var(--gold); stroke-width: 2; }
.gr-in { position: absolute; left: 24px; right: 24px; top: 110px; bottom: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.gr-ctitle { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1.1; color: var(--gold); }
.gr-turn { font-size: 18px; font-weight: 600; }
.gr-kassa { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); font-size: 15px; font-weight: 600; }
.gr-date { margin-top: 8px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; }
.gr-wt { font-size: 15px; color: var(--muted); }
</style>
