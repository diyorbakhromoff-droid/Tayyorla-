<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(120% 70% at 50% 30%, var(--card) 0%, var(--bg) 70%); }
.nd-edge { position: absolute; left: 0; right: 0; height: 10px; background: repeating-linear-gradient(90deg, var(--pt1) 0 12px, var(--pt2) 12px 24px); opacity: .9; }
.nd-edge.t { top: 0; } .nd-edge.b { bottom: 0; }
.nd-stage { position: absolute; left: 20px; top: 54px; width: 320px; height: 250px; animation: nd-open 1s cubic-bezier(.2, .8, .2, 1) .05s both; transform-origin: 50% 100%; }
@keyframes nd-open { from { opacity: 0; transform: perspective(700px) rotateX(70deg); } to { opacity: 1; transform: none; } }
.nd-board { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 18px 18px rgba(0, 0, 0, .35)); }
.nd-wood { fill: var(--wood); } .nd-wood2 { fill: none; stroke: var(--wood2); stroke-width: 3; }
.nd-felt { fill: var(--felt); } .nd-bar { fill: var(--wood2); }
.nd-pt.a { fill: var(--pt1); } .nd-pt.b { fill: var(--pt2); }
.nd-man { transform-box: fill-box; transform-origin: center; stroke-width: 2; }
.nd-man.m1 { fill: var(--man1); stroke: color-mix(in srgb, var(--man1) 60%, #000); }
.nd-man.m2 { fill: var(--man2); stroke: color-mix(in srgb, var(--man2) 60%, #fff); }
.nd-die { position: absolute; width: 38px; height: 38px; padding: 5px; border-radius: 9px; background: var(--die); box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .12), 0 6px 10px -3px rgba(0, 0, 0, .5);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center; }
.nd-die i { width: 7px; height: 7px; border-radius: 50%; background: var(--pip); }
.nd-die i.r { background: var(--accent2); }
.nd-die.d1 { left: 184px; top: 104px; animation: nd-roll1 1.5s cubic-bezier(.25, .7, .3, 1) 1.6s both; }
.nd-die.d2 { left: 236px; top: 112px; animation: nd-roll2 1.6s cubic-bezier(.25, .7, .3, 1) 1.75s both; }
@keyframes nd-roll1 { 0% { opacity: 0; transform: translate(-200px, 150px) rotate(-540deg) scale(1.2); } 10% { opacity: 1; }
  60% { transform: translate(8px, -6px) rotate(10deg); } 80% { transform: translate(-3px, 2px) rotate(-4deg); } 100% { opacity: 1; transform: rotate(-8deg); } }
@keyframes nd-roll2 { 0% { opacity: 0; transform: translate(-230px, 170px) rotate(-620deg) scale(1.2); } 10% { opacity: 1; }
  60% { transform: translate(10px, 4px) rotate(22deg); } 80% { transform: translate(-2px, -2px) rotate(8deg); } 100% { opacity: 1; transform: rotate(14deg); } }
.nd-text { position: absolute; left: 24px; right: 24px; top: 346px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.nd-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.nd-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.2; }
.nd-from { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 500; font-size: 16px; color: var(--accent); }
/* 2-sahna: katta zar sanani "tashlaydi" */
.nd-card { position: absolute; left: 24px; right: 24px; top: 56px; bottom: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.nd-ctitle { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--accent); }
.nd-big { position: relative; flex: none; width: 150px; height: 150px; border-radius: 30px; background: var(--die); color: var(--pip);
  box-shadow: inset -7px -7px 0 rgba(0, 0, 0, .12), 0 22px 30px -14px rgba(0, 0, 0, .55);
  display: flex; align-items: center; justify-content: center; animation: nd-bigroll 1.4s cubic-bezier(.25, .75, .3, 1) calc(var(--s) + .35s) both; }
@keyframes nd-bigroll { 0% { opacity: 0; transform: translate(-260px, -40px) rotate(-450deg) scale(.6); } 12% { opacity: 1; }
  65% { transform: translate(10px, 0) rotate(8deg); } 82% { transform: translate(-4px, 0) rotate(-3deg); } 100% { opacity: 1; transform: none; } }
.nd-big i { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent2); }
.nd-big i:nth-child(1) { left: 16px; top: 16px; } .nd-big i:nth-child(2) { right: 16px; top: 16px; }
.nd-big i:nth-child(3) { left: 16px; bottom: 16px; } .nd-big i:nth-child(4) { right: 16px; bottom: 16px; }
.nd-day { display: block; max-width: 104px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 62px; line-height: 1; font-variant-numeric: tabular-nums; }
.nd-month { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.15; }
.nd-wt { font-size: 15px; color: var(--muted); }
.nd-turn { width: fit-content; max-width: 100%; overflow: hidden; white-space: nowrap; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--accent); font-family: var(--f-display); font-weight: 500; font-size: 17px; line-height: 1.2; }
.nd-kassa { padding: 8px 18px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); font-size: 16px; font-weight: 700; }
.s3 .tv-details { gap: 14px; }
.s3 .d-msg { font-family: var(--f-body); font-style: normal; font-weight: 500; font-size: 19px; }
.s3 .d-day { font-weight: 800; color: var(--accent); }
.s3 .d-month, .s3 .d-venue, .s4 .f-date { font-weight: 700; }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; font-size: 16px; }
.s4 .f-names { font-weight: 800; }
.s4 .f-date { font-size: 19px; }
</style>
