<style>
:root { --f-display: 'Caveat', cursive; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(110% 70% at 50% 40%, var(--card) 0%, var(--bg) 70%); }
.pl-head { position: absolute; left: 24px; right: 24px; top: 34px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.pl-inv { font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.pl-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 36px; line-height: 1.15; }
.pl-cam { position: absolute; left: 60px; top: 116px; width: 240px; height: 150px; overflow: visible; z-index: 2; animation: tv-rise .9s cubic-bezier(.2, .8, .2, 1) .1s both; }
.pl-body { fill: var(--cam); } .pl-top { fill: var(--cam2); } .pl-dark { fill: #1B1A1C; } .pl-slotc { fill: #0E0D0F; }
.pl-ring { fill: none; stroke: color-mix(in srgb, var(--cam2) 70%, #888); stroke-width: 3; }
.pl-glass { fill: url(#pl-g); } .pl-shine { fill: #FFFFFF; opacity: .55; }
.pl-btn { fill: var(--accent2); } .pl-stripe { fill: var(--accent); }
.pl-fw { fill: #FFFFFF; animation: pl-fw .6s ease-out .75s both; }
@keyframes pl-fw { 0% { fill: #D8D8D8; } 25% { fill: #FFFFFF; filter: drop-shadow(0 0 14px #FFFFFF); } 100% { fill: #D8D8D8; } }
.pl-flash { position: absolute; inset: 0; z-index: 4; background: #FFFFFF; pointer-events: none; animation: pl-flash .7s ease-out .8s both; }
@keyframes pl-flash { 0% { opacity: 0; } 15% { opacity: .85; } 100% { opacity: 0; } }
.pl-win { position: absolute; left: 76px; width: 208px; top: 258px; height: 290px; overflow: hidden; z-index: 1; }
.pl-photo { position: relative; padding: 11px 11px 0; background: var(--paper); box-shadow: 0 10px 18px -10px rgba(0, 0, 0, .55); }
.pl-eject { animation: pl-eject 1.9s cubic-bezier(.3, .55, .3, 1) 1.1s both; }
@keyframes pl-eject { from { transform: translateY(-100%); } to { transform: none; } }
.pl-img { position: relative; overflow: hidden; background: linear-gradient(170deg, var(--ph1) 0%, var(--ph2) 100%); display: flex; align-items: center; justify-content: center; }
.pl-img.b { background: linear-gradient(170deg, var(--ph3) 0%, var(--ph2) 100%); }
.pl-img::before { content: ""; position: absolute; right: 14%; top: 12%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); opacity: .9; }
.pl-img::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -38%; height: 62%; border-radius: 50%; background: rgba(0, 0, 0, .18); }
.pl-dev { position: absolute; inset: 0; z-index: 2; background: #2B2622; animation: pl-dev 2.6s ease-in 2.4s both; }
@keyframes pl-dev { 0% { opacity: 1; } 40% { opacity: .75; background: #5A4E44; } 100% { opacity: 0; background: #8C7C6C; } }
.pl-num { position: relative; z-index: 1; font-family: var(--f-display); font-weight: 700; line-height: 1; color: #FFFFFF; text-shadow: 0 2px 10px rgba(0, 0, 0, .35); white-space: nowrap; }
.pl-cap { display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--paper-ink); font-family: var(--f-display); font-weight: 700; text-align: center; }
.pl-cap p { width: 100%; overflow: hidden; white-space: nowrap; }
.pl-big .pl-img { height: 186px; } .pl-big .pl-num { font-size: 104px; }
.pl-big .pl-cap { height: 64px; } .pl-big .pl-cap p { font-size: 36px; }
.pl-ev { position: absolute; left: 24px; right: 24px; top: 566px; text-align: center; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.pl-str { position: absolute; left: 0; top: 70px; width: 360px; height: 80px; overflow: visible; }
.pl-str path { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.pl-row { position: absolute; left: 0; right: 0; top: 84px; display: flex; justify-content: center; align-items: flex-start; gap: 20px; }
.pl-hang { width: 146px; transform-origin: 50% 0; animation: pl-swing 2.6s ease-in-out infinite alternate both; }
@keyframes pl-swing { from { transform: rotate(calc(var(--tilt) - 2.5deg)); } to { transform: rotate(calc(var(--tilt) + 2.5deg)); } }
.pl-pin { position: absolute; left: 50%; top: -12px; z-index: 3; width: 12px; height: 30px; margin-left: -6px; border-radius: 3px; background: var(--accent2); box-shadow: 0 2px 3px rgba(0, 0, 0, .25); }
.pl-mini { padding: 8px 8px 0; }
.pl-mini .pl-img { height: 128px; } .pl-mini .pl-num { font-size: 76px; }
.pl-mini .pl-cap { height: 40px; } .pl-mini .pl-cap p { font-size: 25px; }
.pl-info { position: absolute; left: 24px; right: 24px; top: 336px; bottom: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.pl-event { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pl-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 60px; line-height: 1.05; color: var(--accent); }
.pl-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.1; }
.pl-wt { font-size: 15px; color: var(--muted); }
.pl-note { position: absolute; left: 22px; right: 22px; top: 40px; bottom: 40px; background: var(--card); transform: rotate(-1.2deg); box-shadow: 0 18px 30px -22px rgba(0, 0, 0, .6);
  animation: tv-fade .8s ease var(--s) both; }
.pl-note::before, .pl-note::after { content: ""; position: absolute; top: -12px; width: 86px; height: 26px; background: color-mix(in srgb, var(--accent2) 45%, transparent); }
.pl-note::before { left: 18px; transform: rotate(-8deg); } .pl-note::after { right: 18px; transform: rotate(7deg); }
.s3 .tv-details { padding: 56px 40px 50px; }
.s3 .d-msg, .s3 .d-sign { font-family: var(--f-body); font-style: normal; }
.s3 .d-msg { font-size: 19px; }
.s3 .d-day { font-weight: 700; font-size: 96px; }
.s3 .d-month, .s3 .d-venue { font-weight: 700; font-size: 30px; }
.s4 .f-photo { border-radius: 2px; border: 8px solid var(--paper); border-bottom-width: 26px; width: 124px; height: 142px; box-shadow: 0 12px 20px -12px rgba(0, 0, 0, .55); }
.s4 .f-names { font-weight: 700; font-size: 52px; color: var(--accent); }
.s4 .f-date { font-weight: 700; font-size: 30px; }
</style>
<section class="sc s1">
  <div class="pl-head">
    <p class="pl-inv a-rise" style="--d:.2s" data-t="invite"></p>
    <p class="pl-dear a-rise" style="--d:.4s" data-t="dear" data-if="guest" data-fit="36,18"></p>
  </div>
  <svg class="pl-cam" viewBox="0 0 240 150" aria-hidden="true">
    <defs><radialGradient id="pl-g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6E7C93"/><stop offset=".55" stop-color="#26303F"/><stop offset="1" stop-color="#0C0F15"/></radialGradient></defs>
    <rect class="pl-body" x="4" y="30" width="232" height="114" rx="18"/>
    <path class="pl-top" d="M22 30V18q0-10 10-10h176q10 0 10 10v12z"/>
    <rect class="pl-fw" x="34" y="13" width="44" height="13" rx="3"/>
    <rect class="pl-dark" x="168" y="13" width="30" height="13" rx="3"/>
    <rect class="pl-stripe" x="4" y="60" width="232" height="8"/>
    <circle class="pl-dark" cx="120" cy="82" r="48"/>
    <circle class="pl-ring" cx="120" cy="82" r="40"/>
    <circle class="pl-glass" cx="120" cy="82" r="31"/>
    <circle class="pl-shine" cx="109" cy="71" r="7"/>
    <circle class="pl-btn" cx="208" cy="48" r="9"/>
    <rect class="pl-slotc" x="14" y="137" width="212" height="7" rx="3"/>
  </svg>
  <div class="pl-win">
    <div class="pl-photo pl-big pl-eject">
      <div class="pl-img"><span class="pl-num" data-t="age_n" data-if="age"></span><span class="pl-dev"></span></div>
      <div class="pl-cap"><p data-t="name" data-fit="36,18"></p></div>
    </div>
  </div>
  <p class="pl-ev a-fade" style="--d:3.2s" data-t="event"></p>
  <div class="pl-flash"></div>
</section>
<section class="sc s2">
  <svg class="pl-str a-fade" style="--d:0s" viewBox="0 0 360 80" aria-hidden="true"><path d="M-10 10 Q180 52 370 10"/></svg>
  <div class="pl-row">
    <div class="pl-hang" style="--tilt:-6deg;margin-top:12px" data-if="age"><div class="pl-photo pl-mini a-drop" style="--d:.2s"><span class="pl-pin"></span>
      <div class="pl-img"><span class="pl-num" data-t="age_n"></span></div>
      <div class="pl-cap"><p data-t="age" data-fit="25,14"></p></div>
    </div></div>
    <div class="pl-hang" style="--tilt:5deg;margin-top:12px;animation-duration:2.9s"><div class="pl-photo pl-mini a-drop" style="--d:.45s"><span class="pl-pin"></span>
      <div class="pl-img b"><span class="pl-num" data-t="day"></span></div>
      <div class="pl-cap"><p data-t="month" data-fit="25,14"></p></div>
    </div></div>
  </div>
  <div class="pl-info">
    <p class="pl-event a-fade" style="--d:.9s" data-t="event"></p>
    <p class="pl-name a-blur" style="--d:1s" data-t="name" data-fit="60,26"></p>
    <p class="pl-date a-rise" style="--d:1.3s" data-t="date" data-fit="34,18"></p>
    <p class="pl-wt a-rise" style="--d:1.5s" data-t="wt"></p>
  </div>
</section>
<section class="sc s3"><div class="pl-note"></div><div class="tv-details" data-std="details"></div></section>
<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="40" data-at="15.2" data-colors="var(--accent),var(--accent2),var(--gold),var(--paper)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
