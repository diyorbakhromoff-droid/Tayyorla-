<style>
:root { --f-display: 'Rubik', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: var(--bg); }
.zv-blob { position: absolute; left: -50px; top: 300px; width: 460px; height: 460px; border-radius: 50%; background: var(--blob); animation: tv-pop 1.2s cubic-bezier(.2, 1.2, .4, 1) 0s both; }
.zv-sunny { position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: var(--blob); opacity: .7; }
.zv-dash { position: absolute; left: 22px; top: 30px; width: 70px; height: 70px; background: radial-gradient(circle, var(--accent) 1.6px, transparent 2px) 0 0 / 14px 14px; opacity: .35; }
.zv-back, .zv-front { position: absolute; left: 10px; top: 420px; width: 340px; height: 240px; overflow: visible; }
.zv-pot { fill: var(--pot); }
.zv-rim { fill: var(--rim); }
.zv-oil { fill: var(--oil); }
.zv-oil2 { fill: none; stroke: var(--oil2); stroke-width: 2; stroke-dasharray: 4 8; stroke-linecap: round; opacity: .7; }
.zv-lip { fill: none; stroke: var(--rim); stroke-width: 9; stroke-linecap: round; }
.zv-hl { fill: none; stroke: #FFFFFF; stroke-opacity: .14; stroke-width: 8; stroke-linecap: round; }
.zv-ear { fill: var(--rim); }
.zv-pile { animation: tv-fade 1.2s ease var(--t, 2s) both; }
.zv-car { fill: var(--carrot); } .zv-car2 { fill: none; stroke: #FFFFFF; stroke-opacity: .35; stroke-width: 1.6; stroke-linecap: round; }
.zv-oni { fill: none; stroke: var(--onion); stroke-width: 5; stroke-linecap: round; } .zv-oni2 { fill: none; stroke: var(--onion2); stroke-width: 3; stroke-linecap: round; }
.zv-chi { fill: var(--chili); } .zv-stem { fill: none; stroke: var(--stem); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.zv-zir { fill: var(--zira); }
.zv-gar { fill: var(--garlic); stroke: color-mix(in srgb, var(--zira) 45%, transparent); stroke-width: 1.4; } .zv-gar2 { fill: none; stroke: var(--zira); stroke-opacity: .35; stroke-width: 1.4; }
.zv-zrk { fill: var(--chili); }
.zv-it { position: absolute; top: 470px; width: 0; height: 0; animation: zv-fall 1.15s linear var(--t) both; }
.zv-it svg { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) scale(1.7); overflow: visible; }
@keyframes zv-fall {
  0% { opacity: 1; transform: translateY(-580px) rotate(var(--r0)); animation-timing-function: cubic-bezier(.5, 0, .95, .7); }
  80% { opacity: 1; transform: translateY(0) rotate(var(--r1)); animation-timing-function: ease-out; }
  100% { opacity: 0; transform: translateY(60px) rotate(var(--r1)); } }
.zv-rip { position: absolute; top: 465px; width: 36px; height: 11px; border-radius: 50%; border: 2px solid var(--oil2); opacity: 0; animation: zv-rip .9s ease-out var(--t) both; }
@keyframes zv-rip { 0% { opacity: 0; transform: scale(.2); } 15% { opacity: 1; } 100% { opacity: 0; transform: scale(2.2); } }
.zv-steam { position: absolute; left: 70px; top: 370px; width: 220px; height: 100px; z-index: 0; }
.zv-steam .p-steam { background: var(--steam) !important; }

/* 1 */
.zv-head { position: absolute; left: 24px; right: 24px; top: 92px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.zv-inv { padding: 6px 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.zv-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.2; color: var(--ink); }
.zv-from { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 500; font-size: 20px; line-height: 1.3; color: var(--accent); }

/* 2 */
.zv-card { position: absolute; left: 26px; right: 26px; top: 60px; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.zv-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 46px; line-height: 1.1; letter-spacing: -.01em; color: var(--accent); }
.zv-reason { width: 100%; max-height: 70px; overflow: hidden; font-size: 17px; line-height: 1.35; color: var(--ink); }
.zv-pill { max-width: 100%; margin-top: 6px; padding: 9px 20px; border-radius: 999px; background: var(--ink); color: var(--bg); overflow: hidden; white-space: nowrap;
  font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.2; }
.zv-wt { font-size: 14px; font-weight: 500; color: var(--muted); }
.zv-host { width: 100%; overflow: hidden; white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--accent2); }
.zv-icons { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }

/* 3-4 */
.zv-flat { background: var(--bg); }
.zv-deco { position: absolute; }
.zv-deco svg { display: block; overflow: visible; }
.s3 .tv-details { padding: 64px 30px 56px; }
.d-day, .f-names { color: var(--accent); font-weight: 700; }
.d-month, .d-venue, .f-date { font-weight: 700; }
.s4 .tv-final { padding-top: 60px; }
</style>
