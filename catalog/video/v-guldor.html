<style>
:root { --f-display: 'Philosopher', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: var(--bg); }
.gd-p1 { fill: var(--rose); } .gd-p2 { fill: var(--rose2); } .gd-p3 { fill: color-mix(in srgb, var(--rose2) 80%, #000); }
.gd-leaf { fill: var(--leaf); } .gd-dot { fill: var(--accent2); }
.gd-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gd-soft { position: absolute; inset: 0; opacity: .16; }
.gd-rose { animation: gd-bloom 1.4s cubic-bezier(.2, 1.2, .4, 1) calc(var(--s, 0s) + var(--d, 0s)) both; }
@keyframes gd-bloom { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.gd-leaves { animation: tv-pop 1s ease calc(var(--s, 0s) + .2s) both; transform-origin: 180px 300px; }
.gd-big { position: absolute; left: 0; top: 150px; width: 360px; height: 300px; overflow: visible; }
.gd-head { position: absolute; left: 24px; right: 24px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.gd-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.gd-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.2; }
.gd-foot { position: absolute; left: 24px; right: 24px; top: 462px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.gd-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 34px; color: var(--accent); }
.gd-from { font-size: 15px; color: var(--muted); }
.gd-frame { position: absolute; left: 18px; right: 18px; top: 40px; bottom: 40px; border-radius: 22px; overflow: hidden; }

.gd-card { position: absolute; left: 34px; right: 34px; top: 60px; bottom: 60px; border-radius: 16px; background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 20px; text-align: center; }
.gd-ctitle { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 46px; line-height: 1.1; color: var(--accent); }
.gd-turn { padding: 7px 16px; border-radius: 999px; background: var(--accent2); color: #FFFFFF; font-size: 16px; font-weight: 600; }
.gd-kassa { font-size: 16px; font-weight: 600; color: var(--accent); }
.gd-date { margin-top: 10px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 27px; }
.gd-wt { font-size: 15px; color: var(--muted); }
.gd-host { font-size: 15px; color: var(--muted); }
.s3 .tv-details { background: color-mix(in srgb, var(--bg) 86%, transparent); }
</style>
