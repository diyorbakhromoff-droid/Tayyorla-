<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Rubik', system-ui, sans-serif; }
#tv { background: var(--bg); }
.rk-disc { position: absolute; left: -60px; top: 150px; width: 480px; height: 480px; border-radius: 50%; background: var(--card); opacity: .9; animation: tv-pop 1.4s cubic-bezier(.2, .9, .3, 1) 0s both; }
.rk-orbit { position: absolute; left: 20px; top: 210px; width: 320px; height: 320px; border-radius: 50%; border: 1px dashed var(--cobalt); opacity: .25; }
.rk-grain { position: absolute; inset: 0; opacity: .5; background: radial-gradient(circle, color-mix(in srgb, var(--cobalt) 18%, transparent) 1px, transparent 1.4px) 0 0 / 18px 18px; }

.rk-pc { fill: var(--cobalt); } .rk-pt { fill: var(--tq); }
.rk-pl { fill: none; stroke: var(--glaze); stroke-width: 2; stroke-linecap: round; opacity: .85; }
.rk-dot { fill: var(--cobalt); } .rk-dot.s { fill: var(--tq); }
.rk-ring { fill: none; stroke: var(--cobalt); stroke-width: 4; } .rk-ring.t { stroke: var(--tq); stroke-width: 1.6; }
.rk-core { fill: var(--cobalt); } .rk-core2 { fill: var(--glaze); }
.rk-spin { animation: rk-spin 26s linear 0s infinite both; }
@keyframes rk-spin { to { transform: rotate(360deg); } }

/* 1: kosa */
.rk-bowl { position: absolute; left: 30px; top: 214px; width: 300px; height: 240px; overflow: visible;
  animation: rk-in 1.5s cubic-bezier(.2, .9, .25, 1) .15s both; transform-origin: 50% 60%; }
@keyframes rk-in { from { opacity: 0; transform: translateY(80px) rotate(-24deg) scale(.6); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
.rk-shadow { fill: #000000; opacity: .14; }
.rk-body { fill: var(--glaze); }
.rk-in { fill: var(--glaze2); }
.rk-rim { fill: none; stroke: var(--cobalt); stroke-width: 6; }
.rk-rim.t { stroke: var(--tq); stroke-width: 1.4; }
.rk-foot { fill: var(--clay); }
.rk-band { fill: none; stroke: var(--cobalt); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: rk-draw 1.4s cubic-bezier(.5, 0, .3, 1) var(--d, .6s) both; }
.rk-band.t { stroke: var(--tq); stroke-width: 1.4; }
.rk-m { fill: var(--cobalt); fill-opacity: 0; stroke: var(--cobalt); stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: rk-draw 1.5s cubic-bezier(.5, 0, .3, 1) .7s both, rk-fill .8s ease 1.9s both; }
.rk-m2 { fill: var(--tq); animation: tv-fade .8s ease 2.2s both; }
.rk-md { fill: var(--cobalt); animation: tv-pop .5s ease 2.1s both; transform-box: fill-box; transform-origin: center; } .rk-md.t { fill: var(--tq); }
@keyframes rk-draw { to { stroke-dashoffset: 0; } }
@keyframes rk-fill { to { fill-opacity: 1; } }
.rk-slide { animation: rk-slide 4.2s linear 2.6s infinite both; }
@keyframes rk-slide { to { transform: translateX(-80px); } }
.rk-shade { fill: url(#rk-sh); }
.rk-glint { fill: #FFFFFF; opacity: .55; }
.rk-head { position: absolute; left: 24px; right: 24px; top: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.rk-inv { font-size: 13px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.rk-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1.15; color: var(--ink); }
.rk-from { position: absolute; left: 24px; right: 24px; top: 498px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 28px; line-height: 1.2; color: var(--accent); }
.rk-dots { position: absolute; left: 0; right: 0; top: 548px; display: flex; justify-content: center; gap: 8px; }
.rk-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--tq); } .rk-dots i:nth-child(2) { background: var(--cobalt); }

/* 2 */
.rk-top { position: absolute; left: 0; top: -150px; width: 360px; height: 300px; overflow: visible; animation: tv-fade 1s ease calc(var(--s)) both; }
.rk-card { position: absolute; left: 26px; right: 26px; top: 184px; bottom: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.rk-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 58px; line-height: 1.05; color: var(--head); }
.rk-reason { width: 100%; max-height: 80px; overflow: hidden; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 22px; line-height: 1.25; color: var(--ink); }
.rk-sep { width: 120px; height: 14px; margin: 6px 0; overflow: visible; }
.rk-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.2; color: var(--ink); }
.rk-wt { font-size: 14px; color: var(--muted); }
.rk-host { width: 100%; overflow: hidden; white-space: nowrap; margin-top: 4px; font-size: 14px; font-weight: 500; letter-spacing: .04em; color: var(--accent); }

/* 3-4 */
.rk-plain { background: var(--bg); }
.rk-corner { position: absolute; width: 220px; height: 220px; overflow: visible; opacity: .9; }
.rk-corner.a { right: -110px; top: -110px; } .rk-corner.b { left: -110px; bottom: -110px; }
.s3 .tv-details { padding: 70px 30px 60px; }
.d-day, .d-venue, .f-names { color: var(--head); }
.d-day, .d-month, .d-venue, .f-names, .f-date { font-weight: 700; }
.s4 .tv-final { padding-top: 70px; }
</style>
