<style>

/* gate */

/* curtain */

  box-shadow: inset -10px 0 14px -8px color-mix(in srgb, var(--fab2) 90%, transparent); }

.sr-swl { fill: none; stroke: var(--fab2); stroke-width: 2; opacity: .55; }

/* opening frame: garland, pillars, gate, flower bed */
.sr-frame { transform-origin: 180px 420px; animation: sr-push 1.7s cubic-bezier(.5, 0, .8, .5) 2.9s both; }

.sr-half { position: absolute; top: 0; width: 180px; height: 640px; perspective: 520px; perspective-origin: 180px 470px; }
.sr-half.l { left: 0; }
.sr-half.r { left: 180px; transform: scaleX(-1); }
.sr-half svg { position: absolute; left: 0; top: 0; width: 180px; height: 640px; overflow: visible; }
.sr-leaf { position: absolute; left: 50px; top: 355px; width: 130px; height: 230px; transform-origin: 0 50%;
  animation: sr-gate 1.4s cubic-bezier(.5, 0, .25, 1) 2.2s both; }
.sr-half .sr-leaf svg { width: 130px; height: 230px; filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--gold2) 50%, transparent)); }
@keyframes sr-gate { to { transform: rotateY(84deg); } }

/* palace exterior: slow drift, then the camera flies to the door */
.sr-worldw { animation: sr-off .5s linear 5.3s both; }
.sr-world { transform-origin: 180px 420px; animation: sr-fly 5.6s linear 0s both; }
@keyframes sr-fly { 0% { transform: scale(1); } 50% { transform: scale(1.1); animation-timing-function: cubic-bezier(.6, 0, .9, .45); } 100% { transform: scale(5.2); } }
@keyframes sr-off { to { opacity: 0; } }
.sr-trees { transform-origin: 180px 330px; animation: sr-tree 5.2s linear 0s both; }

.sr-sky { fill: url(#sr-skyg); }
.sr-sun { fill: url(#sr-sung); }
.sr-cloud ellipse { fill: var(--sky1); opacity: .75; }

.sr-sea { fill: url(#sr-seag); }
.sr-wave { stroke: var(--sky1); stroke-width: .8; opacity: .55; }
.sr-ftr { fill: var(--leaf2); opacity: .7; }
.sr-lawn { fill: url(#sr-lawng); }
.sr-fpath { fill: url(#sr-pathg); }
.sr-step { stroke: var(--stone2); stroke-width: .9; }
.sr-bal { stroke: var(--stone); stroke-width: 9; stroke-dasharray: 1.6 2.2; }
.sr-cyp { fill: url(#sr-cypg); }
.sr-bush { fill: var(--leaf); }
.sr-trunk { fill: none; stroke: var(--leaf); stroke-width: 5; stroke-linecap: round; }
.sr-tbl { fill: var(--leaf); }
.sr-tbl2 { fill: var(--leaf2); }
.sr-tsh { fill: var(--leaf); opacity: .55; filter: blur(3px); }
.sr-tsp { fill: var(--leaf2); opacity: .85; }

/* facade + doors */

@keyframes sr-fac {
  0% { opacity: 0; transform: scale(.78); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  20% { opacity: 1; }
  30% { transform: scale(1); }
  56% { transform: scale(1); animation-timing-function: cubic-bezier(.6, 0, .9, .45); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: scale(4.6); } }
.sr-fwall { fill: url(#sr-stonev); }
.sr-mold { fill: none; stroke: var(--stone2); stroke-width: 4; }
.sr-dent { stroke: var(--gold); stroke-width: 8; stroke-dasharray: 3 4; opacity: .7; }
.sr-flute { fill: none; stroke: var(--stone2); stroke-width: 1.4; opacity: .8; }
.sr-arch { fill: none; stroke: url(#sr-gold); stroke-width: 9; }
.sr-hl2 { fill: none; stroke: var(--gold3); stroke-width: 1.2; }
.sr-vou { stroke: var(--gold); stroke-width: 1.4; }
.sr-scr2 { fill: none; stroke: var(--gold); stroke-width: 3.2; stroke-linecap: round; }
.sr-crestb { fill: none; stroke: url(#sr-gold); stroke-width: 3.4; }
.sr-ctext { fill: var(--gold3); font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 19px; text-anchor: middle; }
.sr-rise { fill: var(--stone2); opacity: .55; }

.sr-dr { left: 180px; transform-origin: 100% 50%; animation: sr-dr 1.25s cubic-bezier(.45, 0, .2, 1) 5.6s both; }

.sr-dl2 { fill: none; stroke: var(--gold2); stroke-width: 1.3; }

.sr-dome { fill: var(--hall1); }
.sr-vault { fill: none; stroke: var(--gold); stroke-width: 1.2; opacity: .75; }
.sr-vault2 { fill: none; stroke: var(--gold); stroke-width: 2; opacity: .6; }
.sr-recess { fill: var(--hall2); opacity: .55; }
.sr-backglow { fill: url(#sr-halo); opacity: .6; }
.sr-fwin { fill: url(#sr-wn); }
.sr-balu { stroke: var(--stone); stroke-width: 30; stroke-dasharray: 2.4 3.4; opacity: .9; }
.sr-floor { fill: url(#sr-floorg); }
.sr-medl { fill: none; stroke: var(--gold); stroke-width: 5; }

.sr-medd { fill: none; stroke: var(--gold); stroke-width: 6; stroke-dasharray: 6 10; opacity: .7; }
.sr-medp { fill: var(--gold); opacity: .32; }
.sr-medf { fill: var(--gold); opacity: .55; }
.sr-refl { fill: url(#sr-halo); opacity: .55; }
.sr-stair { fill: url(#sr-floorg2); }
.sr-sline { stroke: var(--gold2); stroke-width: 1; opacity: .35; }
.sr-sline2 { stroke: var(--fab3); stroke-width: .7; opacity: .7; }
.sr-carpet { fill: url(#sr-halo); opacity: .3; }
.sr-land { fill: var(--floor); }
.sr-bbody { fill: none; stroke: var(--stone2); stroke-width: 12; stroke-dasharray: 1.8 2.6; }
.sr-rail3 { fill: none; stroke: url(#sr-goldu); stroke-width: 4.2; }
.sr-gleaf { fill: none; stroke: var(--leaf2); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 0 9; }

/* veil + arched panel for details / final */

  animation: sr-pan 1s cubic-bezier(.2, .8, .2, 1) 9.85s both; }
@keyframes sr-pan { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }

@keyframes sr-tout { to { opacity: 0; filter: blur(6px); transform: translateY(-8px); } }

  animation: sr-lock .55s ease-in 1.95s both; }

.sr-amp { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 34px; line-height: 1; color: var(--accent2); margin: -2px 0 -4px; }
.sr-date { margin-top: 18px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 25px; color: var(--ink); }
.sr-wt { margin-top: 2px; font-size: 14px; color: var(--muted); }
.sr-orn { width: 120px; height: 14px; margin-top: 12px; overflow: visible; }

/* scenes 3-4 */
.sr-crest3 { position: absolute; left: 150px; top: 46px; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, var(--gold3), var(--gold) 55%, var(--gold2)); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--gold); }

.s3 .tv-details { padding: 112px 46px 52px; gap: 12px; }
.d-day { font-weight: 600; }
.d-msg { font-weight: 500; font-size: 20px; }

.f-names { font-style: italic; color: var(--accent); }
</style>
