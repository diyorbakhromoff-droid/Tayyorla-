<style>
:root { --f-display: 'Alegreya', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: radial-gradient(120% 70% at 50% 62%, var(--card) 0%, var(--bg) 70%); }
.sv-dots { position: absolute; inset: 0; opacity: .5;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 2px, transparent 2.6px) 0 0 / 26px 26px,
              radial-gradient(circle, color-mix(in srgb, var(--rib) 22%, transparent) 2px, transparent 2.6px) 13px 13px / 26px 26px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 34%, transparent 66%, #000 100%); mask-image: linear-gradient(180deg, #000 0%, transparent 34%, transparent 66%, #000 100%); }
.sv-box { fill: var(--box); } .sv-box2 { fill: var(--box2); } .sv-shade { fill: #000; opacity: .12; }
.sv-rib { fill: var(--rib); } .sv-rib2 { fill: var(--rib2); }
.sv-in { fill: color-mix(in srgb, var(--box) 55%, #000); }

/* 1. Sovg'a ochiladi */
.sv-head { position: absolute; left: 24px; right: 24px; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.sv-inv { font-size: 15px; font-weight: 600; letter-spacing: .05em; color: var(--muted); }
.sv-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.2; }
.sv-rays { position: absolute; left: -40px; top: 220px; width: 440px; height: 440px; border-radius: 50%; z-index: 1;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rib) 40%, transparent) 0deg 9deg, transparent 9deg 22.5deg);
  -webkit-mask-image: radial-gradient(circle, #000 18%, transparent 68%); mask-image: radial-gradient(circle, #000 18%, transparent 68%);
  animation: sv-rays-in 1s cubic-bezier(.2, .8, .2, 1) 2.25s both, sv-spin 14s linear 2.25s infinite; }
@keyframes sv-rays-in { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
@keyframes sv-spin { from { rotate: 0deg; } to { rotate: 360deg; } }
.sv-glow { position: absolute; left: 90px; top: 390px; width: 180px; height: 70px; border-radius: 50%; z-index: 2;
  background: radial-gradient(closest-side, #FFFFFF, color-mix(in srgb, var(--rib) 60%, transparent) 50%, transparent);
  animation: sv-glow 1.4s ease-out 2.2s both; }
@keyframes sv-glow { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; } 100% { opacity: .55; transform: scale(1.15); } }
.sv-stage { position: absolute; left: 60px; top: 330px; width: 240px; height: 230px; z-index: 4; animation: tv-drop 1s cubic-bezier(.2, 1.2, .4, 1) .3s both; }
.sv-stage svg { position: absolute; inset: 0; width: 240px; height: 230px; overflow: visible; }
.sv-shake { transform-box: view-box; transform-origin: 120px 210px; animation: sv-shake .5s ease-in-out 1.6s both; }
@keyframes sv-shake { 0%, 100% { transform: none; } 20% { transform: rotate(-4deg); } 45% { transform: rotate(4deg); } 70% { transform: rotate(-2.5deg); } 85% { transform: rotate(1.5deg); } }
.sv-bowl, .sv-bowr { transform-box: view-box; transform-origin: 120px 62px; }
.sv-bowl { animation: sv-untie-l .7s cubic-bezier(.6, 0, .4, 1) 1.15s both; }
.sv-bowr { animation: sv-untie-r .7s cubic-bezier(.6, 0, .4, 1) 1.15s both; }
@keyframes sv-untie-l { to { transform: translate(-70px, 60px) rotate(-120deg) scale(.4); opacity: 0; } }
@keyframes sv-untie-r { to { transform: translate(70px, 60px) rotate(120deg) scale(.4); opacity: 0; } }
.sv-tie-v { transform-box: fill-box; transform-origin: 50% 100%; animation: sv-slide 0.6s cubic-bezier(.6, 0, .4, 1) 1.35s both; }
@keyframes sv-slide { to { transform: scaleY(0); } }
.sv-lid { transform-box: view-box; transform-origin: 120px 78px; animation: sv-fly 1.1s cubic-bezier(.3, .1, .3, 1) 2.1s both; }
@keyframes sv-fly { 0% { transform: none; } 18% { transform: translateY(8px); } 100% { transform: translate(170px, -620px) rotate(70deg); } }
.sv-burst { position: absolute; left: 180px; top: 420px; width: 0; height: 0; z-index: 3; }
.sv-burst i { position: absolute; left: -5px; top: -7px; width: 10px; height: 14px; border-radius: 2px; background: var(--c); opacity: 0;
  animation: sv-pop 2.4s cubic-bezier(.15, .7, .4, 1) calc(2.2s + var(--k, 0s)) both; }
.sv-burst i.o { border-radius: 50%; width: 11px; height: 11px; }
@keyframes sv-pop { 0% { opacity: 0; transform: translate(0, 0) rotate(0) scale(.4); } 8% { opacity: 1; } 55% { opacity: 1; transform: translate(var(--x), var(--y)) rotate(calc(var(--r) * .6)) scale(1); }
  100% { opacity: 0; transform: translate(calc(var(--x) * 1.25), calc(var(--y) + 190px)) rotate(var(--r)) scale(1); } }
.sv-ev { position: absolute; left: 24px; right: 24px; top: 134px; z-index: 5; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sv-rise { position: absolute; left: 20px; right: 20px; top: 160px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  animation: sv-rise 1.3s cubic-bezier(.2, 1.25, .35, 1) 2.45s both; }
@keyframes sv-rise { from { opacity: 0; transform: translateY(230px) scale(.25); } 30% { opacity: 1; } to { opacity: 1; transform: none; } }
.sv-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 64px; line-height: 1.1; color: var(--ink); }
.sv-age { padding: 6px 18px; border-radius: 99px; background: var(--rib); color: var(--rib-ink); font-size: 18px; font-weight: 700; white-space: nowrap; }

/* 2. Yorliq */
.sv-col { position: absolute; left: 26px; right: 26px; top: 0; bottom: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.sv-tagw { margin-bottom: 26px; animation: tv-drop 1s cubic-bezier(.2, 1.2, .4, 1) calc(var(--s) + .15s) both; }
.sv-sw { position: relative; transform-origin: 50% -260px; animation: sv-swing 2.4s ease-in-out calc(var(--s) + .4s) infinite alternate both; }
.sv-sw::before { content: ""; position: absolute; left: 65px; bottom: 100%; width: 2px; height: 600px; margin-bottom: -18px; background: var(--rib); }
.sv-tag { position: relative; width: 132px; height: 160px; padding-top: 34px; border-radius: 0 0 20px 20px; background: var(--card); color: var(--ink);
  box-shadow: inset 0 0 0 3px var(--rib), 0 16px 26px -16px rgba(0, 0, 0, .5);
  clip-path: polygon(24% 0, 76% 0, 100% 18%, 100% 100%, 0 100%, 0 18%); display: flex; flex-direction: column; align-items: center; }
.sv-hole { position: absolute; left: 56px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 3px var(--rib); }
@keyframes sv-swing { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
.sv-tnum { font-family: var(--f-display); font-weight: 800; font-size: 72px; line-height: 1; color: var(--accent); white-space: nowrap; }
.sv-tlab { margin-top: 4px; width: 112px; overflow: hidden; white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--muted); }
.sv-event { font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sv-big { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 58px; line-height: 1.1; }
.sv-bow { width: 64px; height: 30px; overflow: visible; }
.sv-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; color: var(--ink); }
.sv-wt { font-size: 15px; color: var(--muted); }

/* 3-4 */
.sv-card { position: absolute; left: 20px; right: 20px; top: 34px; bottom: 34px; border-radius: 24px; background: var(--card); overflow: hidden;
  box-shadow: 0 20px 40px -26px rgba(0, 0, 0, .6); animation: tv-pop .8s cubic-bezier(.2, 1.3, .4, 1) var(--s) both; }
.sv-card::before { content: ""; position: absolute; left: 0; right: 0; top: 46px; height: 22px; background: var(--rib); }
.sv-card::after { content: ""; position: absolute; top: 0; bottom: 0; right: 40px; width: 22px; background: var(--rib); opacity: .9; }
.sv-cbow { position: absolute; left: 273px; top: 30px; width: 76px; height: 54px; overflow: visible; z-index: 2; animation: tv-pop .7s cubic-bezier(.2, 1.5, .4, 1) calc(var(--s) + .3s) both; }
.s3 .tv-details { padding: 96px 66px 50px 40px; }
.s3 .d-msg { font-size: 20px; font-weight: 700; }
.s3 .d-day { font-weight: 800; }
.s3 .d-month, .s3 .d-venue { font-weight: 700; }
.s4 .tv-final { padding-top: 70px; }
.s4 .f-names { font-weight: 800; font-size: 52px; color: var(--ink); }
.s4 .f-date { font-weight: 700; color: var(--accent); }
.sv-topbow { position: absolute; left: 140px; top: 38px; width: 80px; height: 40px; overflow: visible; animation: tv-pop .7s cubic-bezier(.2, 1.5, .4, 1) calc(var(--s) + .2s) both; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="sv-bowg"><path class="sv-rib" d="M40 24C26 2 4 4 8 18C11 28 28 28 40 24Z"/><path class="sv-rib" d="M40 24C54 2 76 4 72 18C69 28 52 28 40 24Z"/>
    <path class="sv-rib2" d="M36 26L24 46L31 44L34 52L40 28ZM44 26L56 46L49 44L46 52L40 28Z"/><circle class="sv-rib2" cx="40" cy="24" r="7"/></g>
</defs></svg>
<div class="bgk"><div class="sv-dots"></div></div>

<section class="sc s1">
  <div class="sv-head">
    <p class="sv-inv a-rise" style="--d:.15s" data-t="invite"></p>
    <p class="sv-dear a-rise" style="--d:.35s" data-t="dear" data-if="guest" data-fit="32,16"></p>
  </div>
  <div class="sv-rays"></div>
  <span class="sv-glow"></span>
  <div class="sv-burst">
    <i style="--x:-130px;--y:-210px;--r:420deg;--c:var(--accent)"></i><i class="o" style="--x:-90px;--y:-260px;--r:0deg;--c:var(--rib);--k:.05s"></i>
    <i style="--x:-40px;--y:-290px;--r:-380deg;--c:var(--box)"></i><i style="--x:10px;--y:-300px;--r:300deg;--c:var(--accent2);--k:.08s"></i>
    <i class="o" style="--x:60px;--y:-280px;--r:0deg;--c:var(--accent);--k:.03s"></i><i style="--x:110px;--y:-240px;--r:-500deg;--c:var(--rib)"></i>
    <i style="--x:150px;--y:-180px;--r:360deg;--c:var(--accent2);--k:.1s"></i><i class="o" style="--x:-160px;--y:-140px;--r:0deg;--c:var(--box2);--k:.06s"></i>
    <i style="--x:-110px;--y:-120px;--r:-280deg;--c:var(--accent2);--k:.12s"></i><i style="--x:120px;--y:-110px;--r:460deg;--c:var(--box);--k:.04s"></i>
    <i class="o" style="--x:-20px;--y:-220px;--r:0deg;--c:var(--rib);--k:.14s"></i><i style="--x:40px;--y:-200px;--r:-340deg;--c:var(--accent);--k:.16s"></i>
    <i style="--x:-70px;--y:-170px;--r:260deg;--c:var(--rib);--k:.18s"></i><i class="o" style="--x:90px;--y:-170px;--r:0deg;--c:var(--accent2);--k:.2s"></i>
    <i style="--x:-150px;--y:-60px;--r:-420deg;--c:var(--accent);--k:.09s"></i><i style="--x:160px;--y:-70px;--r:380deg;--c:var(--rib);--k:.11s"></i>
  </div>
  <p class="sv-ev a-fade" style="--d:2.9s" data-t="event"></p>
  <div class="sv-rise">
    <p class="sv-name" data-t="name" data-fit="64,26,20"></p>
    <p class="sv-age" data-t="age" data-if="age"></p>
  </div>
  <div class="sv-stage">
    <svg viewBox="0 0 240 230" aria-hidden="true">
      <g class="sv-shake">
        <ellipse class="sv-shade" cx="120" cy="214" rx="100" ry="10"/>
        <rect class="sv-in" x="30" y="84" width="180" height="16" rx="3"/>
        <rect class="sv-box" x="30" y="90" width="180" height="124" rx="8"/>
        <rect class="sv-shade" x="30" y="90" width="180" height="12"/>
        <rect class="sv-rib sv-tie-v" x="108" y="90" width="24" height="124"/>
        <g class="sv-lid">
          <rect class="sv-box2" x="18" y="62" width="204" height="36" rx="8"/>
          <rect class="sv-rib sv-tie-v" x="108" y="62" width="24" height="36"/>
          <g class="sv-bowl"><path class="sv-rib" d="M120 62C104 30 74 30 78 50C81 62 104 66 120 62Z"/><path class="sv-rib2" d="M116 64L100 88L108 86L111 96L120 66Z"/></g>
          <g class="sv-bowr"><path class="sv-rib" d="M120 62C136 30 166 30 162 50C159 62 136 66 120 62Z"/><path class="sv-rib2" d="M124 64L140 88L132 86L129 96L120 66Z"/></g>
          <circle class="sv-rib2 sv-bowl" cx="120" cy="62" r="8"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="ptc" data-particles="confetti" data-n="34" data-at="2.5" data-colors="var(--accent),var(--rib),var(--accent2),var(--box)"></div>
</section>

<section class="sc s2">
  <div class="sv-col">
    <div class="sv-tagw" data-if="age"><div class="sv-sw"><div class="sv-tag"><span class="sv-hole"></span>
      <span class="sv-tnum" data-t="age_n"></span><span class="sv-tlab" data-t="age"></span></div></div></div>
    <p class="sv-event a-fade" style="--d:.6s" data-t="event"></p>
    <p class="sv-big a-blur" style="--d:.75s" data-t="name" data-fit="58,26,20"></p>
    <svg class="sv-bow a-pop" style="--d:1.1s" viewBox="0 0 80 54" aria-hidden="true"><use href="#sv-bowg"/></svg>
    <p class="sv-date a-rise" style="--d:1.3s" data-t="date" data-fit="28,15"></p>
    <p class="sv-wt a-rise" style="--d:1.5s" data-t="wt"></p>
  </div>
  <div class="ptc" data-particles="spark" data-n="14" data-colors="var(--rib),var(--accent)"></div>
</section>

<section class="sc s3">
  <div class="sv-card"></div>
  <svg class="sv-cbow" viewBox="0 0 80 54" aria-hidden="true"><use href="#sv-bowg"/></svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <svg class="sv-topbow" viewBox="0 0 80 54" aria-hidden="true"><use href="#sv-bowg"/></svg>
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="44" data-at="15.2" data-colors="var(--accent),var(--rib),var(--accent2),var(--box)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
