<style>
:root { --f-display: 'Yeseva One', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(100% 60% at 50% 55%, var(--card) 0%, var(--bg) 72%); }
.tt-plate { fill: color-mix(in srgb, var(--ink) 12%, #fff); }
.tt-tier1 { fill: var(--cake1); } .tt-tier2 { fill: var(--cake2); }
.tt-icing { fill: var(--icing); } .tt-icing.b { fill: var(--icing2); }
.tt-candle { fill: #FFFFFF; } .tt-stripe { stroke: var(--accent); stroke-width: 2; }
.tt-flame { fill: #FFC447; transform-box: fill-box; transform-origin: 50% 100%; filter: drop-shadow(0 0 6px #FFB020);
  animation: tt-light .4s ease-out both, tt-flick .35s ease-in-out infinite alternate; }
@keyframes tt-light { from { transform: scale(0); } to { transform: none; } }
@keyframes tt-flick { from { transform: scale(.92, 1.06) rotate(-3deg); } to { transform: scale(1.06, .92) rotate(3deg); } }
.tt-cake { position: absolute; left: 52px; top: 170px; width: 256px; height: 300px; overflow: visible; animation: tv-rise 1s cubic-bezier(.2, .8, .2, 1) .2s both; }
.tt-head { position: absolute; left: 24px; right: 24px; top: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.tt-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.tt-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 32px; line-height: 1.2; }
.tt-ev { position: absolute; left: 24px; right: 24px; top: 486px; text-align: center; font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
.tt-name { position: absolute; left: 24px; right: 24px; top: 508px; text-align: center; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 40px; color: var(--accent); }
.tt-card { position: absolute; left: 30px; right: 30px; top: 80px; bottom: 80px; border-radius: 30px; background: var(--card); border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
.tt-event { font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--accent); }
.tt-cname { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 52px; line-height: 1.1; }
.tt-age { margin-top: 6px; width: 104px; height: 104px; border-radius: 50%; background: var(--accent); color: #FFFFFF; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-display); font-size: 54px; box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 20%, transparent); }
.tt-agel { font-size: 16px; font-weight: 600; color: var(--muted); }
.tt-date { margin-top: 10px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 26px; }
.tt-wt { font-size: 15px; color: var(--muted); }
.s3 .d-msg, .s3 .d-sign { font-style: normal; }
</style>

  <p class="tt-ev a-fade" style="--d:1.8s" data-t="event"></p>
  <p class="tt-name a-pop" style="--d:2s" data-t="name" data-fit="40,18"></p>
</section>
<section class="sc s2">
  <div class="tt-card a-pop" style="--d:.1s">
    <p class="tt-event a-fade" style="--d:.3s" data-t="event"></p>
    <p class="tt-cname a-blur" style="--d:.4s" data-t="name" data-fit="52,22"></p>
    <p class="tt-age a-pop" style="--d:.8s" data-t="age_n" data-if="age"></p>
    <p class="tt-agel a-fade" style="--d:1s" data-t="age" data-if="age"></p>
    <p class="tt-date a-rise" style="--d:1.2s" data-t="date" data-fit="26,15"></p>
    <p class="tt-wt a-rise" style="--d:1.4s" data-t="wt"></p>
  </div>
</section>
<section class="sc s3"><div class="tv-details" data-std="details"></div></section>
<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="46" data-at="15.2" data-colors="var(--s1),var(--s2),var(--s3),var(--gold)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
