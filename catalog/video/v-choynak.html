<style>
:root { --f-display: 'Yeseva One', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: var(--bg); }
.ch-top { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, var(--bg) 10px 14px, var(--cotton) 14px 24px, var(--bg) 24px 28px); }
.ch-pot { fill: var(--pot); } .ch-potfill { fill: var(--pot); } .ch-cotton { fill: var(--cotton); } .ch-gold { fill: var(--gold); }
.ch-handle { fill: none; stroke: var(--pot); stroke-width: 10; stroke-linecap: round; }
.ch-line { fill: none; stroke: var(--gold); stroke-width: 2; }
.ch-lid-rim { fill: none; stroke: var(--gold); stroke-width: 3; }
.ch-lid { fill: var(--pot); stroke: var(--gold); stroke-width: 2; }
.ch-tea { fill: var(--tea); }
.ch-goldline { stroke: var(--gold); stroke-width: 3; stroke-linecap: round; }
.ch-stage { position: absolute; left: 30px; top: 74px; width: 300px; height: 290px; }
.ch-teapot { position: absolute; left: 130px; top: 20px; width: 160px; height: 136px; transform-origin: 80px 68px; animation: ch-in .8s both, ch-tilt 1.4s ease-in-out .8s both; }
.ch-teapot svg, .ch-cup svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes ch-in { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
@keyframes ch-tilt { 0%, 30% { transform: rotate(0); } 100% { transform: rotate(-24deg); } }
.ch-pour { position: absolute; left: 134px; top: 96px; width: 5px; height: 132px; border-radius: 4px; background: var(--tea); transform-origin: 50% 0; animation: ch-pour .5s ease-in 2.1s both; }
@keyframes ch-pour { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.ch-cup { position: absolute; left: 62px; top: 220px; width: 92px; height: 50px; }
.ch-steam { position: absolute; left: 70px; top: 150px; width: 70px; height: 80px; }
.ch-steam .p-steam { background: rgba(255, 255, 255, .45) !important; }
.ch-text { position: absolute; left: 24px; right: 24px; top: 404px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.ch-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.ch-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 34px; line-height: 1.2; }
.ch-from { font-size: 15px; color: var(--gold); font-weight: 600; }
.ch-card { position: absolute; left: 26px; right: 26px; top: 80px; bottom: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.ch-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 44px; line-height: 1.1; color: var(--gold); }
.ch-turn { margin-top: 8px; padding: 16px 22px; border-radius: 20px; border: 1.5px solid color-mix(in srgb, var(--gold) 60%, transparent); font-family: var(--f-display); font-size: 28px; line-height: 1.15; }
.ch-kassa { padding: 10px 18px; border-radius: 999px; background: var(--cotton); color: #FFFFFF; font-size: 17px; font-weight: 600; }
.ch-date { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 26px; }
.ch-wt { font-size: 15px; color: var(--muted); }
.s3 .tv-details { padding-top: 54px; }
</style>
<div class="bgk"><div class="ch-top"></div></div>
<section class="sc s1">
  <div class="ch-stage">
    <div class="ch-teapot"><svg viewBox="0 0 200 170" aria-hidden="true"><path class="ch-pot" d="M46 96C30 92 22 74 12 60l8-4c10 12 18 24 32 28z"/><path class="ch-handle" d="M156 78c30-2 32 46-4 46"/><ellipse class="ch-pot" cx="100" cy="100" rx="58" ry="48"/><ellipse class="ch-gold" cx="100" cy="146" rx="34" ry="6"/><g class="ch-cotton"><circle cx="78" cy="98" r="7"/><circle cx="69" cy="98" r="5"/><circle cx="87" cy="98" r="5"/><circle cx="78" cy="89" r="5"/><circle cx="78" cy="107" r="5"/><circle cx="122" cy="98" r="7"/><circle cx="113" cy="98" r="5"/><circle cx="131" cy="98" r="5"/><circle cx="122" cy="89" r="5"/><circle cx="122" cy="107" r="5"/><circle cx="100" cy="124" r="6"/><circle cx="92" cy="124" r="4"/><circle cx="108" cy="124" r="4"/><circle cx="100" cy="116" r="4"/><circle cx="100" cy="132" r="4"/></g><g class="ch-potfill"><circle cx="78" cy="98" r="2.2"/><circle cx="122" cy="98" r="2.2"/><circle cx="100" cy="124" r="2"/></g><path class="ch-line" d="M88 76c4 6 8 8 12 8M112 76c-4 6-8 8-12 8"/><ellipse class="ch-lid-rim" cx="100" cy="58" rx="34" ry="6"/><path class="ch-lid" d="M72 58c2-18 54-18 56 0z"/><circle class="ch-gold" cx="100" cy="36" r="6"/></svg></div>
    <span class="ch-pour"></span>
    <div class="ptc ch-steam" data-particles="steam" data-n="6" data-at="2.8"></div>
    <div class="ch-cup"><svg viewBox="0 0 92 50" aria-hidden="true"><path class="ch-pot" d="M2 4h88c-2 26-20 42-44 42S4 30 2 4z"/><ellipse class="ch-tea" cx="46" cy="4" rx="44" ry="4"/><g class="ch-cotton"><circle cx="46" cy="24" r="6"/><circle cx="38" cy="24" r="4"/><circle cx="54" cy="24" r="4"/><circle cx="46" cy="16" r="4"/><circle cx="46" cy="32" r="4"/></g><path class="ch-goldline" d="M24 46h44"/></svg></div>
  </div>
  <div class="ch-text">
    <p class="ch-inv a-rise" style="--d:.6s" data-t="invite"></p>
    <p class="ch-dear a-rise" style="--d:.8s" data-t="dear" data-if="guest" data-fit="34,18"></p>
    <p class="ch-from a-rise" style="--d:1.1s" data-t="from"></p>
  </div>
</section>
<section class="sc s2">
  <div class="ch-card">
    <p class="ch-title a-rise" style="--d:.1s" data-t="title" data-fit="44,20"></p>
    <p class="ch-turn a-pop" style="--d:.6s" data-t="turn" data-if="turn" data-fit="28,16"></p>
    <p class="ch-kassa a-rise" style="--d:.9s" data-t="kassa" data-if="kassa"></p>
    <p class="ch-date a-rise" style="--d:1.1s" data-t="date" data-fit="26,15"></p>
    <p class="ch-wt a-rise" style="--d:1.3s" data-t="wt"></p>
  </div>
</section>
<section class="sc s3"><div class="tv-details" data-std="details"></div></section>
<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="38" data-at="15.2" data-colors="var(--gold),var(--cotton),var(--pot)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
