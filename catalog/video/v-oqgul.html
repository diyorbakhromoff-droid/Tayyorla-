<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(120% 70% at 50% 45%, var(--card) 0%, var(--bg) 75%); }
.og-l { fill: none; stroke: var(--line); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: og-draw 1.6s ease-in-out calc(var(--s) + var(--d, 0s)) both; }
@keyframes og-draw { to { stroke-dashoffset: 0; } }
.og-blush { fill: var(--accent); opacity: 0; animation: og-blush 1.4s ease calc(var(--s) + var(--d, 0s)) both; }
@keyframes og-blush { to { opacity: .16; } }
.og-dot { fill: var(--line); opacity: 0; animation: tv-fade .6s ease calc(var(--s) + var(--d, 0s)) both; }
.og-br { position: absolute; width: 170px; height: 255px; overflow: visible; }
.og-br.a { left: -26px; top: -40px; transform: rotate(168deg); }
.og-br.b { right: -30px; bottom: -36px; transform: rotate(-14deg); }
.og-br.c { left: 136px; top: -34px; width: 88px; height: 132px; transform: rotate(180deg); }
.og-br.d { right: -24px; top: 330px; width: 110px; height: 165px; transform: rotate(-38deg); opacity: .8; }

/* 1 */
.og-center { position: absolute; left: 34px; right: 34px; top: 170px; bottom: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.og-inv { font-size: 15px; font-weight: 500; letter-spacing: .04em; color: var(--muted); }
.og-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 34px; line-height: 1.2; }
.og-names { margin-top: 16px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 40px; color: var(--accent); }
.og-from { margin-top: 6px; font-size: 15px; color: var(--muted); }

/* 2 */
.og-card { position: absolute; left: 34px; right: 34px; top: 70px; bottom: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.og-rings { width: 96px; height: 66px; margin-bottom: 10px; }
.og-rings .og-l { stroke-width: 2; }
.og-event { font-size: 13px; font-weight: 600; letter-spacing: .18em; color: var(--accent); }
.og-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 64px; line-height: 1.02; }
.og-amp { font-family: var(--f-display); font-style: italic; font-size: 30px; color: var(--accent); line-height: 1; }
.og-date { margin-top: 18px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 27px; }
.og-wt { font-size: 15px; color: var(--muted); }

.s3 .tv-details { padding-top: 104px; }
</style>
