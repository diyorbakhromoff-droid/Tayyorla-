<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(95% 55% at 50% 34%, color-mix(in srgb, var(--gold) 20%, var(--bg)) 0%, var(--bg) 72%); }
.pd-folds { background:
  linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 30%, rgba(255,255,255,.06) 55%, rgba(0,0,0,.22)),
  repeating-linear-gradient(90deg, var(--curtain) 0 16px, var(--curtain2) 16px 21px, var(--curtain) 21px 34px, color-mix(in srgb, var(--curtain) 70%, #fff) 34px 36px); }
.pd-val { position: absolute; left: 0; right: 0; top: 0; height: 60px; z-index: 5;
  -webkit-mask: linear-gradient(#000, #000) top / 100% 40px no-repeat, radial-gradient(circle at 18px 40px, #000 17.5px, transparent 18.5px) 0 0 / 36px 60px repeat-x;
          mask: linear-gradient(#000, #000) top / 100% 40px no-repeat, radial-gradient(circle at 18px 40px, #000 17.5px, transparent 18.5px) 0 0 / 36px 60px repeat-x; }
.pd-fringe { position: absolute; left: 0; right: 0; top: 36px; height: 3px; z-index: 6; background: var(--gold); opacity: .9; }
.pd-side { position: absolute; top: 0; bottom: 0; width: 30px; }
.pd-side.l { left: 0; border-radius: 0 0 30px 0; }
.pd-side.r { right: 0; border-radius: 0 0 0 30px; }
.pd-tie { position: absolute; top: 300px; width: 40px; height: 10px; border-radius: 6px; background: var(--gold); }
.pd-tie.l { left: 4px; } .pd-tie.r { right: 4px; }

/* 1. Parda ochiladi */
.pd-cur { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 6; }
.pd-cur.l { left: 0; transform-origin: 0 50%; animation: pd-open-l 1.7s cubic-bezier(.55, 0, .25, 1) 1.1s both; }
.pd-cur.r { right: 0; transform-origin: 100% 50%; animation: pd-open-r 1.7s cubic-bezier(.55, 0, .25, 1) 1.1s both; }
@keyframes pd-open-l { from { transform: none; } to { transform: scaleX(.12); } }
@keyframes pd-open-r { from { transform: none; } to { transform: scaleX(.12); } }
.pd-curtext { position: absolute; left: 0; right: 0; top: 268px; z-index: 7; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 600;
  font-size: 34px; color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,.35); animation: pd-hide .5s ease 1s both; }
@keyframes pd-hide { from { opacity: 1; } to { opacity: 0; } }
.pd-arch { position: absolute; left: 50px; top: 116px; width: 260px; height: 330px; border: 1.5px solid var(--gold); border-radius: 130px 130px 14px 14px;
  background: color-mix(in srgb, var(--card) 70%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 40px 18px 24px; text-align: center; }
.pd-arch::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--gold); border-radius: 124px 124px 9px 9px; opacity: .45; }
.pd-inv { font-size: 15px; font-weight: 500; color: var(--muted); }
.pd-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 32px; line-height: 1.15; }
.pd-rings { width: 74px; height: 52px; }
.pd-rings circle { fill: none; stroke: var(--gold); stroke-width: 2.4; }
.pd-rings path { fill: color-mix(in srgb, var(--gold) 45%, #fff); stroke: var(--gold); stroke-width: 1; }
.pd-names { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 30px; color: var(--accent); }
.pd-from { position: absolute; left: 30px; right: 30px; top: 474px; text-align: center; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 23px; color: var(--accent2); }

/* 2. Kartochka */
.pd-card { position: absolute; left: 40px; right: 40px; top: 92px; bottom: 50px; border: 1.5px solid var(--gold); border-radius: 140px 140px 16px 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 50px 18px 26px; text-align: center;
  background: color-mix(in srgb, var(--card) 55%, transparent); }
.pd-card::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--gold); border-radius: 134px 134px 11px 11px; opacity: .45; }
.pd-event { margin-bottom: 8px; font-size: 13px; font-weight: 600; letter-spacing: .16em; color: var(--gold); }
.pd-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 62px; line-height: 1.04; }
.pd-amp { font-family: var(--f-display); font-style: italic; font-size: 32px; color: var(--gold); line-height: 1; }
.pd-rule { display: flex; align-items: center; gap: 10px; width: 160px; margin: 16px 0 8px; }
.pd-rule span { flex: 1; height: 1px; background: var(--gold); }
.pd-rule i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); }
.pd-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 27px; }
.pd-wt { font-size: 15px; color: var(--muted); }

.s3 .tv-details { padding-top: 76px; padding-left: 44px; padding-right: 44px; }
.s4 .tv-final { padding-top: 70px; }
</style>
<div class="bgk">
  <div class="ptc" data-particles="star" data-n="44" data-colors="var(--gold),#FFFFFF"></div>
  <div class="pd-side l pd-folds"></div><div class="pd-side r pd-folds"></div>
  <span class="pd-tie l"></span><span class="pd-tie r"></span>
</div>
<div class="pd-val pd-folds"></div><div class="pd-fringe"></div>

<section class="sc s1">
  <div class="pd-arch a-pop" style="--d:1.5s">
    <p class="pd-inv" data-t="invite"></p>
    <p class="pd-dear" data-t="dear" data-if="guest" data-fit="32,16"></p>
    <svg class="pd-rings" viewBox="0 0 120 84" aria-hidden="true"><circle cx="47" cy="50" r="24"/><circle cx="73" cy="50" r="24"/><path d="M73 14l7 7-7 8-7-8z"/></svg>
    <p class="pd-names" data-t="names_line" data-fit="30,15"></p>
  </div>
  <p class="pd-from a-rise" style="--d:2.2s" data-t="from"></p>
  <div class="pd-cur l pd-folds"></div><div class="pd-cur r pd-folds"></div>
  <p class="pd-curtext" data-t="invite"></p>
</section>

<section class="sc s2">
  <div class="pd-card a-fade">
    <p class="pd-event a-fade" style="--d:.2s" data-t="event"></p>
    <p class="pd-name a-blur" style="--d:.3s" data-t="name1" data-fit="62,28"></p>
    <p class="pd-amp a-fade" style="--d:.9s">&amp;</p>
    <p class="pd-name a-blur" style="--d:.7s" data-t="name2" data-fit="62,28"></p>
    <div class="pd-rule a-fade" style="--d:1.2s"><span></span><i></i><span></span></div>
    <p class="pd-date a-rise" style="--d:1.3s" data-t="date" data-fit="27,15"></p>
    <p class="pd-wt a-rise" style="--d:1.5s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3"><div class="tv-details" data-std="details"></div></section>

<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="44" data-at="15.2" data-colors="var(--gold),#FFFFFF,var(--curtain)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
