<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(110% 65% at 50% 40%, var(--card) 0%, var(--bg) 72%); font-variant-numeric: lining-nums; }
.gl-gold { background: linear-gradient(100deg, var(--gold2) 0%, var(--gold) 28%, var(--gold3) 46%, var(--gold) 60%, var(--gold2) 100%) 0 0 / 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: gl-shine 4s ease-in-out calc(var(--s) + 1.6s) infinite both; }
@keyframes gl-shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
.gl-l { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: gl-draw 1.2s cubic-bezier(.5, 0, .3, 1) calc(var(--s) + var(--d, 0s)) forwards; }
.gl-l.t { stroke-width: 1.1; }
.gl-l.bw { stroke: var(--gold); stroke-width: 1.8; }
@keyframes gl-draw { to { stroke-dashoffset: 0; } }
.gl-f { opacity: .92; } .gl-f.f1 { fill: var(--fl1); } .gl-f.f2 { fill: var(--fl2); } .gl-f.f3 { fill: var(--fl3); } .gl-f.lf { fill: var(--leaf); }
.gl-f.wr { fill: var(--wrap); } .gl-f.wr2 { fill: var(--wrap2); } .gl-f.rb { fill: var(--gold); }
.gl-fill { clip-path: circle(0% at 50% 45%); animation: gl-paint 1.6s cubic-bezier(.4, 0, .2, 1) calc(var(--s) + var(--pd, 2s)) forwards; }
@keyframes gl-paint { to { clip-path: circle(75% at 50% 45%); } }

/* 1. Guldasta */
.gl-head { position: absolute; left: 24px; right: 24px; top: 40px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.gl-inv { font-size: 13px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.gl-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 32px; line-height: 1.2; }
.gl-ghost { position: absolute; left: 0; right: 0; top: 96px; z-index: 0; text-align: center; font-family: var(--f-display); font-weight: 600; font-size: 300px; line-height: 1;
  color: transparent; -webkit-text-stroke: 1.2px var(--gold); opacity: 0; white-space: nowrap; animation: gl-ghost 1.6s ease calc(var(--s) + 2.6s) both; }
@keyframes gl-ghost { from { opacity: 0; transform: scale(.94); } to { opacity: .7; transform: none; } }
.gl-bq { position: absolute; left: 40px; top: 104px; width: 280px; height: 350px; z-index: 1; overflow: visible; }
.gl-name { position: absolute; left: 22px; right: 22px; top: 456px; z-index: 3; max-height: 92px; overflow: hidden; white-space: nowrap; text-align: center;
  font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 54px; line-height: 1.1; }
.gl-div { position: absolute; left: 130px; top: 554px; width: 100px; display: flex; align-items: center; gap: 8px; }
.gl-div span { flex: 1; height: 1px; background: var(--gold); }
.gl-div i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); }
.gl-ev { position: absolute; left: 24px; right: 24px; top: 572px; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); }

/* 2. Oltin raqam */
.gl-col { position: absolute; left: 26px; right: 26px; top: 40px; bottom: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.gl-sprig { width: 120px; height: 44px; overflow: visible; }
.gl-age { font-family: var(--f-display); font-weight: 600; font-size: 168px; line-height: .9; white-space: nowrap; padding: 0 10px; }
.gl-agel { margin-top: -4px; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 24px; color: var(--muted); }
.gl-event { margin-top: 14px; font-size: 13px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); }
.gl-big { width: 100%; max-height: 130px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 50px; line-height: 1.1; }
.gl-date { margin-top: 8px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 26px; color: var(--accent); }
.gl-wt { font-size: 14px; letter-spacing: .04em; color: var(--muted); }

/* 3-4 */
.gl-frame { position: absolute; inset: 18px; border: 1px solid color-mix(in srgb, var(--gold) 70%, transparent); animation: tv-fade 1s ease var(--s) both; }
.gl-frame::after { content: ""; position: absolute; inset: 5px; border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.gl-corner { position: absolute; width: 96px; height: 70px; overflow: visible; }
.gl-corner.a { left: 8px; top: 8px; } .gl-corner.b { right: 8px; bottom: 8px; transform: rotate(180deg); }
.s3 .tv-details { padding: 70px 44px 60px; }
.s3 .d-day { font-weight: 600; font-size: 92px; }
.s3 .d-month, .s3 .d-venue { font-weight: 600; font-size: 26px; }
.s3 .d-msg { font-weight: 500; font-size: 23px; }
.s4 .tv-final { padding-top: 130px; }
.s4 .f-names { font-style: italic; font-size: 50px; }
.s4 .f-date { color: var(--accent); font-size: 23px; }
.gl-top { position: absolute; left: 120px; top: 50px; width: 120px; height: 150px; overflow: visible; }
</style>
