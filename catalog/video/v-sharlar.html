<style>
:root { --f-display: 'Comfortaa', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%); }
.sh-rise { position: absolute; animation: sh-rise 2.4s cubic-bezier(.2, .7, .3, 1) both; }
.sh-bob { animation: sh-bob 2.8s ease-in-out infinite alternate both; }
@keyframes sh-rise { from { transform: translateY(620px); } to { transform: none; } }
@keyframes sh-bob { from { transform: translateY(-6px) rotate(-2deg); } to { transform: translateY(6px) rotate(2deg); } }
.sh-str { fill: none; stroke: color-mix(in srgb, var(--ink) 35%, transparent); stroke-width: 1.4; }
.sh-hl { fill: #FFFFFF; opacity: .35; }
.sh-low { position: absolute; left: 24px; right: 24px; top: 430px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.sh-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.sh-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; }
.sh-ev { margin-top: 4px; font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--accent2); }
.sh-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 38px; color: var(--accent); }
.sh-card { position: absolute; left: 24px; right: 24px; top: 70px; bottom: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.sh-age { font-family: var(--f-display); font-weight: 700; font-size: 150px; line-height: .9; background: linear-gradient(160deg, #FFF3C4 0%, var(--gold) 45%, #B8862B 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .18)); }
.sh-agel { margin-top: -4px; font-size: 18px; font-weight: 600; color: var(--muted); }
.sh-event { margin-top: 10px; font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--accent); }
.sh-cname { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 46px; line-height: 1.15; }
.sh-date { margin-top: 10px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 24px; }
.sh-wt { font-size: 15px; color: var(--muted); }
.s3 .d-msg, .s3 .d-sign { font-family: var(--f-body); font-style: normal; }
.s3 .d-msg { font-size: 19px; }
</style>

  <div class="sh-low">
    <p class="sh-inv a-rise" style="--d:1.2s" data-t="invite"></p>
    <p class="sh-dear a-rise" style="--d:1.4s" data-t="dear" data-if="guest" data-fit="28,15"></p>
    <p class="sh-ev a-fade" style="--d:1.6s" data-t="event"></p>
    <p class="sh-name a-pop" style="--d:1.8s" data-t="name" data-fit="38,18"></p>
  </div>
</section>
<section class="sc s2">
  <div class="sh-card">
    <p class="sh-age a-pop" style="--d:.2s" data-t="age_n" data-if="age"></p>
    <p class="sh-agel a-fade" style="--d:.6s" data-t="age" data-if="age"></p>
    <p class="sh-event a-fade" style="--d:.7s" data-t="event"></p>
    <p class="sh-cname a-blur" style="--d:.8s" data-t="name" data-fit="46,20"></p>
    <p class="sh-date a-rise" style="--d:1.2s" data-t="date" data-fit="24,14"></p>
    <p class="sh-wt a-rise" style="--d:1.4s" data-t="wt"></p>
  </div>
</section>
<section class="sc s3"><div class="tv-details" data-std="details"></div></section>
<section class="sc s4">
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="48" data-at="15.2" data-colors="var(--b1),var(--b2),var(--b3),var(--b4),var(--b5)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
