<style>
:root { --f-display: 'Philosopher', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(120% 70% at 50% 100%, var(--card) 0%, var(--bg) 70%); }

/* umumiy iliq nur */
.sd-amb { position: absolute; left: -80px; right: -80px; bottom: -160px; height: 560px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--flame) 34%, transparent) 0%, color-mix(in srgb, var(--flame) 10%, transparent) 55%, transparent 100%);
  opacity: 0; animation: tv-fade 3s ease .8s both; }
.sd-bk .p-bokeh { opacity: .3; filter: blur(6px); mix-blend-mode: screen; }
.s4 .ptc { z-index: 0; }

/* shamlar */
.sd-row { position: absolute; inset: 0; animation: sd-sink 1.5s cubic-bezier(.6, 0, .3, 1) 9.3s both; }
@keyframes sd-sink { from { transform: none; } to { transform: translateY(178px); } }
.sd-c { position: absolute; left: var(--x); bottom: -12px; width: var(--w); height: var(--h); margin-left: calc(var(--w) / -2); }
.sd-wax { position: absolute; inset: 0; border-radius: 7px 7px 2px 2px / 6px 6px 2px 2px;
  background: linear-gradient(90deg, var(--wax2) 0%, var(--wax) 32%, var(--wax) 56%, color-mix(in srgb, var(--wax2) 80%, #000) 100%);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--wax2) 50%, transparent); }
.sd-wax::before { content: ""; position: absolute; left: 3px; right: 3px; top: 2px; height: 8px; border-radius: 50%;
  background: radial-gradient(ellipse, color-mix(in srgb, var(--wax2) 70%, var(--flame)) 0%, var(--wax2) 70%); }
.sd-wax::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(180deg, color-mix(in srgb, var(--flame) 55%, transparent) 0%, transparent 45%); mix-blend-mode: soft-light;
  opacity: 0; animation: tv-fade 1s ease calc(var(--on) + .2s) both; }
.sd-drip { position: absolute; top: 4px; width: 5px; border-radius: 0 0 4px 4px; background: var(--wax); box-shadow: inset -1px 0 0 var(--wax2); }
.sd-wick { position: absolute; left: 50%; top: -8px; width: 2px; height: 11px; margin-left: -1px; border-radius: 1px; background: #3A2A20; }
.sd-halo { position: absolute; left: 50%; top: -26px; width: 210px; height: 210px; margin: -105px 0 0 -105px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--flame) 50%, transparent) 0%, color-mix(in srgb, var(--flame) 16%, transparent) 30%, transparent 64%);
  opacity: 0; animation: sd-halo 1.2s ease var(--on) both; }
.sd-halo i { position: absolute; inset: 0; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--flame) 40%, transparent); transform: scale(.25); opacity: 0;
  animation: sd-ring 1.6s ease-out calc(var(--on) + .1s) both; }
@keyframes sd-halo { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes sd-ring { 0% { opacity: .9; transform: scale(.25); } 100% { opacity: 0; transform: scale(1); } }
.sd-pulse { position: absolute; inset: 0; animation: sd-pulse var(--fl) ease-in-out infinite alternate both; }
@keyframes sd-pulse { from { opacity: .75; transform: scale(.94); } to { opacity: 1; transform: scale(1.05); } }
.sd-fl { position: absolute; left: 50%; top: -42px; width: 16px; height: 36px; margin-left: -8px; transform-origin: 50% 95%;
  animation: sd-ign .6s cubic-bezier(.2, 1.4, .4, 1) var(--on) both; }
@keyframes sd-ign { 0% { opacity: 0; transform: scale(.1); } 100% { opacity: 1; transform: none; } }
.sd-fl i { position: absolute; inset: 0; transform-origin: 50% 95%; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(ellipse 50% 60% at 50% 72%, #FFFFFF 0%, #FFF3C8 22%, #FFD27A 42%, var(--flame) 66%, transparent 74%);
  box-shadow: 0 0 14px 4px color-mix(in srgb, var(--flame) 45%, transparent);
  animation: sd-flick var(--fl) ease-in-out infinite alternate both; }
@keyframes sd-flick { 0% { transform: scale(1, 1) skewX(0); } 30% { transform: scale(.94, 1.08) skewX(3deg); } 60% { transform: scale(1.04, .94) skewX(-2deg); }
  100% { transform: scale(.97, 1.04) skewX(1.5deg); } }

/* 1. Shamlar */
.sd-head { position: absolute; left: 26px; right: 26px; top: 70px; height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; z-index: 3; }
.sd-inv { font-size: 14px; font-weight: 500; letter-spacing: .08em; color: var(--muted); }
.sd-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-size: 28px; line-height: 1.3; }
.sd-names { margin-top: 14px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1.2; color: var(--accent);
  text-shadow: 0 0 24px color-mix(in srgb, var(--flame) 40%, transparent); }
.sd-from { font-family: var(--f-display); font-style: italic; font-size: 19px; color: var(--accent2); }
.sd-orn { width: 120px; height: 14px; overflow: visible; margin: 4px 0; }
.sd-orn path { fill: none; stroke: var(--gold); stroke-width: 1; }
.sd-orn circle { fill: var(--gold); }

/* 2. Ismlar */
.sd-card { position: absolute; left: 30px; right: 30px; top: 50px; height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; z-index: 3; }
.sd-event { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.sd-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1.1;
  text-shadow: 0 0 30px color-mix(in srgb, var(--flame) 30%, transparent); }
.sd-amp { font-family: var(--f-display); font-style: italic; font-size: 30px; line-height: 1; color: var(--accent); }
.sd-date { margin-top: 14px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--accent); }
.sd-wt { font-size: 15px; color: var(--muted); }

/* 3-4 */
.s3 .tv-details { padding: 40px 30px 120px; }
.s4 .tv-final { padding: 30px 28px 120px; }
.d-sign b { font-weight: 700; }
.d-day { font-weight: 700; }
</style>
<div class="bgk">
  <div class="sd-amb"></div>
  <div class="ptc sd-bk" data-particles="bokeh" data-n="16" data-colors="var(--flame),var(--accent),var(--gold)"></div>
  <div class="sd-row">
    <div class="sd-c" style="--x:62px;--w:34px;--h:104px;--on:2.1s;--fl:1.1s"><span class="sd-halo"><span class="sd-pulse"></span><i></i></span><span class="sd-wax"></span><span class="sd-wick"></span><span class="sd-fl"><i></i></span></div>
    <div class="sd-c" style="--x:116px;--w:40px;--h:168px;--on:1.4s;--fl:.9s"><span class="sd-halo"><span class="sd-pulse"></span><i></i></span><span class="sd-wax"></span><i class="sd-drip" style="left:8px;height:26px"></i><span class="sd-wick"></span><span class="sd-fl"><i></i></span></div>
    <div class="sd-c" style="--x:180px;--w:48px;--h:214px;--on:.7s;--fl:1.25s"><span class="sd-halo"><span class="sd-pulse"></span><i></i></span><span class="sd-wax"></span><i class="sd-drip" style="left:30px;height:34px"></i><i class="sd-drip" style="left:12px;height:16px"></i><span class="sd-wick"></span><span class="sd-fl"><i></i></span></div>
    <div class="sd-c" style="--x:244px;--w:40px;--h:146px;--on:1.7s;--fl:1.05s"><span class="sd-halo"><span class="sd-pulse"></span><i></i></span><span class="sd-wax"></span><i class="sd-drip" style="left:24px;height:20px"></i><span class="sd-wick"></span><span class="sd-fl"><i></i></span></div>
    <div class="sd-c" style="--x:298px;--w:32px;--h:90px;--on:2.4s;--fl:.95s"><span class="sd-halo"><span class="sd-pulse"></span><i></i></span><span class="sd-wax"></span><span class="sd-wick"></span><span class="sd-fl"><i></i></span></div>
  </div>
</div>

<section class="sc s1">
  <div class="sd-head">
    <p class="sd-inv a-fade" style="--d:.4s" data-t="invite"></p>
    <p class="sd-dear a-blur" style="--d:.8s" data-t="dear" data-if="guest" data-fit="28,15"></p>
    <p class="sd-names a-blur" style="--d:2.4s" data-t="names_line" data-fit="44,20,15"></p>
    <svg class="sd-orn a-fade" style="--d:2.9s" viewBox="0 0 120 14" aria-hidden="true"><path d="M2 7H50M70 7H118"/><circle cx="60" cy="7" r="3"/><circle cx="52" cy="7" r="1.4"/><circle cx="68" cy="7" r="1.4"/></svg>
    <p class="sd-from a-rise" style="--d:3.2s" data-t="from"></p>
  </div>
</section>

<section class="sc s2">
  <div class="sd-card">
    <p class="sd-event a-fade" style="--d:.2s" data-t="event"></p>
    <p class="sd-name a-blur" style="--d:.4s" data-t="name1" data-fit="56,15"></p>
    <p class="sd-amp a-fade" style="--d:.8s">&amp;</p>
    <p class="sd-name a-blur" style="--d:1s" data-t="name2" data-fit="56,15"></p>
    <p class="sd-date a-rise" style="--d:1.5s" data-t="date" data-fit="26,15"></p>
    <p class="sd-wt a-rise" style="--d:1.7s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3">
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="ptc" data-particles="spark" data-n="18" data-colors="var(--gold),var(--flame)"></div>
  <div class="tv-final" data-std="final"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
