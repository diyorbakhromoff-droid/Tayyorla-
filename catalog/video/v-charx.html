<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: radial-gradient(90% 55% at 50% 45%, var(--card) 0%, var(--bg) 75%); }
.cx-rays { position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
  background: repeating-conic-gradient(var(--ray) 0deg 9deg, transparent 9deg 18deg);
  -webkit-mask: radial-gradient(closest-side, #000 20%, transparent 100%); mask: radial-gradient(closest-side, #000 20%, transparent 100%);
  animation: cx-rays 40s linear 0s infinite both; }
@keyframes cx-rays { to { transform: rotate(360deg); } }
.cx-head { position: absolute; left: 24px; right: 24px; top: 54px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.cx-inv { font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cx-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.25; color: var(--accent); }
.cx-stage { position: absolute; left: 50px; top: 160px; width: 260px; height: 260px; }
.cx-in { position: absolute; inset: 0; animation: tv-pop .8s cubic-bezier(.2, 1.4, .4, 1) .2s both; }
.cx-wheel, .cx-over { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.cx-wheel { animation: cx-spin 3.3s cubic-bezier(.12, .6, .16, 1) .45s both; }
@keyframes cx-spin { from { transform: rotate(-40deg); } to { transform: rotate(1800deg); } }
.cx-seg { stroke: var(--card); stroke-width: 2; stroke-linejoin: round; }
.cx-seg.win { fill: var(--win); } .cx-seg.a { fill: var(--seg1); } .cx-seg.b { fill: var(--seg2); } .cx-seg.c { fill: var(--seg3); }
.cx-fig { fill: #FFFFFF; opacity: .92; } .cx-fig.d { fill: var(--seg1); opacity: .75; }
.cx-crown { fill: var(--gold); }
.cx-rim { fill: none; stroke: var(--rim); stroke-width: 14; }
.cx-bulb { fill: var(--gold); animation: cx-blink .5s steps(1) 0s infinite both; }
.cx-bulb.o { animation-delay: -.25s; }
@keyframes cx-blink { 0% { opacity: 1; } 50% { opacity: .35; } }
.cx-hub { fill: var(--rim); } .cx-hub2 { fill: var(--card); }
.cx-ini { font-family: var(--f-display); font-weight: 800; font-size: 26px; fill: var(--ink); }
.cx-flash { fill: #FFFFFF; opacity: 0; animation: cx-flash 1.2s ease-out 3.75s both; }
@keyframes cx-flash { 0% { opacity: 0; } 15% { opacity: .6; } 35% { opacity: .05; } 55% { opacity: .5; } 100% { opacity: 0; } }
.cx-pin { position: absolute; left: 112px; top: -22px; width: 36px; height: 46px; transform-origin: 50% 12px; animation: cx-tick .16s ease-in-out .5s 20 alternate both; }
.cx-pin svg { width: 100%; height: 100%; display: block; }
.cx-pin path { fill: var(--accent); stroke: var(--card); stroke-width: 3; } .cx-pin circle { fill: var(--card); }
@keyframes cx-tick { from { transform: rotate(0); } to { transform: rotate(-18deg); } }
.cx-glow { position: absolute; inset: -10px; opacity: 0; animation: tv-fade .6s ease 3.8s both; }
.cx-foot { position: absolute; left: 22px; right: 22px; top: 444px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.cx-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; color: var(--ink); }
.cx-turn { max-width: 100%; overflow: hidden; white-space: nowrap; padding: 9px 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.2; box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .55); }
.cx-from { font-size: 15px; color: var(--muted); }
.cx-tk { position: absolute; left: 32px; right: 32px; top: 104px; bottom: 104px; border-radius: 22px; background: var(--card); color: var(--ink);
  -webkit-mask: radial-gradient(circle 15px at 0 132px, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 15px at 100% 132px, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 15px at 0 132px, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 15px at 100% 132px, transparent 97%, #000) right / 51% 100% no-repeat;
  filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .18)); }
.cx-tkin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 22px 24px; }
.cx-top { height: 106px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.cx-lbl { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cx-ttl { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.2; color: var(--accent); }
.cx-perf { width: calc(100% + 20px); margin: 0 -10px; border-top: 3px dashed var(--line); }
.cx-body { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.cx-star { width: 44px; height: 44px; } .cx-star path { fill: var(--gold); }
.cx-bturn { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.25; }
.cx-kassa { padding: 6px 14px; border-radius: 10px; border: 2px solid var(--strong); color: var(--strong); font-size: 16px; font-weight: 700; transform: rotate(-3deg); }
.cx-date { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 21px; }
.cx-wt { font-size: 15px; color: var(--muted); }
.cx-host { font-size: 15px; color: var(--muted); }
.s3 .d-msg, .s3 .d-sign { font-family: var(--f-body); font-style: normal; }
.s3 .d-msg { font-size: 19px; }
.s3 .d-day { font-weight: 800; }
.s3 .d-month, .s3 .d-venue, .s4 .f-names, .s4 .f-date { font-weight: 700; }
</style>
