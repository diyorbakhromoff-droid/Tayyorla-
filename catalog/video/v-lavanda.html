<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: linear-gradient(180deg, var(--card) 0%, var(--bg) 70%); }
.bgk .p-bokeh { opacity: .14; }
.lv-stem { fill: none; stroke: var(--stem); stroke-width: 2.2; stroke-linecap: round; }
.lv-bud { fill: var(--bud); } .lv-bud.b { fill: var(--bud2); }
.lv-field { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lv-sprig { animation: lv-grow 1.2s cubic-bezier(.2, .8, .2, 1) calc(var(--s, 0s) + var(--d, 0s)) both, lv-sway 3s ease-in-out calc(var(--s, 0s) + var(--d, 0s) + 1.2s) infinite alternate both; }
.lv-sprig.small { animation: lv-grow 1s cubic-bezier(.2, .8, .2, 1) calc(var(--s, 0s) + var(--d, 0s)) both; }
@keyframes lv-grow { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lv-sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
.lv-head { position: absolute; left: 26px; right: 26px; top: 88px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.lv-inv { font-size: 15px; font-weight: 500; letter-spacing: .04em; color: var(--muted); }
.lv-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 36px; line-height: 1.2; }
.lv-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 34px; color: var(--accent); }
.lv-from { font-size: 15px; color: var(--muted); }
.lv-card { position: absolute; left: 30px; right: 30px; top: 200px; bottom: 70px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.lv-bq { position: absolute; left: 0; top: 0; width: 360px; height: 200px; overflow: visible; }
.lv-ribbon { position: absolute; left: 166px; top: 168px; width: 28px; height: 14px; border-radius: 4px; background: var(--accent); animation: tv-pop .6s ease .9s both; }
.lv-ctitle { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 50px; line-height: 1.05; color: var(--accent); }
.lv-turn { font-family: var(--f-display); font-style: italic; font-size: 24px; }
.lv-kassa { padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 15px; font-weight: 600; }
.lv-date { margin-top: 12px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 600; font-size: 28px; }
.lv-wt { font-size: 15px; color: var(--muted); }
.lv-host { margin-top: 4px; font-size: 15px; color: var(--muted); }
.s3 .tv-details { padding-top: 50px; }
</style>
