<style>
:root { --f-display: 'Yeseva One', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 62%, var(--bg) 100%); }
.sr-canopy { position: absolute; left: 0; top: 0; width: 360px; height: 130px; overflow: visible; animation: tv-drop 1.2s ease .1s both; --s: 0s; }
.sr-vine { fill: none; stroke: var(--wood); stroke-width: 5; stroke-linecap: round; }
.sr-leaf { fill: var(--leaf); } .sr-leaf.b { fill: color-mix(in srgb, var(--leaf) 70%, #000); }
.sr-grape { fill: var(--grape); }
.sr-lamp { position: absolute; left: 318px; top: 96px; width: 34px; height: 120px; animation: sr-swing 3s ease-in-out infinite alternate both; transform-origin: 17px 0; }
.sr-lamp i { position: absolute; left: 16px; top: 0; width: 2px; height: 64px; background: var(--wood); }
.sr-lamp b { position: absolute; left: 3px; top: 62px; width: 28px; height: 38px; border-radius: 10px 10px 14px 14px; background: var(--lamp);
  box-shadow: 0 0 26px 10px color-mix(in srgb, var(--lamp) 55%, transparent); animation: sr-glow 1.6s ease-in-out infinite alternate both; }
@keyframes sr-swing { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes sr-glow { from { opacity: .82; } to { opacity: 1; } }
.sr-sori { position: absolute; left: 20px; right: 20px; bottom: 30px; height: 200px; }
.sr-post { position: absolute; bottom: 0; width: 10px; height: 200px; border-radius: 3px; background: var(--wood); }
.sr-post.l { left: 0; } .sr-post.r { right: 0; }
.sr-rail { position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: var(--wood); }
.sr-bars { position: absolute; left: 0; right: 0; bottom: 70px; height: 70px; background: repeating-linear-gradient(90deg, var(--wood) 0 6px, transparent 6px 30px); }
.sr-carpet { position: absolute; left: 10px; right: 10px; bottom: 34px; height: 34px; border-radius: 4px;
  background: repeating-linear-gradient(90deg, var(--carpet) 0 16px, color-mix(in srgb, var(--carpet) 70%, #000) 16px 20px, var(--gold) 20px 22px); }
.sr-cush { position: absolute; bottom: 64px; width: 70px; height: 28px; border-radius: 14px; background: var(--carpet); border: 2px solid var(--gold); }
.sr-legs { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: repeating-linear-gradient(90deg, var(--wood) 0 10px, transparent 10px 70px); }
.sr-mid { position: absolute; left: 26px; right: 26px; top: 236px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.sr-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.sr-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 32px; line-height: 1.2; }
.sr-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 26px; color: var(--accent); }
.sr-sign { position: absolute; left: 34px; right: 34px; top: 150px; bottom: 120px; border-radius: 18px; padding: 26px 20px;
  background: repeating-linear-gradient(178deg, rgba(0, 0, 0, .05) 0 3px, transparent 3px 16px), linear-gradient(160deg, var(--wood2), var(--wood));
  color: var(--wood-ink); box-shadow: 0 22px 40px -22px rgba(0, 0, 0, .6);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.sr-rope { position: absolute; top: 96px; width: 3px; height: 58px; background: var(--wood); }
.sr-rope.l { left: 90px; } .sr-rope.r { right: 90px; }
.sr-ctitle { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 40px; line-height: 1.1; color: var(--accent); }
.sr-turn { font-family: var(--f-display); font-size: 24px; }
.sr-kassa { padding: 7px 16px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 15px; font-weight: 700; }
.sr-date { margin-top: 6px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-size: 25px; }
.sr-wt { font-size: 15px; opacity: .85; }
.s3 .tv-details, .s4 .tv-final { padding-top: 120px; }
.s4 .tv-final { padding-bottom: 110px; }
</style>
