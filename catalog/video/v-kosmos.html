<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: radial-gradient(90% 55% at 70% 20%, var(--card) 0%, var(--bg) 70%); }
.ks-neb { position: absolute; left: -80px; top: 300px; width: 360px; height: 360px; border-radius: 50%; opacity: .35; filter: blur(40px);
  background: radial-gradient(closest-side, var(--accent2), transparent); }
.ks-neb.b { left: 160px; top: -60px; width: 300px; height: 300px; opacity: .28; background: radial-gradient(closest-side, var(--accent), transparent); }
.ks-shoot { position: absolute; width: 120px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--star)); transform: rotate(-28deg); opacity: 0;
  animation: ks-shoot 1s ease-out var(--t) both; }
@keyframes ks-shoot { 0% { opacity: 0; translate: 0 0; } 20% { opacity: 1; } 100% { opacity: 0; translate: 200px -106px; } }

/* raketa */
.ks-rk { position: absolute; left: 0; top: 0; width: 80px; height: 40px; z-index: 6; offset-anchor: 55% 50%; offset-rotate: auto; overflow: visible; }
.ks-rk svg { width: 80px; height: 40px; overflow: visible; }
.ks-body { fill: var(--rk); } .ks-fin { fill: var(--accent); } .ks-win { fill: var(--accent2); stroke: var(--rk2); stroke-width: 3; }
.ks-band { fill: var(--rk2); }
.ks-flame { fill: var(--flame); transform-box: fill-box; transform-origin: 100% 50%; animation: ks-flick .12s linear infinite alternate both; }
.ks-flame.b { fill: #FFFFFF; opacity: .85; }
@keyframes ks-flick { from { transform: scaleX(.8) scaleY(.9); } to { transform: scaleX(1.15) scaleY(1.05); } }
.ks-trail { position: absolute; left: 0; top: 0; width: 360px; height: 640px; z-index: 2; overflow: visible; animation: ks-dim 1.4s ease 2.6s both; }
.ks-trail path { fill: none; stroke: var(--flame); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.ks-trail path.w { stroke-width: 14; stroke-opacity: .18; }
@keyframes ks-dim { to { opacity: .22; } }
@keyframes ks-draw { to { stroke-dashoffset: 0; } }
@keyframes ks-go { from { offset-distance: 0%; } to { offset-distance: 100%; } }
.s1 .ks-rk { offset-path: path('M40 720C80 470 250 400 440 -140'); animation: ks-go 2.4s cubic-bezier(.45, 0, .7, 1) .2s both; }
.s1 .ks-trail path { animation: ks-draw 2.4s cubic-bezier(.45, 0, .7, 1) .2s both; }

/* 1. Sayyora */
.ks-head { position: absolute; left: 24px; right: 24px; top: 38px; z-index: 7; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.ks-inv { font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.ks-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.25; }
.ks-sys { position: absolute; left: 0; top: 176px; width: 360px; height: 240px; z-index: 3; }
.ks-orbit { position: absolute; inset: 0; width: 360px; height: 240px; overflow: visible; }
.ks-orbit .o { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; stroke-dasharray: 3 6; }
.ks-orbit .r { fill: none; stroke: var(--ring); stroke-width: 9; stroke-linecap: round; }
.ks-orbit .r2 { fill: none; stroke: var(--ring); stroke-opacity: .45; stroke-width: 3; }
.ks-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ks-draw 1.1s cubic-bezier(.5, 0, .3, 1) calc(var(--s) + var(--d)) forwards; }
.ks-orbit .o.ks-draw { stroke-dasharray: none; stroke-dashoffset: 0; animation: tv-fade 1s ease calc(var(--s) + var(--d)) both; }
.ks-front { z-index: 5; }
.ks-pl { position: absolute; left: 106px; top: 46px; width: 148px; height: 148px; border-radius: 50%; z-index: 4; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--pl1) 70%, #FFFFFF) 0%, var(--pl1) 32%, var(--pl2) 100%);
  box-shadow: inset -18px -14px 30px rgba(0, 0, 0, .32), 0 0 40px color-mix(in srgb, var(--pl1) 45%, transparent);
  animation: ks-born 1s cubic-bezier(.2, 1.4, .4, 1) calc(var(--s) + var(--d)) both; }
.ks-pl::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .25;
  background: repeating-linear-gradient(-16deg, transparent 0 18px, rgba(255, 255, 255, .55) 18px 24px, transparent 24px 40px); }
@keyframes ks-born { from { opacity: 0; transform: scale(0) rotate(-40deg); } to { opacity: 1; transform: none; } }
.ks-num { position: relative; font-family: var(--f-display); font-weight: 800; font-size: 60px; line-height: 1; color: #FFFFFF; white-space: nowrap;
  text-shadow: 0 3px 14px rgba(0, 0, 0, .35); }
.ks-moon { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; z-index: 6;
  background: radial-gradient(circle at 35% 30%, #FFFFFF, var(--moon) 70%); box-shadow: 0 0 12px color-mix(in srgb, var(--moon) 60%, transparent);
  offset-path: path('M20 120A160 80 0 1 0 340 120A160 80 0 1 0 20 120'); offset-rotate: 0deg;
  animation: tv-fade .6s ease calc(var(--s) + 2.4s) both, ks-go 5s linear calc(var(--s) + 2.4s) infinite both; }
.ks-tilt { position: absolute; inset: 0; transform: rotate(-14deg); }
.ks-ev { position: absolute; left: 24px; right: 24px; top: 452px; z-index: 7; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.ks-name { position: absolute; left: 22px; right: 22px; top: 478px; z-index: 7; max-height: 150px; overflow: hidden; white-space: nowrap; text-align: center;
  font-family: var(--f-display); font-weight: 800; font-size: 46px; line-height: 1.15; }

/* 2. Ufq */
.ks-hz { position: absolute; left: -290px; top: 470px; width: 940px; height: 940px; border-radius: 50%; z-index: 1;
  background: radial-gradient(circle at 50% 4%, color-mix(in srgb, var(--pl1) 75%, #FFFFFF) 0%, var(--pl1) 10%, var(--pl2) 40%);
  box-shadow: 0 0 60px 10px color-mix(in srgb, var(--pl1) 45%, transparent);
  animation: ks-hz 1.6s cubic-bezier(.2, .8, .2, 1) var(--s) both; }
.ks-hz::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .2;
  background: repeating-radial-gradient(circle at 50% 50%, transparent 0 22px, rgba(255, 255, 255, .6) 22px 26px); }
@keyframes ks-hz { from { transform: translateY(170px); } to { transform: none; } }
.ks-col { position: absolute; left: 26px; right: 26px; top: 50px; height: 400px; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.ks-event { font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.ks-big { width: 100%; padding: 0 4px; max-height: 170px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 52px; line-height: 1.15; }
.ks-age { display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 8px; border-radius: 99px; background: color-mix(in srgb, var(--card) 80%, transparent);
  border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); font-size: 17px; font-weight: 700; white-space: nowrap; }
.ks-age i { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF, var(--pl1) 45%, var(--pl2)); box-shadow: 0 0 0 2px var(--ring); }
.ks-date { margin-top: 8px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 24px; color: var(--accent2); }
.ks-wt { font-size: 15px; color: var(--muted); }
.ks-lift { position: absolute; left: 290px; top: 456px; width: 40px; height: 80px; z-index: 3; animation: ks-lift 3.4s cubic-bezier(.6, 0, .9, .6) calc(var(--s) + 1.4s) both; }
.ks-lift .ks-rk { position: relative; transform: rotate(-90deg); transform-origin: 40px 20px; left: -20px; top: 20px; }
@keyframes ks-lift { 0% { transform: translateY(0); } 10% { transform: translate(1px, 2px); } 100% { transform: translateY(-640px); } }
.ks-smoke { position: absolute; left: 270px; top: 500px; width: 80px; height: 60px; z-index: 2; }
.ks-smoke i { position: absolute; bottom: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--muted); opacity: 0; filter: blur(4px);
  animation: ks-puff 2s ease-out calc(var(--s) + 1.4s + var(--k)) both; }
@keyframes ks-puff { 0% { opacity: 0; transform: scale(.3); } 20% { opacity: .5; } 100% { opacity: 0; transform: translate(var(--x), -10px) scale(1.8); } }

/* 3-4 */
.ks-glass { position: absolute; left: 20px; right: 20px; top: 40px; bottom: 40px; border-radius: 26px;
  background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
  backdrop-filter: blur(6px); animation: tv-fade .8s ease var(--s) both; }
.ks-mini { position: absolute; left: 274px; top: 14px; width: 80px; height: 60px; z-index: 3; overflow: visible; animation: tv-pop .8s cubic-bezier(.2, 1.4, .4, 1) calc(var(--s) + .2s) both; }
.ks-mini circle { fill: var(--pl1); } .ks-mini path { fill: none; stroke: var(--ring); stroke-width: 4; stroke-linecap: round; }
.s3 .tv-details { padding: 76px 40px 56px; }
.s3 .d-msg { font-family: var(--f-body); font-weight: 600; font-size: 19px; }
.s3 .d-day { font-weight: 800; font-size: 76px; }
.s3 .d-month, .s3 .d-venue { font-weight: 700; font-size: 21px; }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; font-size: 17px; }
.s4 .f-names { font-weight: 800; font-size: 40px; }
.s4 .f-date { font-weight: 700; font-size: 19px; color: var(--accent2); }
.s4 .ks-rk { offset-path: path('M-100 140C60 60 240 150 460 40'); animation: ks-go 2.6s cubic-bezier(.4, 0, .6, 1) calc(var(--s) + .3s) both; }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="ks-rocket">
    <path class="ks-flame" d="M10 13C-4 12-18 18-28 20C-18 22-4 28 10 27Z"/><path class="ks-flame b" d="M10 16C2 16-6 19-12 20C-6 21 2 24 10 24Z"/>
    <path class="ks-fin" d="M22 10L8 -2L34 8Z"/><path class="ks-fin" d="M22 30L8 42L34 32Z"/>
    <path class="ks-body" d="M8 20C8 12 30 6 52 8C66 9 76 15 82 20C76 25 66 31 52 32C30 34 8 28 8 20Z"/>
    <path class="ks-band" d="M66 10.6C72 13 77 16.5 82 20C77 23.5 72 27 66 29.4C68 26 69 23 69 20C69 17 68 14 66 10.6Z"/>
    <circle class="ks-win" cx="48" cy="20" r="6.5"/>
  </g>
</defs></svg>
<div class="bgk">
  <div class="ks-neb"></div><div class="ks-neb b"></div>
  <div class="ptc" data-particles="star" data-n="70" data-colors="var(--star),var(--star),var(--accent)"></div>
  <span class="ks-shoot" style="left:30px;top:140px;--t:3.4s"></span><span class="ks-shoot" style="left:120px;top:250px;--t:8.6s"></span>
  <span class="ks-shoot" style="left:10px;top:100px;--t:16.8s"></span>
</div>

<section class="sc s1">
  <div class="ks-head">
    <p class="ks-inv a-rise" style="--d:.2s" data-t="invite"></p>
    <p class="ks-dear a-rise" style="--d:.4s" data-t="dear" data-if="guest" data-fit="25,14"></p>
  </div>
  <svg class="ks-trail" viewBox="0 0 360 640" aria-hidden="true"><path class="w" pathLength="1" d="M40 720C80 470 250 400 440 -140"/><path pathLength="1" d="M40 720C80 470 250 400 440 -140"/></svg>
  <div class="ks-rk"><svg viewBox="0 0 80 40" aria-hidden="true"><use href="#ks-rocket"/></svg></div>
  <div class="ks-sys">
    <div class="ks-tilt"><svg class="ks-orbit" viewBox="0 0 360 240" aria-hidden="true">
      <ellipse class="o ks-draw" style="--d:1.9s" cx="180" cy="120" rx="160" ry="80"/>
      <path class="r2 ks-draw" pathLength="1" style="--d:1.8s" d="M40 120A140 30 0 0 1 320 120"/>
      <path class="r ks-draw" pathLength="1" style="--d:1.8s" d="M50 120A130 26 0 0 1 310 120"/>
    </svg></div>
    <div class="ks-pl" style="--d:1.4s">
      <span class="ks-num a-blur" style="--d:2.2s" data-t="age_n" data-if="age"></span>
      <span class="ks-num a-blur" style="--d:2.2s" data-t="initials" data-if="!age"></span>
    </div>
    <div class="ks-tilt ks-front"><svg class="ks-orbit" viewBox="0 0 360 240" aria-hidden="true">
      <path class="r2 ks-draw" pathLength="1" style="--d:2.1s" d="M40 120A140 30 0 0 0 320 120"/>
      <path class="r ks-draw" pathLength="1" style="--d:2.1s" d="M50 120A130 26 0 0 0 310 120"/>
    </svg>
    <span class="ks-moon"></span></div>
  </div>
  <p class="ks-ev a-fade" style="--d:2.6s" data-t="event"></p>
  <p class="ks-name a-blur" style="--d:2.8s" data-t="name" data-fit="46,22,17"></p>
</section>

<section class="sc s2">
  <div class="ks-hz"></div>
  <div class="ks-smoke"><i style="left:0;--k:0s;--x:-30px"></i><i style="left:20px;--k:.1s;--x:0px"></i><i style="left:40px;--k:.05s;--x:30px"></i><i style="left:20px;--k:.3s;--x:-10px"></i></div>
  <div class="ks-lift"><div class="ks-rk"><svg viewBox="0 0 80 40" aria-hidden="true"><use href="#ks-rocket"/></svg></div></div>
  <div class="ks-col">
    <p class="ks-event a-fade" style="--d:.4s" data-t="event"></p>
    <p class="ks-big a-blur" style="--d:.55s" data-t="name" data-fit="52,22,16"></p>
    <p class="ks-age a-pop" style="--d:.9s" data-if="age"><i></i><span data-t="age"></span></p>
    <p class="ks-date a-rise" style="--d:1.1s" data-t="date" data-fit="24,14"></p>
    <p class="ks-wt a-rise" style="--d:1.3s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3">
  <div class="ks-glass"></div>
  <svg class="ks-mini" viewBox="0 0 80 60" aria-hidden="true"><circle cx="40" cy="30" r="17"/><path d="M8 38C2 30 30 20 52 18C70 16 82 18 74 24"/></svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="ks-rk"><svg viewBox="0 0 80 40" aria-hidden="true"><use href="#ks-rocket"/></svg></div>
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="spark" data-n="22" data-colors="var(--star),var(--accent),var(--accent2)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
