<style>
:root { --f-display: 'Cormorant Garamond', Georgia, serif; --f-body: 'Comfortaa', system-ui, sans-serif; --msg-style: italic; }
#tv { background: radial-gradient(90% 60% at 50% 45%, var(--card) 0%, var(--bg) 80%); }

.gc-svg { position: absolute; left: 0; top: 0; width: 360px; height: 640px; overflow: visible; }
.gc-arch { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: gc-draw 2.6s cubic-bezier(.55, 0, .3, 1) var(--d) both; }
.gc-arch.in { stroke-width: .8; stroke: var(--gold); opacity: .8; }
.gc-fill { fill: color-mix(in srgb, var(--card) 55%, transparent); opacity: 0; animation: tv-fade 1.6s ease 1.6s both; }
.gc-vine { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: gc-draw 2.4s cubic-bezier(.45, 0, .3, 1) var(--d) both; }
@keyframes gc-draw { to { stroke-dashoffset: 0; } }
.gc-leaf { fill: color-mix(in srgb, var(--line) 22%, transparent); stroke: var(--line); stroke-width: 1.1; stroke-linejoin: round; }
.gc-rib { fill: none; stroke: var(--line); stroke-width: .8; }
.gc-lf { transform-box: fill-box; transform-origin: 0 50%; animation: gc-leaf .8s cubic-bezier(.2, 1.3, .4, 1) var(--d) both; }
@keyframes gc-leaf { from { transform: scale(0); } to { transform: none; } }
.gc-pt { fill: var(--petal); stroke: var(--line); stroke-width: .9; }
.gc-pt.b { fill: var(--petal2); }
.gc-core { fill: var(--core); }
.gc-dot { fill: var(--line); }
.gc-op { transform-box: fill-box; transform-origin: 50% 50%; animation: gc-open 1.3s cubic-bezier(.2, 1.2, .35, 1) var(--d) both; }
@keyframes gc-open { from { transform: scale(0) rotate(-90deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
.gc-sway { transform-box: fill-box; transform-origin: 50% 50%; animation: gc-sway 4s ease-in-out infinite alternate both; }
@keyframes gc-sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
.gc-bud { fill: var(--petal); stroke: var(--line); stroke-width: .9; }

/* 1. Ravoq */
.gc-box { position: absolute; left: 56px; right: 56px; top: 150px; bottom: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.gc-inv { font-size: 13px; font-weight: 500; letter-spacing: .03em; color: var(--muted); }
.gc-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 28px; line-height: 1.3; }
.gc-sprig { width: 88px; height: 20px; margin: 12px 0; overflow: visible; }
.gc-sprig path { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-linecap: round; }
.gc-sprig circle { fill: var(--accent); }
.gc-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 54px; line-height: 1.1; color: var(--ink); }
.gc-amp { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 32px; line-height: 1; color: var(--accent); }
.gc-from { font-size: 13px; font-weight: 500; color: var(--muted); }

/* 2. Sana */
.gc-ev { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.gc-nl { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.2; }
.gc-day { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 500; font-size: 104px; line-height: .95; color: var(--accent); font-variant-numeric: lining-nums; }
.gc-month { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 28px; line-height: 1.2; }
.gc-wt { margin-top: 6px; font-size: 13px; color: var(--muted); }

/* 3-4 */
.s3 .tv-details { padding: 196px 54px 40px; gap: 11px; }
.s3 .d-msg { font-size: 20px; max-height: 76px; }
.s4 .tv-final { padding: 130px 44px 100px; }
.s4 .b-card { transform: scale(.9); margin: -8px 0; }
.d-msg { font-weight: 600; font-size: 22px; }
.d-day { font-weight: 500; font-variant-numeric: lining-nums; }
.d-month, .d-venue, .f-names { font-style: italic; }
.d-addr, .d-scan, .d-wd { font-size: 12.5px; }
</style>
