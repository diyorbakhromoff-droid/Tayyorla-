<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: linear-gradient(180deg, var(--bg) 0%, var(--card) 100%); }
.sy-city { position: absolute; left: 0; bottom: 0; width: 360px; height: 640px; }
.sy-b { fill: color-mix(in srgb, var(--bg) 70%, #000); } .sy-w { fill: var(--fw1); opacity: .7; }
.fw-rocket { position: absolute; width: 2px; height: 46px; border-radius: 2px; background: linear-gradient(#FFFFFF, rgba(255, 255, 255, 0)); transform-origin: 50% 0; opacity: 0;
  animation: fw-rocket 2.6s ease-out infinite both; }
.fw-flash { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 240, 210, .5), rgba(255, 240, 210, 0) 70%); opacity: 0;
  animation: fw-flash 2.6s ease-out infinite both; }
.fw-burst { position: absolute; width: 0; height: 0; }
.fw-burst i { position: absolute; left: 0; top: 0; }
.fw-burst b { display: block; width: 7px; height: 7px; margin: -3px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); opacity: 0;
  animation: fw-fly 2.6s ease-out infinite both; }
.fw-burst b.w { background: #FFFFFF; }
@keyframes fw-fly { 0% { opacity: 0; transform: translateY(0) scale(1); } 4% { opacity: 1; } 38% { opacity: .9; } 62% { opacity: 0; transform: translateY(-74px) scale(.35); } 100% { opacity: 0; transform: translateY(-74px) scale(.35); } }
@keyframes fw-rocket { 0% { opacity: 0; transform: translateY(260px) scaleY(.4); } 3% { opacity: 1; } 21% { opacity: 0; transform: none; } 100% { opacity: 0; } }
@keyframes fw-flash { 0%, 100% { opacity: 0; transform: scale(.3); } 10% { opacity: .55; transform: none; } 40% { opacity: 0; transform: scale(1.4); } }
.sy-mid { position: absolute; left: 24px; right: 24px; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.sy-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.sy-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.2; }
.sy-ev { margin-top: 6px; font-size: 14px; font-weight: 600; letter-spacing: .14em; color: var(--fw2); }
.sy-name { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 40px; color: var(--fw1); text-shadow: 0 0 22px color-mix(in srgb, var(--fw1) 60%, transparent); }
.sy-card { position: absolute; left: 24px; right: 24px; top: 150px; bottom: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.sy-event { font-size: 14px; font-weight: 600; letter-spacing: .14em; color: var(--fw2); }
.sy-cname { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 46px; line-height: 1.1; }
.sy-age { font-family: var(--f-display); font-weight: 800; font-size: 120px; line-height: .95; color: var(--fw1); text-shadow: 0 0 30px color-mix(in srgb, var(--fw1) 55%, transparent); }
.sy-agel { font-size: 18px; font-weight: 600; color: var(--muted); }
.sy-date { margin-top: 12px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.sy-wt { font-size: 15px; color: var(--muted); }
.s3 .d-msg { font-family: var(--f-body); font-style: normal; font-size: 19px; }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; font-size: 17px; }
.s3 .d-day { font-weight: 800; }
.s4 .f-names { font-weight: 800; }
</style>
