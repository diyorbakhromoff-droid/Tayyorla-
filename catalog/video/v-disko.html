<style>
:root { --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'Rubik', system-ui, sans-serif; --msg-style: normal; }
#tv { background: radial-gradient(90% 55% at 50% 22%, var(--card) 0%, var(--bg) 75%); }
.dk-beams { position: absolute; left: -320px; top: -490px; width: 1000px; height: 1000px; border-radius: 50%; opacity: .5;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--spot) 22%, transparent) 0deg 4deg, transparent 4deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 8%, transparent 62%); mask: radial-gradient(circle, #000 8%, transparent 62%);
  animation: dk-spin 26s linear infinite both; }
.dk-spots { position: absolute; left: -320px; top: -490px; width: 1000px; height: 1000px; border-radius: 50%;
  background-image: radial-gradient(circle, var(--spot) 0 2.2px, transparent 3.4px), radial-gradient(circle, var(--accent2) 0 1.6px, transparent 2.6px);
  background-size: 46px 46px, 70px 70px; background-position: 0 0, 20px 31px; opacity: .42;
  -webkit-mask: radial-gradient(circle, transparent 12%, #000 22%, #000 48%, transparent 66%); mask: radial-gradient(circle, transparent 12%, #000 22%, #000 48%, transparent 66%);
  animation: dk-spin 18s linear infinite reverse both; }
@keyframes dk-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.dk-f1 { fill: var(--f1); } .dk-f2 { fill: var(--f2); } .dk-f3 { fill: var(--f3); } .dk-f4 { fill: var(--spot); }
.dk-grid { stroke: var(--bg); stroke-width: 1.4; stroke-opacity: .55; }
.dk-roll { animation: dk-roll 1.5s linear infinite both; }
@keyframes dk-roll { from { transform: translateX(0); } to { transform: translateX(-48px); } }
.dk-sh1 { stop-color: #FFFFFF; stop-opacity: .55; } .dk-sh2 { stop-color: #FFFFFF; stop-opacity: 0; } .dk-sh3 { stop-color: #000000; stop-opacity: .55; }
.dk-str { stroke: var(--muted); stroke-width: 2; }
.dk-gl { fill: #FFFFFF; animation: dk-tw 1.6s ease-in-out calc(var(--d)) infinite both; transform-box: fill-box; transform-origin: center; }
@keyframes dk-tw { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }
.dk-gtxt { background: linear-gradient(100deg, var(--g1) 0%, var(--g2) 45%, var(--g3) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(3px 3px 0 var(--sh1)) drop-shadow(3px 3px 0 var(--sh2)); }

/* 1 */
.dk-ball { position: absolute; left: 90px; top: 0; width: 180px; height: 260px; overflow: visible; animation: dk-hang 1.6s cubic-bezier(.3, 1.4, .5, 1) .1s both; }
@keyframes dk-hang { from { transform: translateY(-270px); } to { transform: none; } }
.dk-sway { transform-origin: 90px 0; animation: dk-sway 4s ease-in-out 1.6s infinite alternate both; }
@keyframes dk-sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
.dk-inv { position: absolute; left: 24px; right: 24px; top: 278px; text-align: center; font-size: 13px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
.dk-dear { position: absolute; left: 24px; right: 24px; top: 300px; overflow: hidden; white-space: nowrap; text-align: center; font-size: 25px; font-weight: 700; line-height: 1.3; color: var(--ink); }
.dk-foot { position: absolute; left: 18px; right: 18px; top: 350px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 2; }
.dk-titlew { width: 100%; }
.dk-title { width: 100%; max-height: 128px; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-weight: 800;
  font-size: 46px; line-height: 1.12; text-transform: uppercase; padding: 0 6px 6px 0; }
.dk-titlew { animation: dk-boom 1s cubic-bezier(.2, 1.6, .4, 1) 2.2s both; }
@keyframes dk-boom { from { opacity: 0; transform: scale(.4) rotate(-6deg); } to { opacity: 1; transform: none; } }
.dk-pill { margin-top: 6px; max-width: 300px; overflow: hidden; white-space: nowrap; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--g2);
  font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--ink); }
.dk-arcs { position: absolute; left: 0; bottom: -2px; width: 360px; height: 110px; overflow: visible; }
.dk-arc { fill: none; stroke-width: 15; transform-box: view-box; transform-origin: 180px 120px; animation: dk-arc .9s cubic-bezier(.2, .9, .3, 1) calc(var(--s) + var(--d)) both; }
@keyframes dk-arc { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.dk-a1 { stroke: var(--st1); } .dk-a2 { stroke: var(--st2); } .dk-a3 { stroke: var(--st3); } .dk-a4 { stroke: var(--st4); }
.dk-from { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-size: 15px; font-weight: 500; color: var(--muted); z-index: 2; }

/* 2 */
.dk-floor { position: absolute; left: -80px; right: -80px; bottom: -40px; height: 260px; perspective: 360px; }
.dk-tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; transform: rotateX(58deg); transform-origin: 50% 100%; }
.dk-tiles i { display: block; border-radius: 3px; background: var(--c); opacity: .2; animation: dk-flash 1.2s steps(1) calc(var(--s) + var(--d)) infinite both; }
@keyframes dk-flash { 0% { opacity: .9; } 50% { opacity: .15; } }
.dk-mini { position: absolute; right: 14px; top: -58px; width: 96px; height: 150px; overflow: visible; }
.dk-card { position: absolute; left: 26px; right: 26px; top: 116px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.dk-ct { width: 100%; max-height: 110px; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 38px; line-height: 1.12; text-transform: uppercase; padding: 0 6px 6px 0; }
.dk-badges { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.dk-b { max-width: 100%; overflow: hidden; white-space: nowrap; padding: 7px 16px; border-radius: 10px; background: color-mix(in srgb, var(--card) 80%, transparent); border: 1.5px solid var(--g1);
  font-weight: 700; font-size: 16px; color: var(--ink); }
.dk-b.k { border-color: var(--g3); }
.dk-dt { margin-top: 8px; width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 24px; color: var(--g1); }
.dk-wt { font-size: 16px; font-weight: 500; color: var(--muted); }

/* 3-4 */
.dk-top { position: absolute; left: 150px; top: -40px; width: 60px; height: 100px; overflow: visible; }
.s3 .tv-details { padding-top: 76px; }
.s3 .d-day, .s4 .f-names { font-weight: 800; }
.s3 .d-month, .s3 .d-venue, .s4 .f-date { font-weight: 700; }
.s3 .d-day { color: var(--g2); }
.s3 .d-msg { font-family: var(--f-body); font-weight: 500; font-size: 20px; }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; }
.s4 .f-names { text-transform: uppercase; color: var(--g1); }
.s4 .tv-final { padding-top: 80px; }
.s4 .dk-arcs { bottom: auto; top: -2px; transform: scaleY(-1); }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="dk-pat" width="48" height="16" patternUnits="userSpaceOnUse">
    <rect class="dk-f1" width="16" height="16"/><rect class="dk-f3" x="16" width="16" height="16"/><rect class="dk-f2" x="32" width="16" height="16"/>
  </pattern>
  <pattern id="dk-pat2" width="48" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(8 0)">
    <rect class="dk-f2" width="16" height="16"/><rect class="dk-f1" x="16" width="16" height="16"/><rect class="dk-f4" x="32" width="16" height="16" opacity=".8"/>
  </pattern>
  <radialGradient id="dk-shade" cx=".36" cy=".32" r=".75"><stop class="dk-sh1" offset="0"/><stop class="dk-sh2" offset=".45"/><stop class="dk-sh3" offset="1"/></radialGradient>
  <clipPath id="dk-clip"><circle cx="0" cy="0" r="64"/></clipPath>
  <g id="dk-orb">
    <g clip-path="url(#dk-clip)">
      <g class="dk-roll">
        <rect x="-64" y="-64" width="200" height="16" fill="url(#dk-pat)"/><rect x="-64" y="-48" width="200" height="16" fill="url(#dk-pat2)"/>
        <rect x="-64" y="-32" width="200" height="16" fill="url(#dk-pat)"/><rect x="-64" y="-16" width="200" height="16" fill="url(#dk-pat2)"/>
        <rect x="-64" y="0" width="200" height="16" fill="url(#dk-pat)"/><rect x="-64" y="16" width="200" height="16" fill="url(#dk-pat2)"/>
        <rect x="-64" y="32" width="200" height="16" fill="url(#dk-pat)"/><rect x="-64" y="48" width="200" height="16" fill="url(#dk-pat2)"/>
        <path class="dk-grid" d="M-64-48H136M-64-32H136M-64-16H136M-64 0H136M-64 16H136M-64 32H136M-64 48H136M-56-64V64M-40-64V64M-24-64V64M-8-64V64M8-64V64M24-64V64M40-64V64M56-64V64M72-64V64M88-64V64"/>
      </g>
      <circle r="64" fill="url(#dk-shade)"/>
    </g>
  </g>
</defs></svg>
<div class="bgk"><div class="dk-beams"></div><div class="dk-spots"></div></div>

<section class="sc s1">
  <svg class="dk-ball" viewBox="0 0 180 260" aria-hidden="true">
    <g class="dk-sway">
      <path class="dk-str" d="M90-20V100"/>
      <rect x="82" y="96" width="16" height="12" rx="2" style="fill:var(--f3)"/>
      <use href="#dk-orb" x="90" y="172"/>
      <path class="dk-gl" style="--d:0s" d="M64 140l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
      <path class="dk-gl" style="--d:.7s" d="M126 186l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
      <path class="dk-gl" style="--d:1.1s" d="M98 210l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    </g>
  </svg>
  <p class="dk-inv a-fade" style="--d:1.2s" data-t="invite"></p>
  <p class="dk-dear a-rise" style="--d:1.5s" data-t="dear" data-if="guest" data-fit="25,12"></p>
  <div class="dk-foot">
  <div class="dk-titlew"><p class="dk-title dk-gtxt" data-t="title" data-fit="46,22,20"></p></div>
  <p class="dk-from a-rise" style="--d:2.8s" data-t="from" data-fit="15,11"></p>
  <p class="dk-pill a-pop" style="--d:3s" data-t="wt" data-fit="15,11"></p>
  </div>
  <svg class="dk-arcs" viewBox="0 0 360 110" preserveAspectRatio="none" aria-hidden="true">
    <path class="dk-arc dk-a1" style="--d:3.3s" d="M-10 120A190 92 0 0 1 370 120"/>
    <path class="dk-arc dk-a2" style="--d:3.4s" d="M5 120A175 78 0 0 1 355 120"/>
    <path class="dk-arc dk-a3" style="--d:3.5s" d="M20 120A160 64 0 0 1 340 120"/>
    <path class="dk-arc dk-a4" style="--d:3.6s" d="M35 120A145 50 0 0 1 325 120"/>
  </svg>
</section>

<section class="sc s2">
  <div class="dk-floor"><div class="dk-tiles">
    <i style="--c:var(--st1);--d:0s"></i><i style="--c:var(--st3);--d:.3s"></i><i style="--c:var(--st2);--d:.6s"></i><i style="--c:var(--st4);--d:.15s"></i><i style="--c:var(--st1);--d:.45s"></i><i style="--c:var(--st3);--d:.9s"></i><i style="--c:var(--st2);--d:.2s"></i><i style="--c:var(--st4);--d:.75s"></i>
    <i style="--c:var(--st4);--d:.5s"></i><i style="--c:var(--st2);--d:.1s"></i><i style="--c:var(--st1);--d:.8s"></i><i style="--c:var(--st3);--d:.35s"></i><i style="--c:var(--st4);--d:.65s"></i><i style="--c:var(--st1);--d:.05s"></i><i style="--c:var(--st3);--d:.55s"></i><i style="--c:var(--st2);--d:.95s"></i>
    <i style="--c:var(--st2);--d:.25s"></i><i style="--c:var(--st4);--d:.7s"></i><i style="--c:var(--st3);--d:0s"></i><i style="--c:var(--st1);--d:.6s"></i><i style="--c:var(--st2);--d:.4s"></i><i style="--c:var(--st4);--d:.85s"></i><i style="--c:var(--st1);--d:.3s"></i><i style="--c:var(--st3);--d:.1s"></i>
    <i style="--c:var(--st3);--d:.9s"></i><i style="--c:var(--st1);--d:.2s"></i><i style="--c:var(--st4);--d:.45s"></i><i style="--c:var(--st2);--d:.75s"></i><i style="--c:var(--st3);--d:.15s"></i><i style="--c:var(--st2);--d:.5s"></i><i style="--c:var(--st4);--d:0s"></i><i style="--c:var(--st1);--d:.65s"></i>
  </div></div>
  <svg class="dk-mini" viewBox="0 0 96 150" aria-hidden="true">
    <path class="dk-str" d="M48 0V60"/><use href="#dk-orb" x="0" y="0" transform="translate(48 100) scale(.62)"/>
    <path class="dk-gl" style="--d:.4s" d="M30 78l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
  </svg>
  <div class="dk-card">
    <p class="dk-ct dk-gtxt a-pop" style="--d:.2s" data-t="title" data-fit="38,18,16"></p>
    <div class="dk-badges">
      <p class="dk-b a-left" style="--d:.7s" data-t="turn" data-if="turn" data-fit="16,11"></p>
      <p class="dk-b k a-right" style="--d:.9s" data-t="kassa" data-if="kassa" data-fit="16,11"></p>
    </div>
    <p class="dk-dt a-rise" style="--d:1.2s" data-t="date" data-fit="24,14"></p>
    <p class="dk-wt a-rise" style="--d:1.4s" data-t="wt"></p>
  </div>
</section>

<section class="sc s3">
  <svg class="dk-top" viewBox="0 0 60 100" aria-hidden="true"><path class="dk-str" d="M30 0V50"/><use href="#dk-orb" transform="translate(30 72) scale(.34)"/></svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <svg class="dk-arcs" viewBox="0 0 360 110" preserveAspectRatio="none" aria-hidden="true">
    <path class="dk-arc dk-a1" style="--d:.1s" d="M-10 120A190 92 0 0 1 370 120"/>
    <path class="dk-arc dk-a2" style="--d:.2s" d="M5 120A175 78 0 0 1 355 120"/>
    <path class="dk-arc dk-a3" style="--d:.3s" d="M20 120A160 64 0 0 1 340 120"/>
    <path class="dk-arc dk-a4" style="--d:.4s" d="M35 120A145 50 0 0 1 325 120"/>
  </svg>
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="spark" data-n="26" data-colors="var(--g1),#FFFFFF,var(--g3)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
