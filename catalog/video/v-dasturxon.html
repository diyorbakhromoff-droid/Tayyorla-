<style>
:root { --f-display: 'Philosopher', Georgia, serif; --f-body: 'Onest', system-ui, sans-serif; }
#tv { background: var(--bg); }
.dx-cloth { position: absolute; left: 0; right: 0; bottom: 0; height: 330px;
  background: repeating-linear-gradient(90deg, transparent 0 22px, color-mix(in srgb, var(--accent) 30%, transparent) 22px 30px),
    repeating-linear-gradient(0deg, transparent 0 22px, color-mix(in srgb, var(--accent) 30%, transparent) 22px 30px), var(--cloth); }
.dx-cloth::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 16px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 12px); }
.dx-flat { fill: color-mix(in srgb, var(--bread) 70%, #fff); }
.dx-ring { fill: none; stroke: var(--bread2); stroke-width: 2; stroke-dasharray: 3 5; }
.dx-stamp { fill: var(--bread2); }
.dx-seed { fill: #FFF6DF; opacity: .9; }
.dx-non { position: absolute; left: 70px; top: 300px; width: 220px; height: 220px; overflow: visible; filter: drop-shadow(0 18px 18px rgba(60, 30, 10, .35));
  animation: dx-drop 1.3s cubic-bezier(.3, 1.3, .5, 1) .5s both; }
.dx-turn { animation: dx-turn 30s linear 1.8s infinite both; }
@keyframes dx-drop { from { opacity: 0; transform: translateY(-260px) rotate(-200deg) scale(.7); } to { opacity: 1; transform: none; } }
@keyframes dx-turn { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.dx-head { position: absolute; left: 24px; right: 24px; top: 74px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.dx-inv { font-size: 16px; font-weight: 500; color: var(--muted); }
.dx-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.2; }
.dx-from { margin-top: 6px; padding: 6px 16px; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-size: 15px; font-weight: 600; }
.dx-card { position: absolute; left: 28px; right: 28px; top: 70px; bottom: 70px; border-radius: 18px; background: var(--card); overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px 22px; text-align: center;
  box-shadow: 0 18px 40px -26px rgba(0, 0, 0, .5); }
.dx-card::before, .dx-card::after { content: ""; position: absolute; left: 0; right: 0; height: 26px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 10px, var(--cloth) 10px 16px, var(--accent2) 16px 26px, var(--cloth) 26px 32px); }
.dx-card::before { top: 0; } .dx-card::after { bottom: 0; }
.dx-title { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 52px; line-height: 1.1; color: var(--accent); }
.dx-reason { max-height: 56px; overflow: hidden; font-size: 18px; line-height: 1.4; }
.dx-mini { width: 70px; height: 70px; margin: 6px 0; }
.dx-date { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; }
.dx-wt { font-size: 15px; color: var(--muted); }
.dx-host { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--accent2); }
.s3 .tv-details { padding-top: 60px; }
</style>
