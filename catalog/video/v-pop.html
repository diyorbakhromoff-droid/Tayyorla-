<style>
:root { --f-display: 'Rubik', system-ui, sans-serif; --f-body: 'Onest', system-ui, sans-serif; --msg-style: normal; }
#tv { background: var(--bg); }
.pp-tone { position: absolute; inset: 0; background: radial-gradient(circle, var(--dot) 34%, transparent 36%) 0 0 / 12px 12px; }
.bgk .pp-tone { opacity: .55; -webkit-mask-image: linear-gradient(160deg, #000 0%, transparent 55%, #000 100%); mask-image: linear-gradient(160deg, #000 0%, transparent 55%, #000 100%); }
.pp-pan { position: absolute; overflow: hidden; border: 4px solid var(--line); box-shadow: 7px 7px 0 var(--line); }
.pp-pan > .pp-tone { --dot: color-mix(in srgb, var(--line) 16%, transparent); -webkit-mask-image: radial-gradient(130% 100% at 100% 100%, #000 0%, transparent 70%); mask-image: radial-gradient(130% 100% at 100% 100%, #000 0%, transparent 70%); }
.pp-slam { animation: pp-slam .55s cubic-bezier(.2, 1.3, .4, 1) calc(var(--s) + var(--d, 0s)) both; }
@keyframes pp-slam { from { opacity: 0; transform: translate(var(--fx, 0), var(--fy, 0)) rotate(calc(var(--rot) * 4)) scale(1.1); } 40% { opacity: 1; } to { opacity: 1; transform: rotate(var(--rot)); } }
.pp-lines { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px;
  background: repeating-conic-gradient(color-mix(in srgb, var(--line) 22%, transparent) 0deg 3deg, transparent 3deg 12deg);
  -webkit-mask-image: radial-gradient(circle, transparent 12%, #000 30%); mask-image: radial-gradient(circle, transparent 12%, #000 30%); }
.pp-burst { overflow: visible; }
.pp-burst use, .pp-burst polygon { stroke: var(--line); stroke-width: 5; stroke-linejoin: round; }
.pp-out { color: #FFFFFF; -webkit-text-stroke: 7px var(--line); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--line); }
.pp-cap { display: inline-block; padding: 5px 12px; border: 3px solid var(--line); background: var(--pop1); color: var(--line);
  font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

/* 1. Uch panel */
.pp-a { left: 16px; right: 20px; top: 22px; height: 160px; background: var(--pop3); --rot: -1.5deg; --fx: -360px; }
.pp-bub { position: absolute; left: 18px; right: 18px; top: 20px; padding: 14px 16px 16px; border: 3px solid var(--line); border-radius: 50% / 46%; background: var(--paper);
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; color: var(--line); animation: tv-pop .5s cubic-bezier(.2, 1.6, .4, 1) .55s both; }
.pp-bub::after { content: ""; position: absolute; left: 46px; bottom: -20px; width: 26px; height: 24px; background: var(--paper); border: 3px solid var(--line); border-top: 0; border-left: 0;
  transform: skewX(30deg) rotate(14deg); }
.pp-inv { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.pp-dear { width: 100%; overflow: hidden; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.2; }
.pp-b { left: 22px; right: 14px; top: 196px; height: 232px; background: var(--pop1); --rot: 1.8deg; --fx: 380px; }
.pp-bw { position: absolute; left: 50%; top: 50%; width: 210px; height: 210px; margin: -105px 0 0 -105px; }
.pp-bw svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pp-boom { animation: pp-boom .7s cubic-bezier(.2, 1.7, .4, 1) 1.05s both, pp-jit 1.6s steps(2) 1.8s infinite both; }
@keyframes pp-boom { from { opacity: 0; transform: scale(0) rotate(-30deg); } to { opacity: 1; transform: none; } }
@keyframes pp-jit { 0% { transform: rotate(0); } 50% { transform: rotate(4deg) scale(1.03); } }
.pp-bnum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 74px; line-height: 1;
  transform: rotate(-6deg); }
.pp-bolt { position: absolute; left: 62px; top: 46px; width: 86px; height: 118px; }
.pp-bolt path { fill: var(--pop1); stroke: var(--line); stroke-width: 5; stroke-linejoin: round; }
.pp-b .pp-lines { animation: tv-fade .3s ease 1.05s both; }
.pp-shake { animation: pp-shake .45s linear 1.1s both; }
@keyframes pp-shake { 0%, 100% { translate: 0 0; } 20% { translate: -6px 3px; } 40% { translate: 5px -4px; } 60% { translate: -4px -2px; } 80% { translate: 3px 3px; } }
.pp-c { left: 14px; right: 22px; top: 442px; height: 168px; background: var(--pop2); --rot: -1deg; --fy: 300px; }
.pp-c .pp-cap { position: absolute; left: 14px; top: 14px; transform: rotate(-3deg); animation: tv-left .5s cubic-bezier(.2, 1.4, .4, 1) 2.2s both; }
.pp-name { position: absolute; left: 14px; right: 14px; top: 50px; height: 104px; display: flex; align-items: center; justify-content: center; }
.pp-name p { width: 100%; overflow: hidden; white-space: nowrap; padding: 4px 8px 10px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 58px; line-height: 1.05;
  text-transform: uppercase; animation: pp-punch .5s cubic-bezier(.2, 1.5, .4, 1) 1.95s both; }
@keyframes pp-punch { from { opacity: 0; transform: scale(2.4) rotate(-8deg); } to { opacity: 1; transform: rotate(-3deg); } }

/* 2. Katta panel */
.pp-big { left: 20px; right: 24px; top: 26px; bottom: 30px; background: var(--pop1); --rot: 0deg; }
.pp-big .pp-lines { top: 40%; animation: pp-turn 30s linear var(--s) infinite both; }
@keyframes pp-turn { to { rotate: 30deg; } }
.pp-big .pp-cap { position: absolute; left: 16px; top: 18px; background: var(--paper); }
.pp-shout { position: absolute; left: 6px; right: 6px; top: 118px; height: 200px; animation: tv-pop .6s cubic-bezier(.2, 1.6, .4, 1) calc(var(--s) + .4s) both; }
.pp-shout svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pp-shout polygon { fill: var(--paper); stroke: var(--line); stroke-width: 4; stroke-linejoin: round; }
.pp-sname { position: absolute; left: 48px; right: 48px; top: 44px; height: 112px; display: flex; align-items: center; justify-content: center; }
.pp-sname p { width: 100%; overflow: hidden; white-space: nowrap; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 50px; line-height: 1.05; text-transform: uppercase; color: var(--pop2); }
.pp-agew { position: absolute; right: 2px; top: 6px; width: 118px; height: 118px; animation: pp-boom .6s cubic-bezier(.2, 1.7, .4, 1) calc(var(--s) + .9s) both; }
.pp-agew svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pp-agew p { position: absolute; left: 20px; right: 20px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(8deg);
  font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.05; color: var(--line); }
.pp-date { position: absolute; left: 24px; right: 24px; top: 344px; display: flex; justify-content: center; }
.pp-date p { max-width: 100%; overflow: hidden; white-space: nowrap; padding: 8px 18px; border: 4px solid var(--line); background: var(--pop2); box-shadow: 5px 5px 0 var(--line);
  font-family: var(--f-display); font-weight: 700; font-size: 28px; color: #FFFFFF; transform: rotate(-3deg); }
.pp-wt { position: absolute; left: 24px; right: 24px; top: 430px; display: flex; justify-content: center; }
.pp-wt p { padding: 5px 14px; border: 3px solid var(--line); background: var(--paper); color: var(--line); font-size: 16px; font-weight: 700; white-space: nowrap; transform: rotate(2deg); }
.pp-mini { position: absolute; width: 70px; height: 70px; }

/* 3-4 */
.pp-sheet { left: 20px; right: 24px; top: 28px; bottom: 30px; background: var(--paper); --rot: 0deg; }
.pp-sheet .pp-cap { position: absolute; left: -4px; top: -4px; padding: 7px 14px; }
.pp-corner { position: absolute; right: 8px; top: 8px; width: 74px; height: 74px; z-index: 2; animation: pp-boom .6s cubic-bezier(.2, 1.7, .4, 1) calc(var(--s) + .4s) both; }
.s3 .tv-details, .s4 .tv-final { color: var(--line); }
.s3 .tv-details { padding: 80px 46px 56px; }
.s3 .d-msg { font-family: var(--f-body); font-weight: 700; font-size: 19px; color: var(--line); }
.s3 .d-day { font-weight: 700; color: var(--pop2); -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; }
.s3 .d-month, .s3 .d-venue { font-weight: 700; text-transform: uppercase; font-size: 21px; }
.s3 .d-wd, .s3 .d-addr, .s3 .d-scan { color: color-mix(in srgb, var(--line) 70%, transparent); }
.s3 .d-sign { font-family: var(--f-body); font-style: normal; font-size: 17px; }
.s3 .d-qrbox { border: 3px solid var(--line); }
.s4 .tv-final { padding: 70px 44px 100px; }
.s4 .f-event { color: var(--line); }
.s4 .f-names { font-weight: 700; font-size: 46px; text-transform: uppercase; color: var(--pop2); -webkit-text-stroke: 3px var(--line); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--line); padding-bottom: 4px; }
.s4 .f-date { font-weight: 700; }
.s4 .f-wait { color: color-mix(in srgb, var(--line) 75%, transparent); font-weight: 600; }
.s4 .f-photo { border: 4px solid var(--line); box-shadow: 5px 5px 0 var(--line); }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <polygon id="pp-star" points="100,2 114,40 138,21 139,52 175,40 156,73 183,81 162,100 191,121 156,127 165,152 139,148 139,181 114,160 100,198 86,160 62,179 61,148 25,160 44,127 17,119 38,100 9,79 44,73 35,48 61,52 61,19 86,40"/>
  <polygon id="pp-star2" points="60,2 71,22 89,15 90,34 112,36 100,54 112,68 96,77 102,97 82,94 75,110 60,100 44,113 38,94 16,98 24,77 7,68 20,54 8,36 30,34 31,15 49,22"/>
</defs></svg>
<div class="bgk"><div class="pp-tone"></div></div>

<section class="sc s1">
  <div class="pp-pan pp-a pp-slam" style="--d:.1s"><div class="pp-tone"></div>
    <div class="pp-bub">
      <p class="pp-inv" data-t="invite"></p>
      <p class="pp-dear" data-t="dear" data-if="guest" data-fit="26,14"></p>
    </div>
  </div>
  <div class="pp-pan pp-b pp-slam" style="--d:.55s"><div class="pp-shake" style="position:absolute;inset:0"><div class="pp-lines"></div><div class="pp-tone"></div>
    <div class="pp-bw"><div class="pp-boom" style="position:absolute;inset:0">
      <svg class="pp-burst" viewBox="0 0 200 200" aria-hidden="true"><use href="#pp-star" style="fill:var(--pop2)"/></svg>
      <p class="pp-bnum pp-out" data-t="age_n" data-if="age"></p>
      <svg class="pp-bolt" data-if="!age" viewBox="0 0 86 118" aria-hidden="true"><path d="M52 4L8 66H40L30 114L78 46H46Z"/></svg>
    </div></div>
  </div></div>
  <div class="pp-pan pp-c pp-slam" style="--d:1.5s"><div class="pp-tone"></div>
    <span class="pp-cap" data-t="event"></span>
    <div class="pp-name"><p class="pp-out" data-t="name" data-fit="58,24,18"></p></div>
  </div>
</section>

<section class="sc s2">
  <div class="pp-pan pp-big pp-slam" style="--d:0s;--fy:-40px"><div class="pp-lines"></div><div class="pp-tone"></div>
    <span class="pp-cap a-left" style="--d:.3s" data-t="event"></span>
    <div class="pp-agew" data-if="age"><svg class="pp-burst" viewBox="0 0 120 120" aria-hidden="true"><use href="#pp-star2" style="fill:var(--pop3)"/></svg><p data-t="age"></p></div>
    <div class="pp-shout">
      <svg viewBox="0 0 300 190" preserveAspectRatio="none" aria-hidden="true"><polygon points="296,95 271,106 282,119 262,127 258,139 243,146 246,165 216,160 207,174 185,169 168,175 150,172 129,186 115,169 93,174 84,160 66,156 57,146 27,145 38,127 18,119 29,106 22,95 29,84 10,69 38,63 35,48 57,44 66,34 84,30 89,11 115,21 130,9 150,18 168,15 185,21 211,11 216,30 240,30 243,44 258,51 262,63 290,69 271,84"/></svg>
      <div class="pp-sname"><p data-t="name" data-fit="50,17,14"></p></div>
    </div>
    <div class="pp-date a-pop" style="--d:1.1s"><p data-t="date" data-fit="28,15"></p></div>
    <div class="pp-wt a-rise" style="--d:1.35s"><p data-t="wt"></p></div>
    <svg class="pp-mini pp-burst a-pop" style="--d:1.6s;left:14px;bottom:20px" viewBox="0 0 120 120" aria-hidden="true"><use href="#pp-star2" style="fill:var(--pop2)"/></svg>
    <svg class="pp-mini pp-burst a-pop" style="--d:1.75s;right:24px;bottom:42px;width:46px;height:46px" viewBox="0 0 120 120" aria-hidden="true"><use href="#pp-star2" style="fill:var(--pop3)"/></svg>
  </div>
</section>

<section class="sc s3">
  <div class="pp-pan pp-sheet pp-slam" style="--d:0s;--fx:-30px"><div class="pp-tone"></div><span class="pp-cap" data-t="event"></span></div>
  <svg class="pp-corner pp-burst" viewBox="0 0 120 120" aria-hidden="true"><use href="#pp-star2" style="fill:var(--pop1)"/></svg>
  <div class="tv-details" data-std="details"></div>
</section>

<section class="sc s4">
  <div class="pp-pan pp-sheet pp-slam" style="--d:0s;--fy:40px"><div class="pp-lines" style="opacity:.5"></div><div class="pp-tone"></div></div>
  <svg class="pp-corner pp-burst" style="right:auto;left:10px;top:10px" viewBox="0 0 120 120" aria-hidden="true"><use href="#pp-star2" style="fill:var(--pop2)"/></svg>
  <svg class="pp-corner pp-burst" style="top:auto;bottom:110px;width:54px;height:54px" viewBox="0 0 120 120" aria-hidden="true"><use href="#pp-star2" style="fill:var(--pop3)"/></svg>
  <div class="tv-final" data-std="final"></div>
  <div class="ptc" data-particles="confetti" data-n="36" data-at="15.3" data-colors="var(--pop1),var(--pop2),var(--pop3),var(--line)"></div>
  <div class="tv-brand" data-std="brand" data-if="free"></div>
</section>
