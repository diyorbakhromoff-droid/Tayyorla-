<!-- Tayyorla: tabriklangan odamning javobi -->
<style>
.tyr-r{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:2147483000;font:500 15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;transition:transform .6s cubic-bezier(.2,1.3,.4,1);width:min(92vw,380px)}
.tyr-r.on{transform:translate(-50%,0)}
.tyr-pill{display:flex;align-items:center;gap:10px;width:100%;border:0;cursor:pointer;padding:10px 12px 10px 16px;border-radius:999px;background:#211C52;color:#fff;box-shadow:0 10px 30px rgba(33,28,82,.35);font:inherit}
.tyr-pill b{flex:1;text-align:left;font-weight:600}
.tyr-pill i{font-style:normal;background:#E0307A;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.tyr-card{display:none;background:#fff;color:#1C1830;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(33,28,82,.3)}
.tyr-r.open .tyr-pill{display:none}.tyr-r.open .tyr-card{display:block}
.tyr-card h4{margin:0 0 4px;font-size:18px}.tyr-card p{margin:0 0 12px;color:#6B6585;font-size:14px}
.tyr-em{display:flex;gap:8px;margin-bottom:12px}
.tyr-em button{flex:1;font-size:26px;padding:8px 0;border-radius:14px;border:2px solid #EEEAF8;background:#F7F5FC;cursor:pointer;transition:transform .15s}
.tyr-em button[aria-pressed=true]{border-color:#E0307A;background:#FDEAF2;transform:scale(1.08)}
.tyr-card textarea{width:100%;box-sizing:border-box;border:2px solid #EEEAF8;border-radius:14px;padding:10px 12px;font:inherit;resize:none;height:72px;color:#1C1830}
.tyr-card textarea:focus{outline:none;border-color:#211C52}
.tyr-row{display:flex;gap:8px;margin-top:10px}
.tyr-row button{border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.tyr-send{flex:1;background:#E0307A;color:#fff}.tyr-x{background:#F7F5FC;color:#6B6585}
.tyr-done{text-align:center}.tyr-done .big{font-size:44px;line-height:1}
.tyr-done a{display:block;margin-top:12px;background:#211C52;color:#fff;text-decoration:none;border-radius:14px;padding:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.tyr-r{transition:none}}
</style>
<div class="tyr-r" id="tyrR" role="dialog" aria-label="Javob yozish">
  <button class="tyr-pill" type="button" id="tyrOpen"><span>💌</span><b>{{ from_name }}ga javob qaytaring</b><i>Javob</i></button>
  <div class="tyr-card" id="tyrCard">
    <h4>Sizga yoqdimi?</h4>
    <p>Javobingiz {{ from_name }}ga yetkaziladi.</p>
    <div class="tyr-em" id="tyrEm">
      <button type="button" aria-pressed="true">❤️</button><button type="button" aria-pressed="false">🥹</button><button type="button" aria-pressed="false">🥰</button><button type="button" aria-pressed="false">🤗</button><button type="button" aria-pressed="false">🔥</button>
    </div>
    <textarea id="tyrMsg" maxlength="300" placeholder="Bir-ikki so'z yozing (ixtiyoriy)"></textarea>
    <div class="tyr-row"><button class="tyr-x" type="button" id="tyrClose">Keyinroq</button><button class="tyr-send" type="button" id="tyrSend">Yuborish</button></div>
  </div>
</div>
<script>
(function(){
  var R=document.getElementById('tyrR'),K='tyr-r-{{ slug }}',emoji='❤️',NAME={{ from_name|tojson }};
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
  try{if(localStorage.getItem(K))return}catch(e){}
  // Sahifa ko'rib chiqilgach chiqadi: pastga aylantirganda (kamida 8 soniyadan keyin) yoki {{ delay }} ms dan keyin
  var t0=Date.now(),shown=false;
  function show(){if(shown)return;shown=true;R.classList.add('on');removeEventListener('scroll',onScroll)}
  function onScroll(){var h=document.documentElement.scrollHeight;if(Date.now()-t0>8000&&scrollY+innerHeight>=h*0.6)show()}
  addEventListener('scroll',onScroll,{passive:true});
  setTimeout(show,{{ delay }});
  document.getElementById('tyrOpen').onclick=function(){R.classList.add('open')};
  document.getElementById('tyrClose').onclick=function(){R.classList.remove('open','on')};
  document.querySelectorAll('#tyrEm button').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('#tyrEm button').forEach(function(x){x.setAttribute('aria-pressed','false')});
    b.setAttribute('aria-pressed','true');emoji=b.textContent}});
  document.getElementById('tyrSend').onclick=function(){
    var btn=this;btn.disabled=true;
    fetch('/s/{{ slug }}/react',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({emoji:emoji,message:document.getElementById('tyrMsg').value})})
    .then(function(r){if(!r.ok)throw 0;
      try{localStorage.setItem(K,'1')}catch(e){}
      document.getElementById('tyrCard').innerHTML='<div class="tyr-done"><div class="big">'+emoji+'</div><h4>Yuborildi!</h4><p>'+esc(NAME)+' hozir xursand bo\'ladi.</p><a href="https://t.me/{{ bot }}?start=r_{{ slug }}">Siz ham yaqiningizni quvontiring ✨</a></div>';
    }).catch(function(){btn.disabled=false;btn.textContent='Qayta urinish'});
  };
})();
</script>
